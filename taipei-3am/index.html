<body>
<canvas id="c" aria-label="Taipei at three in the morning, seen from above like an old top-down crime game, with a clock, a money counter and subtitles. A guy in a white t-shirt and blue-and-white slippers has missed the last MRT and has to walk home drunk; his wobbly route is drawn on the street behind him while a GPS line keeps recalculating. Every corner has a convenience store, one crossing has four. Scooters stream past, some carrying a family of four and a dog, a gas cylinder, a mattress or a tree, and now and then a whole scooter waterfall pours down his street. He hugs lamp posts, refuses taxis, gets a visit from very polite police, buys salty fried chicken, asks the gods at a temple whether he'll get home by throwing moon blocks, runs screaming from a flying cockroach, chases the garbage truck playing Für Elise, picks up a stray dog, and sometimes meets someone stumbling out of the KTV. Everyone speaks Chinese with robot subtitles translated far too literally. Some nights there is a typhoon, a ghost month or an earthquake. When he gets home: mission passed, his stats, and dawn, with the breakfast shop opening and old people exercising in the park. Then another night, another Taipei."></canvas>

<script>
(() => {
  // A random walk on a flat city always comes home (Pólya). He always does. The bird, in three dimensions, only sometimes.
  const cv = document.getElementById('c');

  const FACE_BIG = 'Impact, "Arial Black", "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif';
  const ZH_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

  // ---------- the city ----------
  let W, H, DPR, U, SW, PAD, S, map, ink, ig, SAFE_T = 0, SAFE_B = 0, cols, rows, BLOCK_M;
  let blocks = [], lamps = [], cross = [], SX = [], SY = [], boxes = [], stores = [];
  let mrt, ktv, rechao, temple, homeA, homeB, bench, stall, betel, breakfast, tower;
  let C, GW, GH, open;
  const cen = b => ({ x: b.x + b.w / 2, y: b.y + b.h / 2 });

  const inBlock = (x, y, pad) => blocks.find(b => x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad && y < b.y + b.h + pad);

    const b = inBlock(x, y, pad);
    if (!b) return { x, y };

  // a shopfront in one corner of a block, its door out on the corner
  function corner(b, sx, sy, sz) {
    const cx = sx > 0 ? b.x + b.w : b.x, cy = sy > 0 ? b.y + b.h : b.y;

    ktv = take(b => Math.min(far(b, mrt), far(b, homeA)));
    homeB = take(b => far(b, ktv));
    temple = take(b => -Math.abs(far(b, mrt) - far(b, homeA)));
    for (const b of blocks) b.park = !b.role && chance(0.14);
    let parks = blocks.filter(b => b.park && b.inner);
    if (!parks.length) { const p = pick(inner.filter(b => !b.role)) || pick(blocks.filter(b => !b.role)); p.park = true; parks = [p]; }
    const P = pick(parks), pd = doorOf(P);
    bench = { x: pd.x - pd.nx * SW * 0.2, y: pd.y - pd.ny * SW * 0.2, nx: pd.nx, ny: pd.ny, horiz: pd.ny !== 0, taken: null, park: P };
    for (const b of [mrt, ktv, temple, homeA, homeB]) b.door = doorOf(b);
    const visible = b => onScreen(cen(b), SW);
    rechao = pick(blocks.filter(b => !b.role && !b.park && visible(b))) || null;
    if (rechao) rechao.role = true;
    tower = pick(blocks.filter(b => !b.role && !b.park && !b.inner && onScreen(cen(b)))) || null;
    if (tower) tower.role = true;
    // convenience stores: one crossing with one on every corner, and a few more
    const at = (c, r) => (c >= 0 && r >= 0 && c < cols && r < rows) ? blocks[r * cols + c] : null;
    const okStore = b => b && !b.park && b !== homeA && b !== homeB && b !== temple && b !== tower;
    const sz = SW * 1.15;
    const addStore = (b, sx, sy) => {
      const s = corner(b, sx, sy, sz);
      if (!onScreen({ x: s.cx, y: s.cy }, SW * 0.5) || !onScreen(s.door, U * 3)) return;
      if (stores.some(q => Math.hypot(q.cx - s.cx, q.cy - s.cy) < 1)) return;
      s.look = pick(STORE_LOOKS); s.visits = 0; stores.push(s);
    };
    let best = null, bs = -1;
    for (let i = 1; i < cols; i++) for (let j = 1; j < rows; j++) {
      if (!onScreen({ x: SX[i], y: SY[j] }, SW)) continue;
      const four = [[at(i - 1, j - 1), 1, 1], [at(i, j - 1), -1, 1], [at(i - 1, j), 1, -1], [at(i, j), -1, -1]];
      const n = four.filter(f => okStore(f[0])).length + rnd(0, 0.5);
      if (n > bs) { bs = n; best = four; }
    }
    if (best) for (const [b, sx, sy] of best) if (okStore(b)) addStore(b, sx, sy);
    for (let k = 0; k < 3; k++) { const b = pick(blocks.filter(okStore)); if (b) addStore(b, pick([-1, 1]), pick([-1, 1])); }

    breakfast = corner(homeA, hd.nx || pick([-1, 1]), hd.ny || pick([-1, 1]), SW * 1.05);
    const pois = () => [...stores.map(s => s.door), mrt.door, ktv.door, temple.door, homeA.door, homeB.door, bench, breakfast.door];
    const plain = b => !b.park && b !== temple && b !== homeA && b !== homeB && b !== tower;
    stall = pavement(pois(), plain);
    betel = pavement([...pois(), stall && stall.door], plain);

    C = SW * 0.2; GW = Math.ceil(W / C); GH = Math.ceil(H / C);

    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const x = (i + 0.5) * C, y = (j + 0.5) * C;
      open[j * GW + i] = x > U * 2 && x < W - U * 2 && y > U * 2 && y < H - U * 2 && !inBlock(x, y, PAD) ? 1 : 0;
    }
    homeA.field = field(homeA.door); homeB.field = field(homeB.door);
    for (const h of [homeA, homeB]) {
      const x = h.x + h.w * 0.22, y = h.y + h.h * 0.22, w = h.w * 0.56, hh = h.h * 0.56;
      h.roofR = { x, y, w, h: hh };
      h.sky = { x: x + w * 0.38, y: y + hh * 0.16, w: w * 0.24, h: hh * 0.18 };
      h.ridge = { x: x + w * 0.72, y: y + hh / 2 };

    ig = ink.getContext('2d'); ig.setTransform(DPR, 0, 0, DPR, 0, 0); ig.lineCap = 'round'; ig.lineJoin = 'round';
  }
  const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]], N8 = [...N4, [1, 1], [1, -1], [-1, 1], [-1, -1]];

      if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue;

  function field(p) {

  const SIGNS = [['牙醫', '#2d7fd0'], ['藥局', '#1f9a52'], ['補習班', '#d63a2f'], ['滷肉飯', '#e0a020'], ['當舖', '#7a2a2a'], ['旅館', '#a43ab0'], ['珍奶', '#c98a3a'],
    ['便當', '#d65a20'], ['眼鏡', '#2a6ad0'], ['彩券', '#d8283a'], ['夾娃娃', '#e0409a'], ['洗衣', '#2aa0c0'], ['水餃', '#c84a2a'], ['手機', '#3050b0'], ['五金', '#8a6a2a'], ['理髮', '#c03040'], ['麵', '#d07a20']];
