<style>
  /* Layout: one endless dark field, no interface. Small lantern-bodied beings with eyes talk to each other in pronouns: groups turn through as many dimensions as they have members minus one, and each body holds its own glowing parts. Single-theme dark by choice. */
  :root { color-scheme: dark; --void: #040405; }
  html, body { height: 100%; background: var(--void); }
  body { margin: 0; overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); text-align: center; font: italic 15px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: 0.04em; color: #ece5d5; opacity: 0; pointer-events: none; animation: hint 7s ease-in-out 1.5s forwards; }
  @keyframes hint { 0% { opacity: 0; } 20% { opacity: 0.6; } 75% { opacity: 0.6; } 100% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="c" aria-label="An endless generative piece after the poem Ziran, with no controls; tap to turn sound on or off. Small soft-bodied beings with eyes and mouths drift in the dark, each one glowing with smaller lights inside it. They speak to each other in short lines that appear above them, using only pronouns: I, you, we, and he, she or it for whoever they are talking about. When one speaks, a bead of light travels to the one it addresses, its mouth moves and it looks at them, while the others glance at whoever is being talked about. They pair off, call in the ones left alone, sometimes give each other a piece of themselves, leave, and merge into larger groups, each group turning as the shadow of an even shape in as many dimensions as it has members minus one. Those left alone long enough fall asleep, and are the first to be called."></canvas>
<div id="hint">tap for sound</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2, DH = 6;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const gauss = () => (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.732;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function hsl(h, s, l) {
    h = (((h % 360) + 360) % 360) / 360;
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3), f(h), f(h - 1 / 3)].map(v => Math.round(v * 255));
  }
  const css = c => c[0] + ',' + c[1] + ',' + c[2];
  const mix = (a, b, t) => [0, 1, 2].map(k => Math.round(lerp(a[k], b[k], t)));
  const BONE = [236, 229, 213];

  // ---------- turning through the hidden dimensions ----------
  function rotate(R, a, b, th) {
    const c = Math.cos(th), s = Math.sin(th);
    for (let r = 0; r < DH; r++) { const x = R[r][a], y = R[r][b]; R[r][a] = c * x - s * y; R[r][b] = s * x + c * y; }
  }
  function orthonormalize(R) {
    for (let i = 0; i < DH; i++) {
      for (let j = 0; j < i; j++) { let d = 0; for (let k = 0; k < DH; k++) d += R[i][k] * R[j][k]; for (let k = 0; k < DH; k++) R[i][k] -= d * R[j][k]; }
      let n = 0; for (let k = 0; k < DH; k++) n += R[i][k] * R[i][k];
      n = Math.sqrt(n) || 1; for (let k = 0; k < DH; k++) R[i][k] /= n;
    }
  }
  function turner(speed) {
    const R = [];
    for (let i = 0; i < DH; i++) { const r = new Float64Array(DH); r[i] = 1; R.push(r); }
    for (let a = 0; a < DH; a++) for (let b = a + 1; b < DH; b++) rotate(R, a, b, rnd(0, TAU));
    const planes = [];
    for (let a = 0; a < DH; a++) for (let b = a + 1; b < DH; b++)
      if (Math.random() < 0.5) planes.push({ a, b, w: rnd(0.4, 1) * speed * (Math.random() < 0.5 ? -1 : 1) });
    return { R, planes, speed, n: 0 };
  }
  function turn(t, dt, mul) {
    for (const p of t.planes) {
      p.w = clamp(p.w + gauss() * t.speed * 0.06 * Math.sqrt(dt), -t.speed * 1.3, t.speed * 1.3);
      rotate(t.R, p.a, p.b, p.w * dt * mul);
    }
    if (++t.n % 120 === 0) orthonormalize(t.R);
  }
  const P = new Float64Array(3);
  function proj(t, v) {
    const R = t.R; let x = 0, y = 0, z = 0;
    for (let d = 0; d < DH; d++) { const q = v[d]; x += R[0][d] * q; y += R[1][d] * q; z += R[2][d] * q; }
    P[0] = x; P[1] = y; P[2] = z;
  }

  // ---------- a We: m members equally near one another, a regular simplex in m - 1 dimensions ----------
  class We {
    constructor(speed) { this.m = []; this.tn = turner(speed); }
    get size() { return this.m.length; }
    freeSlot() { for (let i = 0; i < DH; i++) if (!this.m.some(x => x.slot === i)) return i; return -1; }
    add(x, snap) {
      x.slot = this.freeSlot(); this.m.push(x);
      if (!x.s) x.s = new Float32Array(DH);
      if (!x.tg) x.tg = new Float32Array(DH);
      this.retarget();
      if (snap) x.s.set(x.tg);
    }
    remove(x) { const i = this.m.indexOf(x); if (i >= 0) this.m.splice(i, 1); this.retarget(); }
    retarget() {
      const n = this.m.length;
      for (const x of this.m) {
        x.tg.fill(0);
        if (n < 2) continue;
        const k = 1 / Math.sqrt(1 - 1 / n);
        for (const y of this.m) x.tg[y.slot] -= k / n;
        x.tg[x.slot] += k;
      }
    }
    step(dt, mul) {
      turn(this.tn, dt, mul);
      const k = clamp(dt * 1.1);
      for (const x of this.m) for (let d = 0; d < DH; d++) x.s[d] += (x.tg[d] - x.s[d]) * k;
    }
  }

  // ---------- what they say ----------
  // lines in each situation; {he}/{him}/{his} becomes he, she or it for whoever is being talked about
  const BOOK = {
    chat: [
      '{he} keeps a piece of you, you know.', 'do you think {he} can hear us?', '{he} was here before the dark was.',
      'I like the way {he} turns.', 'you and {him}, same color now.', '{he} gave me this blue.',
      '{he} talks to the dark when we\'re quiet.', 'I was {him} for a minute once.', '{he} counts us when we sleep.',
      'listen. {he}\'s humming again.', '{he} looks like {thing} from here.', '{he} told me about {thing}.',
      'we should be nicer to {him}.', '{he} thinks you\'re the center.', 'don\'t tell {him}, but I\'m mostly {him} now.',
      '{he} owes me a side.', 'is it raining or is it just {him}?', '{he} says we\'re a shape.',
      'I can\'t tell where {he} ends.', 'ask {him} about the snake.', '{his} insides are so loud tonight.'
    ],
    chat0: [
      'you look different from here.', 'say it again, slower.', 'I\'m mostly you by now.', 'you\'re my favorite angle.',
      'I dreamed you had five sides.', 'you smell like {thing}.', 'do you remember {thing}?', 'I keep thinking about {thing}.',
      'you turned while I wasn\'t looking.', 'are we close or is it the light?', 'I to you am you. still.',
      'that\'s a lot of dimensions for a tuesday.', 'hold still. no, don\'t.', 'you\'re warm on this side.'
    ],
    pair: ['hey. you.', 'you there. want to be a line?', 'come be two with me.', 'you look like you need a you.', 'the dark\'s big. stand here.'],
    pairback: ['okay. you.', 'nobody\'s called me you in ages.', 'two is easy. let\'s.', 'fine, but I\'m the left one.'],
    reach: ['hey, you. yes, you.', 'come closer, the dark\'s cold.', 'we saved you a corner.', 'there\'s room. there\'s always room.', 'you\'ve been quiet a long time.', 'you there. want to be a you?'],
    accept: ['okay. I\'m coming.', 'is it warm in there?', 'fine. but I keep my colors.', 'I thought you\'d never ask.', 'wait for me.'],
    gift: ['here. take this. it\'s mine.', 'keep this for me.', 'a piece of me for a piece of you.', 'you\'ll need this later.', 'it\'s small, but it turns.'],
    got: ['oh. it\'s still warm.', 'it fits.', 'now I\'m a little you.', 'I\'ll keep it lit.'],
    leave: ['I need some dark for a while.', 'don\'t wait up.', 'I\'ll be a they for a bit.', 'it\'s not you. it\'s the dimensions.', 'back soon. probably.'],
    across: ['you\'re bigger than you looked.', 'how many sides do you have?', 'we have four dimensions, come over.', 'your shape is showing.', 'hey, other we.'],
    merge: ['well. now we\'re everybody.', 'make room, make room.', 'so this is a big we.', 'more of us. more corners.']
  };
  const SITS = Object.keys(BOOK);
  const THINGS = ['rain on a scooter seat', 'the river at low tide', 'a night market at closing', 'warm rice', 'the 2am bus',
    'a moon in a puddle', 'cold tea', 'fireworks over somebody else\'s city', 'a kitten asleep on a planter', 'wet concrete',
    'the inside of a song', 'salt in water', 'a lighthouse with nobody in it', 'the place where the tide stops',
    'a mango at the end of summer', 'a radio left on in another room', 'a snake in the grass', 'the last train to the sea',
    'a temple at noon', 'the smell after lightning'];
  const PRON = { he: ['he', 'him', 'his'], she: ['she', 'her', 'her'], it: ['it', 'it', 'its'] };
  const decks = {}, script = {};
  function fromBook(sit) {
    if (!decks[sit] || !decks[sit].length) {
      const d = BOOK[sit].slice();
      for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
      decks[sit] = d;
    }
    return decks[sit].pop();
  }
  function lineFor(sit, about) {
    let t = (script[sit] && script[sit].length ? script[sit].shift() : null) || fromBook(sit);
    const p = PRON[about ? about.pron : 'it'];
    t = t.replace(/\{thing\}/g, () => pick(THINGS));
    return t.replace(/\{He\}/g, p[0][0].toUpperCase() + p[0].slice(1)).replace(/\{he\}/g, p[0]).replace(/\{him\}/g, p[1]).replace(/\{his\}/g, p[2]);
  }

  // ---------- world ----------
  let W = 0, H = 0, U = 1, DPR = 1, CR = 1.1, FS = 13;
  let T = 0, gen = 0, POP = 8, h0 = rnd(0, 360), weId = 0;
  let beings = [], wes = [], beads = [], rings = [], transit = [];
  let nextReach = 1e9, nextPair = 1e9, nextLeave = 1e9, nextAcross = 1e9;
  const talks = new Map();
  const tally = { said: 0, pairs: 0, joins: 0, leaves: 0, merges: 0, gifts: 0, scripted: 0, asked: 0 };
  const rWe = m => U * (0.085 + 0.03 * m);
  const rBody = n => U * (0.032 + 0.0045 * n) * (U < 520 ? 1.25 : 1);
  const rSub = k => U * (0.004 + 0.0014 * k);
  const PENT = [0, 2, 4, 7, 9];
  const noteFor = i => Math.pow(2, (PENT[i % 5] + 12 * (Math.floor(i / 5) % 2)) / 12);
  const isIt = b => !b.we && b.alpha > 0.9 && T - b.last > 18;
  const TEMPERS = ['shy', 'bold', 'tender', 'wry', 'sleepy', 'curious', 'restless', 'solemn', 'silly'];

  function makeSub(hue) {
    const col = hsl(hue + gauss() * 7, rnd(0.5, 0.72), 0.66);
    const s = { col, cstr: 'rgb(' + css(col) + ')', inner: new We(rnd(0.5, 0.9)), x: 0, y: 0, z: 0, rad: 0, flash: 0, next: rnd(0, 0.6) };
    const k = rint(2, 4);
    for (let i = 0; i < k; i++) s.inner.add({ x: 0, y: 0, z: 0, flash: 0 }, true);
    s.rad = rSub(k);
    return s;
  }
  function spawnBeing(x, y) {
    const i = beings.length, hue = h0 + i * 137.508;
    const r = Math.random();
    const b = {
      id: i, col: hsl(hue, 0.62, 0.7), note: noteFor(i), pron: r < 0.4 ? 'he' : r < 0.8 ? 'she' : 'it', temper: pick(TEMPERS),
      lx: x, ly: y, vx: 0, vy: 0, x, y, z: 0, we: null, attach: 0, alpha: 0,
      last: T, busy: 0, flash: 0, ring: 0, cI: 0, cY: 0, cR: 0,
      inner: new We(rnd(0.18, 0.32)), R: 0, next: rnd(0.3, 1.2),
      // a face
      gx: 0, gy: 0.3, blinkAt: -9, blinkNext: rnd(1, 5), mouth: 0, hop: 0, breathW: rnd(0.7, 1.2), ph: rnd(0, TAU),
      w1: rnd(0, TAU), w2: rnd(0, TAU), w3: rnd(0, TAU), lookAt: null, lookUntil: 0, idle: null, idleUntil: 0, idleAng: rnd(0, TAU),
      line: null, lineT: 0, lineDur: 0, talkUntil: 0, rows: null, pending: null, bc: null
    };
    const n = rint(3, 5);
    for (let k = 0; k < n; k++) b.inner.add(makeSub(hue), true);
    b.R = rBody(n);
    beings.push(b);
    return b;
  }
  function spot() {
    let best = [W / 2, H / 2], bs = -1e9;
    for (let k = 0; k < 40; k++) {
      const x = rnd(0.12, 0.88) * W, y = rnd(0.14, 0.88) * H;
      let d = 1e9;
      for (const b of beings) d = Math.min(d, Math.hypot(b.x - x, b.y - y));
      for (const w of wes) d = Math.min(d, Math.hypot(w.cx - x, w.cy - y) - w.rad);
      if (d > bs) { bs = d; best = [x, y]; }
    }
    return best;
  }

  // ---------- speaking ----------
  function speak(b, text, to) {
    b.line = text; b.lineT = T; b.rows = null;
    b.lineDur = clamp(1.7 + 0.055 * text.length, 2.2, 5.5);
    b.talkUntil = T + clamp(0.085 * syllables(text), 0.3, 1.6);
    b.hop = 1;
    if (to) { b.lookAt = to; b.lookUntil = T + b.lineDur; }
    sound.babble(b, text);
  }
  const syllables = t => Math.max(2, Math.round(t.replace(/[^a-z]/gi, '').length / 3));

  function say(a, b, kind, extra = {}) {
    const dur = clamp(Math.hypot(b.x - a.x, b.y - a.y) / (U * 0.32), 0.7, 2.2);
    const bd = { a, b, kind, t: 0, dur, col: a.col, level: 0, ...extra };
    if (bd.carry) { a.inner.remove(bd.carry); transit.push({ s: bd.carry, bd }); }
    beads.push(bd);
    a.flash = 1; a.cI++; a.busy = b.busy = T + dur + 0.4;
    tally.said++;
    const sit = extra.sit || kind;
    speak(a, extra.text || lineFor(sit, extra.about), b);
    return bd;
  }

  function arrive(bd) {
    const { a, b, kind } = bd;
    b.flash = 1; b.last = T; b.cY++;
    b.lookAt = a; b.lookUntil = T + 1.5;
    sound.hear(b);
    if (bd.carry) {
      const s = bd.carry;
      transit = transit.filter(q => q.s !== s);
      s.s = new Float32Array(DH);
      b.inner.add(s, false);
      tally.gifts++; sound.gift(b);
      if (Math.random() < 0.55) b.pending = { sit: 'got', at: T + 0.5, to: a };
    }
    if (kind === 'reach') {
      if (!b.we && a.we && Math.random() < 0.65) say(b, a, 'accept', { target: a.we });
    } else if (kind === 'accept') {
      const w = bd.target;
      if (!a.we && wes.includes(w) && b.we === w && w.size < DH) join(a, w);
    } else if (kind === 'pair') {
      if (!a.we && !b.we && (bd.sure || Math.random() < 0.85)) say(b, a, 'pairback', bd.reply ? { text: bd.reply } : {});
    } else if (kind === 'pairback') {
      if (!a.we && !b.we) makeWe([b, a]);
    } else if (kind === 'across') {
      const A = a.we, B = b.we;
      if (A && B && A !== B) {
        const key = Math.min(A.id, B.id) + '-' + Math.max(A.id, B.id);
        const n = (talks.get(key) || 0) + 1; talks.set(key, n);
        if (n >= 2 && A.size + B.size <= DH) { talks.delete(key); A.size <= B.size ? merge(A, B) : merge(B, A); }
      }
    }
  }

  function enter(b, w) {
    b.lx = b.x; b.ly = b.y; b.we = w; b.attach = 0;
    b.s = new Float32Array(DH); b.tg = new Float32Array(DH);
    w.add(b, true);
  }
  function makeWe(list) {
    const w = new We(rnd(0.05, 0.1));
    w.id = ++weId;
    w.cx = list.reduce((s, b) => s + b.x, 0) / list.length;
    w.cy = list.reduce((s, b) => s + b.y, 0) / list.length;
    w.vx = 0; w.vy = 0; w.rad = rWe(list.length) * 0.7; w.next = T + rnd(2, 3.5);
    for (const b of list) enter(b, w);
    wes.push(w); tally.pairs++;
    rings.push({ x: w.cx, y: w.cy, r0: U * 0.03, r1: rWe(2) * 1.3, t: 0, dur: 2.5, col: list[0].col });
    sound.chord(w);
  }
  function join(b, w) {
    enter(b, w);
    tally.joins++;
    rings.push({ x: w.cx, y: w.cy, r0: w.rad * 0.5, r1: rWe(w.size) * 1.25, t: 0, dur: 2.5, col: b.col });
    sound.chord(w);
  }
  function merge(A, B) {
    const newcomers = A.m.slice();
    for (const b of newcomers) { A.remove(b); enter(b, B); }
    wes.splice(wes.indexOf(A), 1);
    tally.merges++;
    rings.push({ x: B.cx, y: B.cy, r0: B.rad * 0.4, r1: rWe(B.size) * 1.4, t: 0, dur: 3, col: BONE });
    sound.chord(B);
    const host = pick(B.m.filter(x => !newcomers.includes(x))) || pick(B.m);
    if (host) speak(host, lineFor('merge'), pick(newcomers));
  }
  function release(b, w, push) {
    w.remove(b); b.we = null; b.attach = 0; b.lx = b.x; b.ly = b.y;
    const dx = b.x - w.cx, dy = b.y - w.cy, d = Math.hypot(dx, dy) || 1;
    b.vx = (dx / d) * U * push; b.vy = (dy / d) * U * push;
  }
  function leave(b) {
    const w = b.we; if (!w) return;
    release(b, w, 0.035);
    tally.leaves++; sound.leave(b);
    speak(b, lineFor('leave'), null);
    b.idle = null; b.idleAng = Math.atan2(b.vy, b.vx); b.idleUntil = T + 4;
    if (w.size === 1) release(w.m[0], w, 0.02);
    if (w.size === 0) wes.splice(wes.indexOf(w), 1);
  }

  // inside a We, everyone takes every part in turn: the one speaking, the one spoken to, the one spoken of
  function converse(w) {
    const M = w.m; if (M.length < 2) return;
    const order = (arr, key) => arr.map(x => [x[key] + Math.random() * 0.9, x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
    const a = order(M, 'cI')[0];
    const b = order(M, 'cY').find(x => x !== a);
    let r = null;
    if (M.length >= 3) r = order(M, 'cR').find(x => x !== a && x !== b);
    else {
      const out = beings.filter(x => !x.we && x.alpha > 0.5);
      if (out.length && Math.random() < 0.6) r = order(out, 'cR')[0];
    }
    if (r) { r.ring = 1; r.cR++; }
    const carry = Math.random() < 0.14 && a.inner.size >= 3 && b.inner.size <= 5 ? pick(a.inner.m) : null;
    say(a, b, 'in', { sit: carry ? 'gift' : r ? 'chat' : 'chat0', about: r, carry });
  }
  function reach() {
    const loose = beings.filter(b => !b.we && b.alpha > 0.8 && T > b.busy);
    const open = wes.filter(w => w.size < DH);
    if (!loose.length || !open.length) return;
    loose.sort((p, q) => p.last - q.last);
    const b = Math.random() < 0.6 ? loose[0] : pick(loose);
    open.sort((p, q) => Math.hypot(p.cx - b.x, p.cy - b.y) - Math.hypot(q.cx - b.x, q.cy - b.y));
    const w = Math.random() < 0.7 ? open[0] : pick(open);
    const a = w.m.slice().sort((p, q) => p.cI - q.cI)[0];
    say(a, b, 'reach');
  }
  function pairUp() {
    if (wes.length >= Math.floor(POP / 2.5)) return;
    const loose = beings.filter(b => !b.we && b.alpha > 0.8 && T > b.busy);
    if (loose.length < 2) return;
    const a = pick(loose);
    const b = loose.filter(x => x !== a).sort((p, q) => Math.hypot(p.x - a.x, p.y - a.y) - Math.hypot(q.x - a.x, q.y - a.y))[0];
    say(a, b, 'pair');
  }
  function leaveSome() {
    const loose = beings.filter(b => !b.we).length;
    if (loose > POP * 0.5) return;
    const full = wes.filter(w => w.size === DH);
    let w = null;
    if (full.length && Math.random() < 0.6) w = pick(full);
    else {
      const c = wes.filter(x => x.size >= 3 || Math.random() < 0.25);
      if (c.length) w = c.map(x => [Math.random() * (x.size - 1.5), x]).sort((p, q) => q[0] - p[0])[0][1];
    }

  // ---------- the poem, in order: I, then You, then We, then They ----------

  function wrap(text, maxW) {

    return {
      on: () => on,
      toggle: async () => {
        if (!a && !init()) return false;
        on = !on;
        if (on) { try { await a.resume(); } catch (e) {} master.gain.setTargetAtTime(0.85, a.currentTime, 0.8); }
        else master.gain.setTargetAtTime(0, a.currentTime, 0.25);
        return on;
      },
      // a voice made of short notes, falling a little at the end of the line
      babble: (b, text) => {
        if (!on) return;
        const n = Math.min(14, syllables(text)), base = root * 4 * b.note;
        let at = 0.02;
        for (let i = 0; i < n; i++) {
          const f = base * Math.pow(2, (rint(-2, 3) - (i >= n - 2 ? 3 : 0)) / 12);
          tone(f, 0.04, 0.07, b.x, at, 'triangle');
          at += rnd(0.065, 0.1);
        }
      },
      hear: b => tone(root * 4 * b.note, 0.03, 1.1, b.x),
      chord: w => w.m.forEach((b, i) => tone(root * 4 * b.note, 0.045, 3, b.x, i * 0.09)),
      leave: b => tone(root * 2 * b.note, 0.06, 2.2, b.x),
      gift: b => tone(root * 8 * b.note, 0.025, 0.8, b.x),
      mood: c => { if (on) padF.frequency.setTargetAtTime(200 + 800 * c, a.currentTime, 2); }
    };
  })();

  // ---------- inside Claude's viewer, a tap can also ask for fresh lines ----------
  let sampler = null, asking = false, lastAsk = -1e9, sampleOff = false;
  try {
    if (window.claude && typeof window.claude.use === 'function') window.claude.use('sample').then(s => { sampler = s; }, () => {});
  } catch (e) {}
  const POEM = 'pronouns / control / who does what / to whom / and are / therefore / the seat / of power. // we wrestle / through language / to get to be / the I / that does / what we would like / to do. // each of us / is an I, / and to each of us, / each of us / is a You. // I to myself / am I / and I to you / am You. // naturally, / all of these I\'s / who are You\'s / to each other / form a big We. // conversely, / there are those / who are neither / You / nor I / to us. // We call them / They. // They are / He, She / or It; we are all as much I, You, He, She, and It altogether all the time, and as such, nothing gets left out.';
  function worldNow() {
    const groups = wes.map(w => w.size).sort((p, q) => q - p);
    const loose = beings.filter(b => !b.we).length, asleep = beings.filter(isIt).length;
    return beings.length + ' beings. groups of ' + (groups.join(', ') || 'nobody yet') + '; ' + loose + ' alone' +
      (asleep ? ', ' + asleep + ' of them asleep from being alone so long' : '') + '. so far ' + tally.gifts +
      ' pieces given away, ' + tally.merges + ' groups merged, ' + tally.leaves + ' left a group for a while. their tempers: ' +
      [...new Set(beings.map(b => b.temper))].join(', ') + '.';
  }
  async function askForLines() {
    if (!sampler || sampleOff || asking || T - lastAsk < 20) return;
    asking = true; lastAsk = T; tally.asked++;
    const prompt = 'You are writing lines for tiny beings in a wordless generative animation after this short poem by Denis Popa, called "Ziran" (slashes are line breaks):\n\n' + POEM +
      '\n\nThe beings have no names. They speak to each other in short lines of 3 to 10 words, all lowercase except the pronoun I. They refer to each other only with pronouns. When a line talks about a third being, write {he}, {him} or {his} and the page will put in he, she or it.\n\n' +
      'Situations:\n- chat: to someone in your group, about a third being (use {he}/{him}/{his} once)\n- chat0: to someone in your group, no third being\n- pair: to a lone being, asking them to pair up\n- pairback: the lone being saying yes\n- reach: calling a lonely being to join your group\n- accept: the lonely one answering yes\n- gift: as you give the other a piece of yourself\n- got: just after receiving a piece of someone\n- leave: as you leave your group for a while\n- across: to someone in another group\n- merge: as two groups become one\n\n' +
      'Right now in their world: ' + worldNow() + '\n\n' +
      'Tone: tender, funny, strange and concrete, like things overheard at 3am in a city by a river. Images over abstractions. Never mention screens, code, simulations, AI, the poem itself, or anyone watching.\n\n' +
      'Reply with only a JSON object with these keys and arrays of strings: {"chat": [10], "chat0": [8], "pair": [3], "pairback": [3], "reach": [4], "accept": [3], "gift": [3], "got": [3], "leave": [3], "across": [3], "merge": [2]} (the numbers are how many lines each array should hold).';
    try {
      const data = await sampler.json(prompt, { modelTier: 'quick', cache: false });
      let n = 0;
      for (const sit of SITS) {
        const arr = data && Array.isArray(data[sit]) ? data[sit] : [];
        const good = arr.filter(s => typeof s === 'string').map(s => s.trim().replace(/^["']|["']$/g, '').replace(/\s+/g, ' ')).filter(s => s && s.length <= 80);
        if (good.length) { script[sit] = good.concat(script[sit] || []).slice(0, 24); n += good.length; }
      }
      tally.scripted += n;
    } catch (e) {
      const c = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) sampleOff = true;
      if (c === 'rate_limited') lastAsk = T + 120;
    } finally { asking = false; }
  }
  cv.addEventListener('pointerdown', async () => { const on = await sound.toggle(); if (on) askForLines(); });

  // ---------- size ----------
  function size() {
    const oW = W, oH = H;
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; U = Math.min(W, H);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CR = clamp(U * 0.0016, 0.9, 1.5);
    FS = Math.round(clamp(U * 0.032, 12, 16));
    for (const b of beings) b.rows = null;
    if (oW) {
      const sx = W / oW, sy = H / oH;
      for (const b of beings) { b.lx *= sx; b.ly *= sy; b.x *= sx; b.y *= sy; }
      for (const w of wes) { w.cx *= sx; w.cy *= sy; }
      for (const r of rings) { r.x *= sx; r.y *= sy; }
    } else POP = Math.round(clamp(5 * Math.sqrt((W * H) / (390 * 844)), 6, 11));
  }

  // ---------- run ----------
  let last = performance.now(), moodAt = 0;
  function loop(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
    update(dt);
    draw();
    if (T - moodAt > 0.5) { moodAt = T; sound.mood(beings.length ? beings.filter(b => b.we).length / beings.length : 0); }
    requestAnimationFrame(loop);
  }
  // for testing from outside; nothing on screen
  window.__z2 = {
    ff(sec, h = 1 / 30) { for (let t = 0; t < sec; t += h) update(h); draw(); },
    stats() {
      return {
        T: +T.toFixed(1), beings: beings.length, loose: beings.filter(b => !b.we).length, asleep: beings.filter(isIt).length,
        wes: wes.map(w => w.size), lines: beings.filter(b => b.line).map(b => b.line), tally: { ...tally },
        script: Object.fromEntries(SITS.map(s => [s, (script[s] || []).length]))
      };
    },
    ask: () => askForLines()
  };
  addEventListener('resize', size);
  size();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
