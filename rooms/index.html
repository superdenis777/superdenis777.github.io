<style>

  #hint { bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px)); font: italic 300 clamp(14px, 3.8vw, 18px)/1.4 var(--story); letter-spacing: 0.04em; text-shadow: 0 1px 10px rgba(0, 0, 20, 0.9); }

<body>
<canvas id="c" aria-label="A Taipei walk-up apartment building in Xizhi drawn in pixel art and cut open like a dollhouse, living through days that never repeat: people cook, sleep, watch TV, pray at a home altar, play mahjong on Saturday nights, run down with their bags when the garbage truck comes playing Für Elise; a breakfast shop opens at dawn, scooters swarm at rush hour, it rains, and a man in the rooftop add-on plays guitar to his cat. Tap anywhere for sound."></canvas>
<div id="title" class="over">Rooms</div>
<div id="hint" class="over">tap anywhere for sound</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
  const titleEl = document.getElementById('title'), hintEl = document.getElementById('hint');
  const mkC = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d')]; };
  const [lo, lc] = mkC(), [wc, wx] = mkC(), [lm, lx] = mkC(), [mk, mx] = mkC();
  let nbc = null, nbx = null;
  const TAU = Math.PI * 2, DT = 1 / 60;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const rand = Math.random, pick = a => a[Math.floor(rand() * a.length)], J = a => (rand() * 2 - 1) * a;
  let sd = 1; const srnd = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; }, spick = a => a[Math.floor(srnd() * a.length)];
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const css = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;
  const shade = (h, k) => css(hex(h).map(v => v * k));

  // ---------- the clock: one minute of the building's day passes every second ----------
  const SPEED = 1, START = 4 * 1440 + 17 * 60 + 16; // Friday, 17:16
  let rt = 0;
  const now = () => START + rt * SPEED, mod = m => ((m % 1440) + 1440) % 1440, dayOf = m => Math.floor(m / 1440) % 7;
  function kfc(arr, t) {
    for (let i = 0; i < arr.length - 1; i++) { const a = arr[i], b = arr[i + 1]; if (t >= a[0] && t <= b[0]) return mixc(a[1], b[1], (t - a[0]) / (b[0] - a[0] || 1)); }
    return arr[arr.length - 1][1];
  }
  const H6 = a => a.map(([t, c]) => [t, hex(c)]);
  const AMB = H6([[0, '#3a4270'], [290, '#3a4270'], [340, '#6e6496'], [375, '#e1beb4'], [420, '#ffffff'], [985, '#fffcf4'], [1018, '#ffd6af'], [1040, '#c492a8'], [1066, '#6c6296'], [1098, '#3c4472'], [1440, '#3a4270']]);
  const SKYT = H6([[0, '#070b1f'], [300, '#070b1f'], [345, '#2a3466'], [380, '#6f8fc8'], [430, '#7fb1e0'], [990, '#7fb1e0'], [1022, '#4f69a8'], [1048, '#2b3470'], [1080, '#0d1330'], [1440, '#070b1f']]);
  const SKYB = H6([[0, '#2c2442'], [300, '#2c2442'], [345, '#b0707a'], [380, '#f0b48a'], [430, '#d8e8f0'], [985, '#e6eef0'], [1015, '#f6c08a'], [1036, '#e08a7a'], [1058, '#7a5a8a'], [1090, '#35294c'], [1440, '#2c2442']]);

  // ---------- layout: everything is drawn at a small pixel size, then scaled up with hard edges ----------
  let W = 0, H = 0, DPR = 1, S = 4, AW = 200, AH = 400, port = false;
  const UW = 52, STW = 18, BW = 130, FH = 30;
  let ST, SW, LN1, LN2, bx, Ax0, Ax1, sx0, sx1, Bx0, Bx1, landX, midX, gateX, roofY;
  const yF = f => ST - f * FH;
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 3); W = innerWidth; H = innerHeight;
    const dw = Math.round(W * DPR), dh = Math.round(H * DPR); cv.width = dw; cv.height = dh;
    port = H > W;
    S = Math.max(1, Math.floor(Math.min(W / (port ? 165 : 200), H / 330) * DPR));
    AW = Math.ceil(dw / S); AH = Math.ceil(dh / S);
    for (const c of [lo, wc, lm, mk]) { c.width = AW; c.height = AH; }
    ST = AH - 42; SW = ST + 4; LN1 = ST + 17; LN2 = ST + 29;
    bx = Math.round(AW / 2 - BW / 2);
    Ax0 = bx + 2; Ax1 = Ax0 + UW; sx0 = Ax1 + 2; sx1 = sx0 + STW; Bx0 = sx1 + 2; Bx1 = Bx0 + UW;
    landX = sx0 + 3; midX = sx1 - 3; gateX = sx0 + 9; roofY = yF(6);
    buildWorld();
    ctx.imageSmoothingEnabled = false;
  }

  // ---------- people ----------
  const SKIN = ['#f2cba8', '#e6b48e', '#d29d74', '#b98260', '#f6d9bd'];
  const HAIRC = ['#1a1512', '#231b16', '#2e221a', '#3f2d20', '#5b3d29'];
  const SHIRTS = ['#e8e4dc', '#3e5f8a', '#a33b3b', '#4a7a5a', '#d9a441', '#6b4f8a', '#e07a5f', '#2f2f35', '#7fb3c8', '#c76b98', '#8a9a5b', '#f0d0c0', '#5a6f7f', '#d9d9d9'];
  const PANTS = ['#2b3447', '#33302d', '#4a4036', '#1f2733', '#5d5a55', '#3b4a5e', '#6b5b4b'];
  const UMB = ['#d9534f', '#3e7cb1', '#f0c040', '#2f2f35', '#6bb38a', '#c76b98', '#e8e4dc', '#7a5ab0'];
  const look = (o = {}) => ({ skin: o.skin || pick(SKIN), hair: o.hair || pick(HAIRC), shirt: o.shirt || pick(SHIRTS), pants: o.pants || pick(PANTS), shoe: o.shoe || '#262322', h: o.h || 10, long: !!o.long, hunch: !!o.hunch, beard: !!o.beard, glasses: !!o.glasses, bag: o.bag || null });
  // a person is about ten pixels tall; x, y is where the feet touch the floor
  function person(g, X, Y, L, pose, dir, fr, o = {}) {
    const x = Math.round(X), y = Math.round(Y), h = L.h;
    const R = (dx, dy, w, hh, c) => { g.fillStyle = c; g.fillRect(x + dx, y + dy, w, hh); };
    const d = dir || 1, front = o.front || pose === 'sitf' || pose === 'standf', back = o.back || pose === 'sitb' || pose === 'standb';
    let oy = 0; const seated = pose === 'sit' || pose === 'sitf' || pose === 'sitb' || pose === 'guitar';
    if (seated) oy = 1;
    const hx = L.hunch && !front && !back ? d : 0, hy = L.hunch ? 1 : 0;
    const top = y - h + oy + hy;
    const torsoR = h >= 10 ? 4 : h >= 9 ? 3 : 2, tY = -h + 3 + oy;
    // umbrella above
    if (o.umb) { const u = o.umb, uy = -h - 4 + oy; R(-3, uy + 1, 7, 1, u); R(-2, uy, 5, 1, u); R(-1, uy - 1, 3, 1, shade(u, 1.15)); R(0, uy + 2, 1, 3, '#3a3a3a'); }
    // legs
    const pants = L.pants, shoe = L.shoe;
    if (pose === 'walk') {
      const f = fr % 2;
      R(-1, -3, 3, 1, pants);
      if (f) { R(-1, -2, 1, 1, pants); R(1, -2, 1, 1, pants); R(-1, -1, 1, 1, shoe); R(1, -1, 1, 1, shoe); }
      else { R(0, -2, 1, 1, pants); R(0, -1, 1, 1, shoe); R(-d, -2, 1, 1, pants); R(-d, -1, 1, 1, shoe); }
    } else if (pose === 'sit' || pose === 'guitar') {
      const l0 = Math.min(-1, 2 * d), l1 = Math.max(1, 2 * d);
      R(l0, -3, l1 - l0 + 1, 1, pants); R(2 * d, -2, 1, 1, pants); R(2 * d, -1, 1, 1, shoe); R(3 * d, -1, 1, 1, shoe);
    } else if (pose === 'sitf' || pose === 'sitb') {
      R(-1, -2, 1, 1, pants); R(1, -2, 1, 1, pants); R(-1, -1, 1, 1, shoe); R(1, -1, 1, 1, shoe);
    } else if (pose === 'taichi') {
      R(-1, -3, 3, 1, pants); R(-2, -2, 1, 1, pants); R(2, -2, 1, 1, pants); R(-2, -1, 1, 1, shoe); R(2, -1, 1, 1, shoe);
    } else if (pose === 'yoga') {
      // downward dog, then up
      const up = (fr >> 2) % 2;
      if (up) { R(-3 * d, -1, 1, 1, shoe); R(-2 * d, -2, 1, 1, pants); R(-1 * d, -3, 1, 1, pants); R(0, -4, 1, 1, L.shirt); R(d, -3, 1, 1, L.shirt); R(2 * d, -2, 1, 1, L.skin); R(3 * d, -1, 1, 1, L.skin); R(2 * d, -4, 2, 2, L.hair); return; }
      R(-3 * d, -1, 1, 1, shoe); R(-3 * d, -2, 5, 1, pants); R(2 * d, -3, 2, 1, L.shirt); R(3 * d, -4, 2, 2, L.hair); R(1 * d, -1, 1, 1, L.skin); return;
    } else {
      R(-1, -3, 3, 1, pants); R(-1, -2, 1, 1, pants); R(1, -2, 1, 1, pants); R(-1, -1, 1, 1, shoe); R(1, -1, 1, 1, shoe);
    }
    // torso
    R(-1, tY, 3, torsoR, L.shirt);
    if (front || back) { R(-2, tY, 1, torsoR - 1, L.shirt); R(2, tY, 1, torsoR - 1, L.shirt); R(-2, tY + torsoR - 1, 1, 1, L.skin); R(2, tY + torsoR - 1, 1, 1, L.skin); }
    // head
    const hy0 = top;
    if (front) {
      R(-1 + hx, hy0, 3, 1, L.hair); R(-1 + hx, hy0 + 1, 3, 2, L.skin);
      if (L.long) { R(-2, hy0, 1, 4, L.hair); R(2, hy0, 1, 4, L.hair); }
      if (L.glasses) R(-1, hy0 + 1, 3, 1, '#3a3a40');
      if (L.beard) R(-1, hy0 + 2, 3, 1, L.hair);
    } else if (back) {
      R(-1, hy0, 3, 3, L.hair); if (L.long) R(-1, hy0 + 3, 3, 2, L.hair);
    } else {
      R(-1 + hx, hy0, 3, 1, L.hair);
      R(-d + hx, hy0 + 1, 1, 1, L.hair); R(0 + hx, hy0 + 1, 1, 1, L.skin); R(d + hx, hy0 + 1, 1, 1, L.skin);
      R(-d + hx, hy0 + 2, 1, 1, L.long ? L.hair : L.skin); R(0 + hx, hy0 + 2, 1, 1, L.skin); R(d + hx, hy0 + 2, 1, 1, L.skin);
      if (L.long) R(-d + hx, hy0 + 3, 1, 2, L.hair);
      if (L.glasses) R(d + hx, hy0 + 1, 1, 1, '#2a2a30');
      if (L.beard) { R(0 + hx, hy0 + 2, 1, 1, L.hair); R(d + hx, hy0 + 2, 1, 1, L.hair); }
    }
    // arms and what the hands hold
    const ay = tY + 1;
    if (pose === 'cook') { const up = (fr >> 1) % 2; R(2 * d, ay - up, 1, 1, L.skin); }
    else if (pose === 'pray') { R(2 * d, ay, 1, 1, L.skin); R(3 * d, ay - 3, 1, 3, '#7a5a3a'); R(3 * d, ay - 4, 1, 1, '#ff5a3a'); }
    else if (pose === 'reach') { R(d, tY - 3, 1, 3, L.skin); }
    else if (pose === 'taichi') { const s = Math.sin(fr * 0.12); R(2 * d, ay + Math.round(s), 2, 1, L.skin); R(-2 * d, ay - Math.round(s), 1, 1, L.skin); }
    else if (pose === 'guitar') { R(d > 0 ? 0 : -2, -5, 3, 3, '#b0702a'); R(d, -4, 1, 1, '#3a2010'); R(3 * d, -6, 1, 1, '#5e3a1a'); R(4 * d, -7, 1, 1, '#5e3a1a'); R(5 * d, -8, 1, 1, '#4a2a10'); R(-d, -4 + ((fr >> 1) % 2), 1, 1, L.skin); R(3 * d, -5, 1, 1, L.skin); }
    else if (o.carry) { R(2 * d, ay + 1, 1, 1, L.skin); R(2 * d, ay + 2, 2, 3, o.carry); }
    else if (o.cup) { R(2 * d, ay, 1, 2, o.cup); }
    if (o.phone) R(d, top + 3, 1, 1, '#bfe8ff');
    if (o.helmet) { R(-1, hy0 - 1, 3, 2, o.helmet); R(-1 - (d > 0 ? 0 : 0), hy0 - 1, 1, 1, shade(o.helmet, 0.8)); }
    if (o.hat) { R(-1, hy0 - 1, 3, 1, '#f2d020'); R(front || back ? -2 : d > 0 ? 0 : -2, hy0, front || back ? 5 : 3, 1, '#f2d020'); }
  }
  function cat(g, X, Y, col, pose, dir, fr) {
    const x = Math.round(X), y = Math.round(Y), d = dir || 1;
    const R = (dx, dy, w, h, c) => { g.fillStyle = c; g.fillRect(x + dx, y + dy, w, h); };
    const dk = shade(col, 0.7);
    if (pose === 'sleep') { R(-2, -2, 5, 2, col); R(2 * d, -3, 1, 1, col); R(-2 * d, -1, 1, 1, dk); return; }
    if (pose === 'sit') { R(-1, -3, 2, 3, col); R(d > 0 ? 0 : -1, -5, 2, 2, col); R(d > 0 ? 0 : -1, -6, 1, 1, col); R(d > 0 ? 1 : 0, -6, 1, 1, col); R(-2 * d, -1, 2, 1, dk); return; }
    const f = fr % 2;
    R(-2, -3, 5, 2, col); R(2 * d, -4, 2, 2, col); R(2 * d + (d > 0 ? 1 : 0), -5, 1, 1, col);
    R(-2 * d - (d > 0 ? 1 : 0), -5, 1, 2, dk);
    R(-2 + f, -1, 1, 1, dk); R(2 - f, -1, 1, 1, dk);
  }

  // ---------- the building ----------
  const UNITDEF = { '1A': 'owners', '1B': 'grandma', '2A': 'family', '2B': 'couple', '3A': 'student', '3B': 'night', '4A': 'mahjong', '4B': 'dadteen', '5A': 'oldman', '5B': 'woman', '6A': 'addon' };
  const LAY = {
    owners: [['fridge', 1, 5], ['stove', 6, 10], ['table', 20, 8], ['sofa', 30, 8], ['bed', 38, 14]],
    grandma: [['altar', 1, 9], ['plant', 11, 3], ['table', 18, 8], ['sofa', 28, 8], ['bed', 38, 14]],
    family: [['stove', 1, 10], ['fridge', 11, 5], ['table', 20, 8], ['sofa', 30, 8], ['bed', 38, 14]],
    couple: [['stove', 1, 10], ['plant', 12, 3], ['table', 18, 8], ['sofa', 28, 9], ['bed', 38, 14]],
    student: [['desk', 1, 10], ['shelf', 12, 6], ['kettle', 19, 6], ['bed', 27, 12], ['boxes', 42, 8]],
    night: [['stove', 1, 10], ['table', 14, 8], ['sofa', 25, 9], ['bed', 37, 12], ['wardrobe', 49, 3]],
    mahjong: [['altar', 1, 8], ['stove', 10, 10], ['mj', 25, 8], ['sofa', 36, 6], ['bed', 43, 9]],
    dadteen: [['stove', 1, 10], ['table', 13, 7], ['desk', 22, 9], ['bed', 33, 9], ['bed', 43, 9]],
    oldman: [['altar', 1, 8], ['stove', 10, 9], ['table', 22, 7], ['cage', 32, 4], ['bed', 38, 13]],
    woman: [['stove', 1, 10], ['table', 13, 7], ['desk', 23, 9], ['mat', 33, 7], ['bed', 41, 11]],
    addon: [['mattress', 2, 13], ['desk', 18, 9], ['gstand', 30, 3], ['mfridge', 35, 4], ['catbed', 41, 6]]
  };
  const WALLS = ['#d9d3c4', '#cfd8cf', '#d8cfc4', '#c9d3dc', '#e0d6c8', '#d6cad6', '#cfd9d2', '#e2dccb', '#d3d7c5', '#dcd0c2'];
  const SOFAS = ['#6a7f9a', '#9a6a6a', '#7a8a5a', '#8a7a9a', '#a08a6a', '#5a6a7a'];
  const BLANK = ['#e8a8a8', '#a8c8e8', '#f0d890', '#b8d8b0', '#d0b8e0', '#f2f0ea', '#e8c0a0'];
  let units = {}, nbs = [], lamps = [], parked = [], stairLit = [0, 0, 0, 0, 0, 0, 0], laundry = 0, laundryOut = false;
  let shopA = { open: 0 }, shopB = { open: 0 }, store = null, noodle = null, cram = null, signs = [], acs = [], stars = [], clouds = [], hills = [];
  function buildWorld() {
    sd = 20251106;
    units = {};
    for (const key in UNITDEF) {
      const f = +key[0], side = key[1], x0 = side === 'A' ? Ax0 : Bx0, o = side === 'A' ? 1 : -1, type = UNITDEF[key];
      const u = { key, f, side, x0, x1: x0 + UW, o, type, items: [], wall: spick(WALLS), floor: spick(['#bdb6aa', '#c7bfb0', '#b4ada3', '#c2b7a5']), cool: srnd() < 0.55, sofa: spick(SOFAS), blank: spick(BLANK), lamp: 0, tv: 0, desk: 0, red: 0, sleepers: [] };
      if (type === 'addon') { u.wall = '#cbd2c8'; u.floor = '#9aa1a8'; u.cool = false; }
      for (const [k, off, w] of LAY[type]) { const x = o > 0 ? x0 + off : x0 + UW - off - w; u.items.push({ k, x, w, o }); }
      const beds = u.items.filter(i => i.k === 'bed' || i.k === 'mattress');
      u.bed = beds[0]; u.bed2 = beds[1] || beds[0];
      u.it = {}; for (const it of u.items) u.it[it.k] = u.it[it.k] || it;
      units[key] = u;
    }
    // neighbours, left and right
    nbs = [];
    let x = bx - 5, first = true;
    while (x > -40) { const w = first ? 92 : 64 + Math.floor(srnd() * 40); nbs.push(makeNb(x - w, w, first ? 8 : 3 + Math.floor(srnd() * 6), first ? 'cram' : spick(['pharm', 'repair', 'closed', 'lottery', 'temple', 'shop']))); x -= w + (first ? 4 : Math.floor(srnd() * 6)); first = false; }
    x = bx + BW + 5; first = true;
    while (x < AW + 40) { const w = first ? 96 : 64 + Math.floor(srnd() * 40); nbs.push(makeNb(x, w, first ? 6 : 3 + Math.floor(srnd() * 6), first ? 'store' : spick(['betel', 'repair', 'closed', 'shop', 'pharm', 'lottery']))); x += w + (first ? 4 : Math.floor(srnd() * 6)); first = false; }
    store = nbs.find(n => n.kind === 'store'); noodle = nbs.find(n => n.kind === 'cram'); cram = noodle;
    // street lamps and parked scooters
    lamps = []; for (let lx0 = bx - 30 - 64 * 6; lx0 < AW + 64; lx0 += 64) if (lx0 > -10) lamps.push({ x: lx0, flick: srnd() < 0.15 });
    parked = []; for (let px = -6; px < AW + 6; px += 7 + Math.floor(srnd() * 3)) { if (Math.abs(px - gateX) < 9 || srnd() < 0.35) continue; parked.push({ x: px, col: spick(['#d9d9d9', '#3a3a3a', '#c0392b', '#2f6fa0', '#e8c070', '#5a8a6a', '#f2f2f2', '#7a7a8a']), here: true, owner: null }); }

        while (truckNext < t + 0.3) { const [m, n] = FE[truckI % FE.length]; if (m) { const o = ac.createOscillator(), og = ac.createGain(); o.type = 'square'; o.frequency.value = mtof(m); og.gain.setValueAtTime(0, truckNext); og.gain.linearRampToValueAtTime(0.5, truckNext + 0.01); og.gain.setTargetAtTime(0, truckNext + 0.06, 0.08 * n); o.connect(og); og.connect(truckBus); o.start(truckNext); o.stop(truckNext + 0.15 * n + 0.4); if (truckI % 6 === 0) { const b = ac.createOscillator(), bg = ac.createGain(); b.type = 'triangle'; b.frequency.value = mtof(m < 66 ? 45 : 45); bg.gain.setValueAtTime(0.25, truckNext); bg.gain.setTargetAtTime(0, truckNext + 0.05, 0.2); b.connect(bg); bg.connect(truckBus); b.start(truckNext); b.stop(truckNext + 0.8); } } truckNext += 0.15 * n; truckI++; }
        if (rand() < dt * 1.2) parts.push({ type: 'note', x: truck.x + J(6), y: truck.y - 14, vx: J(3), vy: -6, t: 0, life: 2, col: pick(['#ffe070', '#ffffff', '#a0e0ff']) });
      } else { truckBus.gain.setTargetAtTime(0, t, 0.5); truckI = 0; }
      // the guitar
      const gp = people.find(p => p.name === 'gtr');
      if (gp && gp.act === 'guitar' && !gp.route.length && !gp.away) {
        const indoor = gp.zone === 'u'; gtrBus.gain.setTargetAtTime(indoor ? 0.9 : 1.4, t, 0.5); if (gtrPan.pan) gtrPan.pan.setTargetAtTime(pan(gp.x), t, 0.5);
        if (gtrNext < t) gtrNext = t + 0.1;
        while (gtrNext < t + 0.35) {
          const eighth = 0.36;
          if (gtrPause > 0) { gtrNext += eighth; gtrPause--; continue; }
          const prog = PROGS[gtrProg], ch = CH[prog[gtrBar % prog.length]], top = ch.slice(-3), pat = [ch[0], top[0], top[1], top[2], top[1], top[0]];
          let m = pat[gtrStep % 6]; if (gtrStep % 6 === 3 && Math.random() < 0.25) m = top[2] + (Math.random() < 0.5 ? 2 : 3);
          pluck(m, gtrNext + Math.random() * 0.02, gtrStep % 6 === 0 ? 0.55 : 0.32 + Math.random() * 0.08);
          if (gtrStep % 6 === 0 && Math.random() < 0.3) pluck(top[2], gtrNext + 0.01, 0.25);
          gtrNext += eighth * (1 + J(0.04)); gtrStep++;
          if (gtrStep % 6 === 0) { gtrBar++; if (gtrBar % prog.length === 0) { if (Math.random() < 0.35) { gtrProg = Math.floor(Math.random() * PROGS.length); } if (Math.random() < 0.3) gtrPause = 6 + Math.floor(Math.random() * 18); } }
        }
      } else gtrBus.gain.setTargetAtTime(0, t, 0.4);
      // mahjong tiles on Saturday nights
      if (units['4A'].mjOn && t > mjNext) { mjNext = t + 0.6 + Math.random() * 2.4; const n = 1 + Math.floor(Math.random() * 4); for (let i = 0; i < n; i++) noise(t + i * 0.07 + Math.random() * 0.03, 0.03, 'bandpass', 2600 + Math.random() * 900, 0.08, 4, pan(units['4A'].x0 + 28)); if (Math.random() < 0.08) for (let i = 0; i < 26; i++) noise(t + 0.4 + i * 0.045 + Math.random() * 0.03, 0.03, 'bandpass', 2400 + Math.random() * 1200, 0.04, 3, pan(units['4A'].x0 + 28)); }
      // televisions murmuring through the walls
      const tvs = Object.values(units).filter(u => u.tv > 0.5).length; tvG.gain.setTargetAtTime(0.006 * tvs * (0.5 + 0.5 * Math.sin(t * 3.3) * Math.sin(t * 1.7)), t, 0.1);
      // birds at dawn, frogs after rain
      if (md > T(5, 30) && md < T(8, 0) && rain < 0.2 && t > birdNext) { birdNext = t + 0.5 + Math.random() * 3; const f = 2400 + Math.random() * 1600, pn = J(0.8); for (let i = 0; i < 2 + Math.floor(Math.random() * 3); i++) { const o = tone(f, t + i * 0.12, 0.06, 0.02, 'sine', out, pn); o.frequency.exponentialRampToValueAtTime(f * 1.4, t + i * 0.12 + 0.06); } }
      if ((md > T(19, 0) || md < T(4, 0)) && wet > 0.4 && rain < 0.5 && t > frogNext) { frogNext = t + 0.8 + Math.random() * 4; const pn = J(0.9); for (let i = 0; i < 3 + Math.floor(Math.random() * 4); i++) tone(380 + Math.random() * 60, t + i * 0.09, 0.05, 0.02, 'square', out, pn); }
      // the temple bell at dusk and dawn
      const day = Math.floor(now() / 1440) * 2 + (md > T(12, 0) ? 1 : 0);
      if (day !== bellDay && (Math.abs(md - T(5, 30)) < 1 || Math.abs(md - T(17, 30)) < 1)) { bellDay = day; for (const [r, a] of [[1, 1], [2.76, 0.4], [5.4, 0.2], [0.5, 0.5]]) tone(98 * r, t, 6, 0.03 * a, 'sine', rev, 0); }
    };
    return self;
  })();

  // ---------- run ----------
  layout(); makePeople();
  addEventListener('resize', () => {
    layout(); cars = []; peds = []; parts = []; truck = null;
    for (const p of people) { p.home = p.ukey ? units[p.ukey] : null; p.unit = p.home; p.waitRide = false; p.ride = null; p.override = null; placeAt(p, desired(p)); }
    mochi.x = mochi.tx = Bx0 + 20; for (const c of strays) { c.x = c.tx = clamp(c.x, 4, AW - 4); }
  });
  cv.addEventListener('pointerdown', () => { if (!snd.on) { snd.start(); hintEl.style.opacity = 0; } });
  if (document.fonts && document.fonts.load) document.fonts.load('700 20px "Noto Sans TC"', '早餐茶麵美語超商').then(() => { for (const sg of signs) sg.spr = null; }).catch(() => {});
  let last = performance.now(), acc = 0, t0 = performance.now();
  function frame(nowp) {
    acc += Math.min(0.1, (nowp - last) / 1000); last = nowp;
    let n = 0; while (acc >= DT && n < 6) { update(DT); acc -= DT; n++; } if (n === 6) acc = 0;
    render();
    const el = (nowp - t0) / 1000;
    titleEl.style.opacity = el < 0.4 ? 0 : el < 6 ? 1 : 0;
    if (!snd.on) hintEl.style.opacity = el > 1.2 ? 0.9 : 0;
    requestAnimationFrame(frame);
  }
  window.__rm = {
    seek: mins => { const target = rt + mins / SPEED; while (rt < target) update(DT); render(); },
    frame: () => render(), now: () => { const m = now(); return { day: dayOf(m), h: Math.floor(mod(m) / 60), m: Math.floor(mod(m) % 60), rain: rain.toFixed(2) }; },
    who: () => people.map(p => `${p.name}:${p.act}:${p.zone}${p.route.length ? '~' : ''}`).join(' '),
    dbg: n => { const p = people.find(q => q.name === n); return JSON.stringify({ x: p.x, y: p.y, zone: p.zone, f: p.f, act: p.act, unit: p.unit && p.unit.key, route: p.route, spot: p.spot && { zone: p.spot.zone, x: p.spot.x, y: p.spot.y, f: p.spot.f }, wr: p.waitRide, away: p.away }); },
    tdbg: () => truck ? JSON.stringify({ x: Math.round(truck.x), v: truck.v.toFixed(1), at: truck.atStop, w: truck.wait.toFixed(1), done: truck.done, ahead: cars.filter(c => c.lane === 2 && c.kind !== 'scooter' && c !== truck && c.x > truck.x).map(c => c.kind + '@' + Math.round(c.x) + ':' + c.v.toFixed(1) + (c.atStop ? 'S' : '') + (c.ride ? c.ride.name : '')).join(','), waiting: people.filter(p => p.override && p.override.act === 'trash').map(p => p.name + ':' + p.zone + ':' + p.route.length + (p.override.tossed ? 'T' : '')).join(',') }) : '',
    quake: () => { nextQuake = now(); }, cut: () => { rain = rainT = 1; lastCut = -999; cut = 25; lastCut = rt; }, PW: () => PW,
    drama: () => { drama = { ph: 'argue', t: 0, k: -1 }; }, bday: () => JSON.stringify(bday), bub: () => people.filter(p => p.bub && rt - p.bub.t < p.bub.d).map(p => p.name + ':' + p.bub.icon).join(' '),
    setRain: v => { rain = rainT = v; nextWx = now() + 120; }, cars: () => cars.length, peds: () => peds.length, snd, truck: () => !!truck
  };
  requestAnimationFrame(frame);
})();
</script>
