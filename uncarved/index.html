<body>
<canvas id="gl" tabindex="0" role="img" aria-label="The Tao Te Ching as one globe of raised characters, chapter 1 at the north pole to 81 at the south. Turn it with a finger. Let it rest and it reads to you. Hold it to gather the characters. Shake it to ask the Way."></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<div class="low" id="where" aria-hidden="true"></div>
<div id="title" aria-hidden="true"><i class="seal">樸</i><b>UNCARVED</b><span class="zh">老子 · 道德經</span><span class="en">Laozi · Tao Te Ching</span></div>
<div id="wit" aria-live="polite"></div>
<div class="low" id="hint">turn it with a finger · let go, and it reads</div>
<div id="info" aria-live="polite"><div class="big" id="iBig"></div><div class="tx"><div class="py" id="iPy"></div><div class="gl" id="iGl"></div><div class="ct" id="iCt"></div></div></div>
<div class="sr" id="live" aria-live="polite"></div>

<nav id="top">
  <button class="icon" id="bLib" aria-label="Chapters and more"><i class="seal">樸</i></button>
  <button class="icon" id="bAsk" aria-label="Ask the Way"><i class="ask">問</i></button>
</nav>

<div id="oracle" class="card" aria-live="polite"></div>

<section id="lib" class="drawer" aria-hidden="true"><div class="scrim"></div><div class="panel" role="dialog" aria-label="Library"></div></section>
<section id="sheet" class="sheet" aria-hidden="true"><div class="sheetIn" role="dialog"></div></section>
