<body>
<canvas id="c" aria-label="A short animated love story with music. In a pastel meadow, an orange tabby and a grey cat with white socks each catch fireflies on their own side, and every catch rings a note of a waltz. The orange one misses and faceplants. A golden firefly arrives, both wiggle and pounce at it at the same moment and bonk heads in mid-air. Dazed, they see each other for the first time, trade slow blinks, boop noses, and the golden firefly bursts into a constellation of a heart with cat ears. They headbutt, purr, and fall asleep forehead to forehead. Tap anywhere to begin."></canvas>
<div id="title" class="over">Slow Blink</div>
<div id="hint" class="over"><span>tap anywhere · sound on</span></div>
<div id="end" class="over">In cat language, a slow blink means: I trust you.</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
  const titleEl = document.getElementById('title'), hintEl = document.getElementById('hint'), endEl = document.getElementById('end');
  const TAU = Math.PI * 2, DT = 1 / 60, BEAT = 2 / 3;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const bump = x => x <= 0 || x >= 1 ? 0 : Math.sin(Math.PI * x);
  const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -8 * x) * Math.cos(x * 10.5);
  let rs = 7; const rnd = () => { rs = (rs * 16807) % 2147483647; return (rs - 1) / 2147483646; };
  const R0 = Math.random;
  function kf(a, t) {
    if (t <= a[0][0]) return a[0][1];
    for (let i = 0; i < a.length - 1; i++) { const [t0, v0] = a[i], [t1, v1] = a[i + 1]; if (t < t1) return lerp(v0, v1, sm(t0, t1, t)); }
    return a[a.length - 1][1];
  }
  function step0(a, t) { let v = a[0][1]; for (const [t0, x] of a) if (t >= t0) v = x; return v; }

  // ---------- layout ----------
  let W = 0, H = 0, DPR = 1, k = 100, gy = 600, cx = 0, cy = 0, sc = 1, port = false;
  let bgD = null, bgN = null, fgD = null, fgN = null;
  let T = 0, R = 0, started = false, waitR = 0, NF = 0, tapFx = 0.5, tapFy = 0.7;
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    port = H > W * 1.05;
    k = port ? clamp(W * 0.25, 56, 150) : clamp(Math.min(W * 0.14, H * 0.19), 56, 190);
    gy = port ? H * 0.66 : H * 0.79;
    cx = W / 2; cy = gy * (port ? 0.38 : 0.36); sc = Math.min(W * 0.6 / 32, gy * (port ? 0.46 : 0.42) / 34);
    bgD = bgN = fgD = fgN = null;
    makeFlowers();
  }

  // ---------- painting the meadow, at golden hour and at blue hour ----------
  const PD = { sky: [['#8b9ee6', 0], ['#b3a5ea', 0.42], ['#efb6d6', 0.78], ['#ffd8c2', 1]], glow: 'rgba(255,228,204,0.6)', far: '#c6b4ea', farRim: '#ebe0fd', mid: '#a7c2ec', midRim: '#dbe9fd', tree: '#90b3e4', treeHi: '#bdd7f7', trunk: '#8d93cc', g0: '#b8e6cc', g1: '#88c9ae', rim: '#e6faee', tuft: '#9fd8ba', tuft2: '#cdf1dc', cloud: 'rgba(255,244,250,0.62)', moon: 'rgba(255,250,244,0.75)', maria: 'rgba(230,214,236,0.6)', halo: 'rgba(255,250,244,0.2)', fg: '#7dc0a7', fg2: '#a5dcc3' };
  const PN = { sky: [['#1f2763', 0], ['#38398a', 0.45], ['#7559a6', 0.8], ['#c483ad', 1]], glow: 'rgba(240,160,205,0.32)', far: '#4c4a98', farRim: '#7270c4', mid: '#395592', midRim: '#5f80c4', tree: '#34548e', treeHi: '#4f74ad', trunk: '#2d3c76', g0: '#40808c', g1: '#285265', rim: '#7cc0c0', tuft: '#3b7381', tuft2: '#5d9ca4', cloud: 'rgba(170,150,230,0.2)', moon: '#fff8e6', maria: 'rgba(222,212,190,0.55)', halo: 'rgba(255,240,215,0.3)', fg: '#234a5c', fg2: '#336676' };
  function off(draw) { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); draw(g); return c; }
  function hill(g, base, amp, seed, fill, rim) {
    rs = seed; const p1 = rnd() * TAU, p2 = rnd() * TAU, p3 = rnd() * TAU, f1 = 1 / (1.5 * k), f2 = 1 / (0.75 * k), f3 = 1 / (0.4 * k);
    const y = x => base - amp * (0.5 + 0.4 * Math.sin(x * f1 + p1) + 0.14 * Math.sin(x * f2 + p2) + 0.04 * Math.sin(x * f3 + p3));
    g.beginPath(); g.moveTo(-4, H + 4); for (let x = -4; x <= W + 4; x += 3) g.lineTo(x, y(x)); g.lineTo(W + 4, H + 4); g.closePath(); g.fillStyle = fill; g.fill();
    g.beginPath(); for (let x = -4; x <= W + 4; x += 3) { if (x === -4) g.moveTo(x, y(x)); else g.lineTo(x, y(x)); } g.strokeStyle = rim; g.lineWidth = 1.6; g.stroke();
    return y;
  }
  function cloud(g, x, y, s, col) { g.fillStyle = col; g.beginPath(); for (const [a, b, r] of [[0, 0, 1], [0.85, 0.12, 0.72], [-0.85, 0.16, 0.66], [0.38, -0.38, 0.72], [-0.36, -0.3, 0.6], [1.5, 0.3, 0.4], [-1.45, 0.34, 0.38]]) { g.moveTo(x + a * s + r * s, y + b * s); g.arc(x + a * s, y + b * s, r * s, 0, TAU); } g.fill(); }
  function tuft(g, x, y, h, col, lw) { g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.beginPath(); for (let j = -2; j <= 2; j++) { g.moveTo(x + j * h * 0.08, y); g.quadraticCurveTo(x + j * h * 0.14, y - h * 0.6, x + j * h * 0.26 + (rnd() - 0.5) * h * 0.2, y - h * (0.7 + 0.3 * rnd())); } g.stroke(); }
  const meadowTop = x => gy - 0.28 * k + Math.sin(x / (1.7 * k) + 1) * 0.04 * k;
  function paint(P, night) {
    return off(g => {
      const top = gy - 0.3 * k;
      const s = g.createLinearGradient(0, 0, 0, top); for (const [c, o] of P.sky) s.addColorStop(o, c); g.fillStyle = s; g.fillRect(0, 0, W, H);

      const lg = g.createRadialGradient(lx, ly, 0, lx, ly, lr); lg.addColorStop(0, P.glow); lg.addColorStop(1, 'rgba(255,220,210,0)'); g.fillStyle = lg; g.fillRect(0, 0, W, H);
      if (night) { rs = 31; for (let i = 0; i < 150; i++) { const x = rnd() * W, y = rnd() * (gy - 1.1 * k), r = 0.4 + rnd() * rnd() * 1.4; g.fillStyle = `rgba(255,250,240,${(0.25 + 0.6 * rnd()).toFixed(2)})`; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); } }
      const mx = W * 0.85, my = Math.max(46, gy * 0.15), mr = Math.max(16, Math.min(W, H) * 0.055);
      const mh = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 5); mh.addColorStop(0, P.halo); mh.addColorStop(1, 'rgba(255,245,230,0)'); g.fillStyle = mh; g.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
      g.fillStyle = P.moon; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
      g.fillStyle = P.maria; for (const [a, b, c] of [[-0.3, -0.2, 0.22], [0.25, 0.15, 0.16], [0.05, 0.42, 0.12]]) { g.beginPath(); g.arc(mx + a * mr, my + b * mr, c * mr, 0, TAU); g.fill(); }
      rs = 5; for (let i = 0; i < 3; i++) cloud(g, W * (0.1 + 0.37 * i + rnd() * 0.08), gy * (0.1 + rnd() * 0.22), k * (0.3 + rnd() * 0.22), P.cloud);
      hill(g, gy - 1.0 * k, 1.1 * k, 3, P.far, P.farRim);
      const ym = hill(g, gy - 0.45 * k, 0.6 * k, 9, P.mid, P.midRim);
      // round little trees on the near hills
      rs = 17; for (let i = 0; i < 14; i++) {
        const x = rnd() * W; if (Math.abs(x - cx) < 0.9 * k) continue;
        const b = ym(x) + 0.03 * k, h = k * (0.3 + 0.35 * rnd());
        g.strokeStyle = P.trunk; g.lineWidth = Math.max(1.5, k * 0.035); g.lineCap = 'round'; g.beginPath(); g.moveTo(x, b); g.lineTo(x, b - h * 0.7); g.stroke();
        g.fillStyle = P.tree; g.beginPath(); g.arc(x, b - h, h * 0.36, 0, TAU); g.arc(x - h * 0.22, b - h * 0.8, h * 0.24, 0, TAU); g.arc(x + h * 0.24, b - h * 0.82, h * 0.22, 0, TAU); g.fill();
        g.fillStyle = P.treeHi; g.beginPath(); g.arc(x - h * 0.1, b - h * 1.1, h * 0.15, 0, TAU); g.fill();
      }
      const mg = g.createLinearGradient(0, gy - 0.35 * k, 0, H); mg.addColorStop(0, P.g0); mg.addColorStop(1, P.g1);
      g.beginPath(); g.moveTo(-4, H + 4); for (let x = -4; x <= W + 4; x += 3) g.lineTo(x, meadowTop(x)); g.lineTo(W + 4, H + 4); g.closePath(); g.fillStyle = mg; g.fill();
      g.beginPath(); for (let x = -4; x <= W + 4; x += 3) { if (x === -4) g.moveTo(x, meadowTop(x)); else g.lineTo(x, meadowTop(x)); } g.strokeStyle = P.rim; g.lineWidth = 1.6; g.stroke();
      rs = 4; for (let i = 0; i < 80; i++) { const x = rnd() * W, t0 = meadowTop(x), d = Math.pow(rnd(), 1.4), y = t0 + d * (H - t0); tuft(g, x, y + 2, k * (0.05 + 0.1 * d), i % 3 ? P.tuft : P.tuft2, Math.max(1, k * (0.008 + 0.012 * d))); }
    });
  }
  function paintFG(P) {
    return off(g => { rs = 8; for (let i = 0; i < 24; i++) { const x = rnd() * W, h = k * (0.22 + 0.25 * rnd()); tuft(g, x, H + 4, h, i % 4 ? P.fg : P.fg2, Math.max(1.5, k * 0.026)); } });
  }

  // flowers: shut buds before the tap, opening in a wave from where the finger lands
  const FCOL = [['#ffd0e2', '#fff1a8'], ['#fff6c0', '#ffd27a'], ['#dcc9ff', '#fff3b8'], ['#ffffff', '#ffe27a'], ['#ffc7ae', '#fff6d0']];
  let flowers = [];
  function makeFlowers() {
    rs = 77; flowers = [];
    const n = port ? 64 : 70;
    for (let i = 0; i < n; i++) {
      const x = rnd() * W, t0 = meadowTop(x) + 0.06 * k, d = Math.pow(rnd(), 0.75), y = t0 + d * (H * 0.985 - t0);
      const [col, mid] = FCOL[i % FCOL.length];
      flowers.push({ x, y, s: k * (0.045 + 0.1 * d * d), col, mid, ph: rnd() * TAU, np: rnd() < 0.3 ? 6 : 5, d: Infinity, pop: false });
    }
    flowers.sort((a, b) => a.y - b.y);
    if (started) for (const f of flowers) { f.d = bloomDelay(f); f.pop = T > f.d + 0.2; }
  }
  const bloomDelay = f => 0.05 + Math.hypot(f.x - tapFx * W, f.y - tapFy * H) / (Math.max(W, H) * 0.85);

  // ---------- sprites ----------
  const SPR = {};
  function glowSprite(rgb) {
    const key = 'g' + rgb; if (SPR[key]) return SPR[key];
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, `rgba(${rgb},1)`); r.addColorStop(0.18, `rgba(${rgb},0.55)`); r.addColorStop(0.5, `rgba(${rgb},0.12)`); r.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); return (SPR[key] = c);
  }
  function starSprite(rgb) {
    const key = 's' + rgb; if (SPR[key]) return SPR[key];
    const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d');
    const r = g.createRadialGradient(48, 48, 0, 48, 48, 46); r.addColorStop(0, `rgba(${rgb},1)`); r.addColorStop(0.25, `rgba(${rgb},0.8)`); r.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = r; g.beginPath();
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2, p = a + Math.PI / 2; g.moveTo(48 + Math.cos(p) * 3.4, 48 + Math.sin(p) * 3.4); g.lineTo(48 + Math.cos(a) * 46, 48 + Math.sin(a) * 46); g.lineTo(48 - Math.cos(p) * 3.4, 48 - Math.sin(p) * 3.4); g.closePath(); }
    g.fill();
    const r2 = g.createRadialGradient(48, 48, 0, 48, 48, 14); r2.addColorStop(0, `rgba(${rgb},1)`); r2.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = r2; g.fillRect(0, 0, 96, 96);

  }
  function glow(x, y, r, rgb, a) { if (a <= 0.004 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glowSprite(rgb), x - r, y - r, 2 * r, 2 * r); }

    if (a <= 0.004 || r <= 0) return; ctx.globalAlpha = Math.min(1, a);
    if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(img, -r, -r, 2 * r, 2 * r); ctx.restore(); } else ctx.drawImage(img, x - r, y - r, 2 * r, 2 * r);
  }
  function star5(x, y, r, rot, fill) {
    const g = ctx; g.beginPath();
    for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath(); g.fillStyle = fill; g.fill(); g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = Math.max(1, r * 0.16); g.lineJoin = 'round'; g.stroke();
  }
  function heart(x, y, s, a) {

    g.fillStyle = 'rgba(255,255,255,0.75)'; g.beginPath(); g.ellipse(x - s * 0.3, y - s * 0.38, s * 0.11, s * 0.07, -0.6, 0, TAU); g.fill(); g.globalAlpha = 1;
  }

  // ---------- the cats ----------
  const ORANGE = { base: '#f2a46c', light: '#ffcf9c', dark: '#d8834f', stripe: '#d0763f', belly: '#fff0dc', paw: '#ffe4c6', ear: '#ffb1ae', nose: '#f2879a', iris: '#9fd77a', tabby: true };
  const GREY = { base: '#a9b1d2', light: '#d2d9f0', dark: '#8790b8', stripe: '#8790b8', belly: '#ffffff', paw: '#ffffff', ear: '#ffc0cb', nose: '#f29fb0', iris: '#ffc75e', socks: true, muzzle: true };
  const mkCat = (col, dir, ph0, blinkT) => ({ col, dir, ph0, blinkT, x: 0, y: 0, air: 0, P: {}, look: [0.3, -0.6], headW: [0, 0], noseW: [0, 0], eyeW: [0, 0], pawW: [0, 0], lastX: null, walkAmt: 0, ph: 0, dyn: [], ffP: null, blinkOpen: 1 });
  const O = mkCat(ORANGE, 1, 0.3, 2.6), G = mkCat(GREY, -1, 2.1, 4.3);
  // the orange cat's part, in cat-lengths from the middle and seconds from the tap
  O.S = {
    x: [[0, -1.3], [12.67, -1.3], [13.3, -1.1], [22.0, -1.1], [22.6, -0.97], [23.4, -1.12], [42.0, -1.12], [42.5, -0.95], [42.9, -0.95], [43.4, -0.78], [43.9, -0.78], [44.4, -0.6], [59.5, -0.6], [61.0, -0.84]],
    y: [[0, 0], [9.6, 0], [10.0, 0.32], [10.45, 0], [12.67, 0], [12.97, 0.42], [13.3, 0], [22.0, 0], [22.6, 0.78], [23.0, 0.5], [23.4, 0]],
    sit: [[0, 1], [42.0, 1], [42.25, 0.7], [42.5, 1], [42.9, 1], [43.15, 0.7], [43.4, 1], [43.9, 1], [44.15, 0.7], [44.4, 1]],
    loaf: [[59.5, 0], [61.0, 1]],
    crouch: [[11.5, 0], [11.9, 1], [12.6, 1], [12.7, 0], [18.67, 0], [19.1, 1], [21.95, 1], [22.05, 0]],
    wig: [[11.95, 0], [12.1, 1], [12.55, 1], [12.65, 0], [19.4, 0], [19.6, 1], [21.85, 1], [21.95, 0]],
    stretch: [[12.65, 0], [12.75, 1], [13.15, 1], [13.32, 0], [21.95, 0], [22.1, 1], [22.6, 1], [22.95, 0.25], [23.3, 0]],
    plant: [[13.25, 0], [13.34, 1], [14.75, 1], [15.05, 0]],

    sq: [[13.28, 0], [13.36, 1], [13.6, 0.35], [14.7, 0.35], [14.95, 0], [23.36, 0], [23.43, 0.8], [23.7, 0]],

      else if (p.type === 'z') { g.globalAlpha = Math.min(1, u * 4) * (u > 0.6 ? (1 - u) / 0.4 : 1) * 0.9; g.fillStyle = '#ffffff'; g.font = `italic 500 ${Math.round(p.size * (0.6 + 0.6 * u))}px Fraunces, Georgia, serif`; g.textAlign = 'center'; g.fillText('z', p.x + Math.sin(p.t * 2) * 0.05 * k, p.y); }
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  function render() {
    if (!bgD) { bgD = paint(PD, false); bgN = paint(PN, true); fgD = paintFG(PD); fgN = paintFG(PN); }
    const g = ctx, nf = NF;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    if (nf < 1) g.drawImage(bgD, 0, 0);
    if (nf > 0) { g.globalAlpha = nf; g.drawImage(bgN, 0, 0); g.globalAlpha = 1; }
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const bp = started ? Math.exp(-((T % BEAT) / 0.14)) : 0;
    // the sky's own small lights
    g.globalCompositeOperation = 'lighter';
    if (nf > 0.02) for (const s of TWK) spr(starSprite('255,250,240'), s.fx * W, s.fy * (gy - 1.3 * k), 0.05 * k * s.s, 0, nf * (0.35 + 0.65 * Math.max(0, Math.sin(R * 0.9 + s.ph))));
    for (const s of shoots) { const u = (T - s.t0) / s.d, x = s.x0 + s.dx * u, y = s.y0 + s.dy * u, gr = g.createLinearGradient(x, y, x - s.dx * 0.2, y - s.dy * 0.2); gr.addColorStop(0, `rgba(255,250,235,${(1 - u).toFixed(3)})`); gr.addColorStop(1, 'rgba(255,250,235,0)'); g.globalAlpha = 1; g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x - s.dx * 0.2, y - s.dy * 0.2); g.stroke(); spr(starSprite('255,255,255'), x, y, 0.08 * k, 0, 1 - u); }
    for (const m of MOTES) { const x = m.fx * W + Math.sin(R * 0.5 + m.ph) * 12, y = m.fy * H, tw = 0.45 + 0.55 * Math.sin(R * 1.3 + m.ph); glow(x, y, m.r * 5, '255,246,232', (0.22 + 0.12 * bp) * tw); }
    g.globalCompositeOperation = 'source-over';
    drawConst();
    drawFlowers(false);
    for (let i = 0; i < AFF.length; i++) { const f = AFF[i], vis = i < 4 ? 0.7 : nf; if (vis < 0.02) continue; drawFF(f.fx * W + Math.sin(R * f.a + f.ph) * 0.8 * k, gy - (0.25 + f.fy * 1.9) * k + Math.cos(R * f.b * 1.3 + f.ph) * 0.35 * k, vis * (0.35 + 0.45 * Math.max(0, Math.sin(R * 1.2 + f.ph * 3))) * (1 + 0.4 * bp), 0.07 * k); }
    drawCat(G); drawCat(O);
    for (const c of [O, G]) if (c.P.dazed > 0.02) for (let i = 0; i < 3; i++) { const a = R * 4.2 + i * TAU / 3, x = c.headW[0] + Math.cos(a) * 0.36 * k, y = c.headW[1] - 0.06 * k + Math.sin(a) * 0.1 * k; g.globalAlpha = 1; star5(x, y, 0.08 * k * c.P.dazed * (0.85 + 0.15 * Math.sin(a)), a, '#ffe36e'); }
    for (const f of CATCH) if (f.pos) drawFF(f.pos[0], f.pos[1], f.pos[2] * (0.75 + 0.25 * Math.sin(R * 5 + f.ph)) * (1 + 0.3 * bp), 0.11 * k);
    if (visitor) { const [x, y] = visitorPos(); drawFF(x, y, 0.8, 0.09 * k); }
    if (GOLD.a > 0) {
      g.globalCompositeOperation = 'lighter';
      glow(GOLD.x, GOLD.y, k * 0.95, '255,196,110', 0.34 * GOLD.a); glow(GOLD.x, GOLD.y, k * 0.32, '255,240,170', 0.85 * GOLD.a);
      spr(starSprite('255,236,170'), GOLD.x, GOLD.y, k * 0.3 * (1 + 0.15 * Math.sin(R * 5)), R * 0.8, GOLD.a);
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = GOLD.a; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(GOLD.x, GOLD.y, Math.max(2, k * 0.024), 0, TAU); g.fill(); g.globalAlpha = 1;
    }
    drawParts();
    drawFlowers(true);
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (nf < 1) g.drawImage(fgD, 0, 0);
    if (nf > 0) { g.globalAlpha = nf; g.drawImage(fgN, 0, 0); g.globalAlpha = 1; }
    const vg = g.createRadialGradient(cv.width / 2, cv.height * 0.5, Math.min(cv.width, cv.height) * 0.4, cv.width / 2, cv.height * 0.5, Math.hypot(cv.width, cv.height) * 0.62);
    vg.addColorStop(0, 'rgba(70,50,140,0)'); vg.addColorStop(1, `rgba(50,30,110,${(0.22 + 0.12 * nf).toFixed(3)})`); g.fillStyle = vg; g.fillRect(0, 0, cv.width, cv.height);
  }
  function hud() {
    titleEl.style.opacity = !started ? 1 : (1 - sm(2.0, 3.4, T)).toFixed(3);
    hintEl.style.opacity = !started ? 1 : (!snd.isOn() ? 0.85 : 0);
    endEl.style.opacity = T > 64 && T < 75 ? 1 : 0;
  }

  // ---------- run ----------
  function begin(withSound, x, y) {
    if (started) return; started = true; T = 0;
    tapFx = x === undefined ? 0.5 : x / W; tapFy = y === undefined ? 0.7 : y / H;
    for (const f of flowers) f.d = bloomDelay(f);
    const px = tapFx * W, py = tapFy * H;
    burst(px, py, 26, 2.2 * k, '255,246,220', 1.1, 0.2 * k); one('ring', px, py, 0, 0, 0.7, 0.9 * k, '255,255,255');
    if (withSound) snd.start(0); else hintEl.firstElementChild.textContent = 'tap anywhere for sound';
  }
  cv.addEventListener('pointerdown', e => {
    if (!started) { begin(true, e.clientX, e.clientY); return; }
    if (!snd.isOn()) snd.start(T);
    burst(e.clientX, e.clientY, 10, 1.2 * k, '255,246,220', 0.8, 0.13 * k); one('ring', e.clientX, e.clientY, 0, 0, 0.5, 0.4 * k, '255,255,255'); snd.tap();
  });
  layout(); addEventListener('resize', layout);
  let last = performance.now(), acc = 0;
  function frame(now) {
    let dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (started) { const ck = snd.clock(); if (ck !== null) { const drift = ck - (T + acc); if (Math.abs(drift) > 0.5) snd.resync(T + acc); else dt += drift * 0.08; } }
    acc += Math.max(0, dt);
    let n = 0; while (acc >= DT && n < 8) { step(); acc -= DT; n++; } if (n === 8) acc = 0;
    render(); hud(); snd.run(T);
    requestAnimationFrame(frame);
  }
  window.__sb = {
    seek: t => { if (!started) begin(false); let i = 0; while (T < t) { step(); if (++i % 6 === 0) render(); } render(); hud(); },
    frame: () => { render(); hud(); }, T: () => T, snd, start: (x, y) => begin(true, x, y), parts: () => parts.length,
    probe: () => ({ O: { head: O.headW, paw: O.pawW, x: O.x }, G: { head: G.headW, paw: G.pawW, x: G.x }, gold: GOLD })
  };
  { const m = /t=([\d.]+)/.exec(location.hash); if (m) window.__sb.seek(+m[1]); }
  requestAnimationFrame(frame);
})();
</script>
