  html, body { height: 100%; background: var(--night); }

<body>
<canvas id="c" aria-label="One lane in Taipei at eight in the evening, seen side on: old five-storey apartment buildings with iron window cages, air conditioners, potted plants and laundry, lit shop signs, a convenience store, scooters parked under the arcade, cables strung across, and Taipei 101 far off over the hills in the colour of the day. Faintly, from far away, a garbage truck starts playing Für Elise. Windows light up one after another, shadows dash past them, iron doors bang open and the neighbours run out in slippers with their bags: a grandmother who has been waiting at the curb since before the music started, an uncle in a tank top, a man in a towel with shampoo still in his hair, a woman in a face mask, a kid with a tiny bag, a student on his phone, the convenience store clerk with two big bags. They line up where the truck always stops, and every bag lands in the truck on the downbeat. The truck leaves and somebody always comes running too late. The recycling truck comes after. Everyone goes back in and the lights go off. Each night is a new day of the week: no truck on Wednesdays and Sundays, when the new foreigner comes out anyway and the grandmother waves him back in from her window, sometimes rain, sometimes a typhoon. And night by night, two neighbours who only ever meet at the garbage truck fall in love."></canvas>
<div id="safe"></div>
<div id="hint">tap for sound</div>

<script>
(() => {
  // Rules. 1. One lane, one fixed frame. 2. The truck plays Für Elise and the music never waits.
  // 3. Every bag lands in the truck on a beat. 4. The same people live here every night; they change slowly.
  // 5. No words but the day, and the signs on the street. 6. No voices.
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const chance = p => Math.random() < p;
  const weighted = list => { let s = 0; for (const o of list) s += o[1]; let r = Math.random() * s; for (const o of list) if ((r -= o[1]) < 0) return o[0]; return list[list.length - 1][0]; };
  const FACE = '"Helvetica Neue", Arial, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  const SERIF = 'Georgia, "Times New Roman", "Songti TC", serif';

  // ---------- the lane ----------
  let W, H, DPR, SAFE_T = 0, FH, PH, SH, yG, yS, yQ, yW, BW, TL, TH, WR, facade;
  let blds = [], units = [], cables = [], lampX = 0, x101 = 0;
  const WALLS = ['#4a4741', '#54453c', '#43504a', '#5a5248', '#4a3e44', '#3e4652', '#57504a'];
  const CAGES = ['#c9c6bc', '#b8b4a8', '#8a5a3a', '#5a7a62', '#9aa0a6'];
  const SIGNS = [['早餐', '#e0602a'], ['水電行', '#2a7ac8'], ['藥局', '#2a9a52'], ['洗衣', '#2aa0c0'], ['理髮', '#c83040'], ['麵店', '#d8902a'], ['五金', '#8a6a2a'], ['機車行', '#3a5ab0'], ['文具', '#b04a9a'], ['自助餐', '#d0502a'], ['中醫診所', '#2a8a7a'], ['補習班', '#c8302a']];
  const SHOP_KINDS = ['shutter', 'shutter', 'scooters', 'shutter'];
  function lane() {
    FH = clamp(Math.min(H * 0.105, W * 0.24), 56, 118);
    PH = FH * 0.6; SH = Math.max(H * 0.16, FH * 1.35);
    yG = H - SH; yS = yG - FH * 0.05; yQ = yG + SH * 0.22; yW = yG + SH * 0.76;
    BW = clamp(W / 3.1, FH * 1.5, FH * 2.4);
    TL = clamp(W * 0.5, FH * 2.4, FH * 3.6); TH = PH * 1.7; WR = TH * 0.17;
    blds = []; units = []; cables = [];
    const deck = [...SIGNS].sort(() => Math.random() - 0.5);
    let x = -rnd(0.1, 0.35) * BW;
    while (x < W) {
      const w = BW * rnd(0.9, 1.1), gf = FH * 1.15;
      const b = { x, w, gf, top: yG - gf - FH * 4, wall: pick(WALLS), stains: Array.from({ length: 5 }, () => [rnd(0.05, 0.95), rnd(0.3, 1), rnd(1, 3)]),
        doorLeft: chance(0.5), shop: pick(SHOP_KINDS), sign: deck[blds.length % deck.length], tank: chance(0.7), shed: chance(0.45), shedLit: chance(0.4), vsign: chance(0.3) ? deck[(blds.length + 5) % deck.length] : null,
        scooters: Array.from({ length: 2 + Math.floor(rnd(0, 3)) }, () => [rnd(0, 1), pick(['#c9c5bd', '#8a2e2e', '#2e4f8a', '#2a2a30', '#b08a3a', '#7a9a8a', '#d8d8d8'])]) };
      const dw = w * 0.22;
      b.door = { x: x + (b.doorLeft ? w * 0.1 : w * 0.66), w: dw, h: gf * 0.72, open: 0, b };
      b.door.cx = b.door.x + dw / 2;
      for (let f = 1; f <= 4; f++) for (const side of [0, 1]) {
        const ww = w * 0.3, wh = FH * 0.46, wx = x + (side ? w * 0.6 : w * 0.1), wy = yG - gf - f * FH + FH * 0.2;
        units.push({ b, f, side, x: wx, y: wy, w: ww, h: wh, cage: pick(CAGES), ac: chance(0.75) ? (chance(0.5) ? 'side' : 'below') : null, laundry: chance(0.3), plants: Math.floor(rnd(0, 4)),
          tone: weighted([['warm', 3], ['cool', 2], ['tv', 1]]), light: 0, lightTo: chance(0.25) ? 1 : 0, dash: -9, folk: null, wave: -9, lean: null });
      }
      blds.push(b);
      x += w;
    }
    // the store goes on a building whose door is on the other side
    const sb = blds.filter(b => b.x > -b.w * 0.3 && b.x + b.w < W + b.w * 0.3);
    const storeB = pick(sb.length ? sb : blds);
    storeB.shop = 'store';
    for (let k = 0; k < 9; k++) { const x1 = rnd(-20, W), x2 = x1 + rnd(W * 0.3, W * 0.9); cables.push([x1, yG - FH * 1.15 - rnd(-FH * 0.1, FH * 1.6), x2, yG - FH * 1.15 - rnd(-FH * 0.1, FH * 1.6), rnd(FH * 0.1, FH * 0.45)]); }
    lampX = W * rnd(0.78, 0.9); x101 = W * rnd(0.55, 0.8);
  }
  const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * k, g = ((n >> 8) & 255) * k, b = (n & 255) * k; return `rgb(${clamp(r, 0, 255) | 0},${clamp(g, 0, 255) | 0},${clamp(b, 0, 255) | 0})`; };
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  const C101 = ['#a060e0', '#e84040', '#f0902a', '#f0d03a', '#3ac070', '#3a8af0', '#6a5ae0'];
  function paintFacade() {
    facade = document.createElement('canvas'); facade.width = cv.width; facade.height = cv.height;
    const g = facade.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    // sky, hills, and the tower in the colour of the day
    const top = Math.min(...blds.map(b => b.top)) - FH * 0.6;
    const sky = g.createLinearGradient(0, 0, 0, yG); sky.addColorStop(0, '#080c22'); sky.addColorStop(0.6, '#161b3c'); sky.addColorStop(1, '#3a2d48');
    g.fillStyle = sky; g.fillRect(0, 0, W, yG);
    const hill = (y0, amp, col, seed) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, yG); for (let x = 0; x <= W; x += 6) g.lineTo(x, y0 - amp * (0.5 + 0.3 * Math.sin(x / W * 5 + seed) + 0.2 * Math.sin(x / W * 13 + seed * 2))); g.lineTo(W, yG); g.closePath(); g.fill(); };
    const hy = top + FH * 0.2;
    hill(hy, FH * 1.4, '#1a1d3a', 1);
    // 101: eight stacked tiers and a spire
    const tw = FH * 0.2, tierH = FH * 0.115, base = hy - FH * 0.35, col = C101[weekday];
    g.fillStyle = '#20243e'; g.fillRect(x101 - tw * 0.7, base, tw * 1.4, FH);
    for (let k = 0; k < 8; k++) {
      const y = base - (k + 1) * tierH;
      g.fillStyle = '#262a48'; g.beginPath(); g.moveTo(x101 - tw * 0.5, y + tierH); g.lineTo(x101 - tw * 0.62, y); g.lineTo(x101 + tw * 0.62, y); g.lineTo(x101 + tw * 0.5, y + tierH); g.closePath(); g.fill();
      g.strokeStyle = col; g.globalAlpha = 0.85; g.lineWidth = 1; g.beginPath(); g.moveTo(x101 - tw * 0.62, y + 0.5); g.lineTo(x101 + tw * 0.62, y + 0.5); g.stroke(); g.globalAlpha = 1;
    }
    const tt = base - 8 * tierH;
    g.fillStyle = '#262a48'; g.fillRect(x101 - tw * 0.3, tt - tierH * 0.8, tw * 0.6, tierH * 0.8); g.fillRect(x101 - 1, tt - tierH * 2.6, 2, tierH * 1.8);
    g.fillStyle = col; g.globalAlpha = 0.25; g.beginPath(); g.arc(x101, tt - tierH * 0.4, tw * 0.9, 0, TAU); g.fill(); g.globalAlpha = 1;
    hill(hy + FH * 0.5, FH * 0.9, '#121530', 4);
    // cables behind the buildings' fronts are drawn after; first the buildings
    for (const b of blds) paintBuilding(g, b);
    // window glass is cut out, so the lights can live underneath
    for (const u of units) g.clearRect(u.x, u.y, u.w, u.h);
    for (const u of units) paintCage(g, u);
    for (const b of blds) paintGround(g, b);
    // cables
    g.strokeStyle = 'rgba(10,10,14,0.85)'; g.lineWidth = 1;
    for (const [x1, y1, x2, y2, sag] of cables) { g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + sag, x2, y2); g.stroke(); }
    // the street
    const st = g.createLinearGradient(0, yG, 0, H); st.addColorStop(0, '#24252b'); st.addColorStop(1, '#16171b');
    g.fillStyle = st; g.fillRect(0, yG, W, H - yG);
    g.fillStyle = '#5a5a5e'; g.fillRect(0, yG, W, Math.max(2, SH * 0.04));
    g.fillStyle = '#a8302a'; g.fillRect(0, yG + SH * 0.04, W, Math.max(2, SH * 0.025));
    g.strokeStyle = 'rgba(230,230,220,0.35)'; g.lineWidth = Math.max(1.5, SH * 0.015); g.beginPath(); g.moveTo(0, yG + SH * 0.5); g.lineTo(W, yG + SH * 0.5); g.stroke();
    g.fillStyle = '#2e2f35'; g.fillRect(W * 0.15, yG + SH * 0.12, FH * 0.5, SH * 0.06); g.strokeStyle = '#1a1a1e'; for (let k = 1; k < 6; k++) { g.beginPath(); g.moveTo(W * 0.15 + k * FH * 0.08, yG + SH * 0.12); g.lineTo(W * 0.15 + k * FH * 0.08, yG + SH * 0.18); g.stroke(); }
    if (cfg.rain) {
      // a wet street mirrors the store and the lamp
      g.fillStyle = 'rgba(120,140,190,0.06)'; g.fillRect(0, yG, W, H - yG);
      for (const bb of blds) if (bb.shop === 'store') for (let k = 0; k < 7; k++) { g.fillStyle = `rgba(230,255,240,${0.07 - k * 0.009})`; g.fillRect(bb.x + bb.w * (0.25 + k * 0.07), yG + SH * 0.08, Math.max(1, bb.w * 0.025), SH * (0.75 - k * 0.07)); }
      for (let k = 0; k < 5; k++) { g.fillStyle = `rgba(255,220,160,${0.08 - k * 0.012})`; g.fillRect(lampX - FH * 0.35 - 1 + (k - 2) * 2.5, yG + SH * 0.1, 2, SH * (0.8 - k * 0.08)); }
    }
    // the lamp post and its light
    const lt = yG - FH * 2.3;
    const pool = g.createRadialGradient(lampX - FH * 0.35, lt + FH * 0.1, 0, lampX - FH * 0.35, lt + FH * 0.1, FH * 3);
    pool.addColorStop(0, 'rgba(255,214,150,0.22)'); pool.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = pool; g.fillRect(lampX - FH * 3.4, lt - FH * 3, FH * 6, FH * 6);
    g.fillStyle = '#3a3c42'; g.fillRect(lampX - 2, lt, 4, yG + SH * 0.06 - lt);
    g.strokeStyle = '#3a3c42'; g.lineWidth = 3; g.beginPath(); g.moveTo(lampX, lt + 2); g.quadraticCurveTo(lampX, lt - FH * 0.2, lampX - FH * 0.35, lt - FH * 0.1); g.stroke();
    g.fillStyle = '#ffe7b0'; g.beginPath(); g.ellipse(lampX - FH * 0.35, lt - FH * 0.06, FH * 0.12, FH * 0.05, 0, 0, TAU); g.fill();
  }
  function paintBuilding(g, b) {
    const { x, w, gf, top } = b;
    g.fillStyle = b.wall; g.fillRect(x, top, w, yG - gf - top);
    // little square tiles
    g.strokeStyle = 'rgba(255,255,255,0.045)'; g.lineWidth = 1;
    const ts = Math.max(5, FH * 0.07);
    for (let yy = top; yy < yG - gf; yy += ts) { g.beginPath(); g.moveTo(x, yy); g.lineTo(x + w, yy); g.stroke(); }
    for (let xx = x; xx < x + w; xx += ts) { g.beginPath(); g.moveTo(xx, top); g.lineTo(xx, yG - gf); g.stroke(); }
    // years of rain
    for (const [sx, len, sw] of b.stains) { const gr = g.createLinearGradient(0, top, 0, top + (yG - gf - top) * len); gr.addColorStop(0, 'rgba(0,0,0,0.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x + w * sx, top, sw * FH * 0.04, (yG - gf - top) * len); }
    // floor lines and the edge between buildings
    g.fillStyle = 'rgba(0,0,0,0.18)'; for (let f = 1; f <= 4; f++) g.fillRect(x, yG - gf - f * FH, w, 2);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x, top, 2, yG - top);
    // roof: parapet, water tank, tin room
    g.fillStyle = shade(b.wall, 0.8); g.fillRect(x, top - FH * 0.12, w, FH * 0.12);
    if (b.shed) { const sx = x + w * 0.1, sw = w * 0.5, sh = FH * 0.55; g.fillStyle = '#3c4a66'; g.fillRect(sx, top - FH * 0.12 - sh, sw, sh); g.strokeStyle = 'rgba(255,255,255,0.08)'; for (let k = 1; k * 5 < sw; k++) { g.beginPath(); g.moveTo(sx + k * 5, top - FH * 0.12 - sh); g.lineTo(sx + k * 5, top - FH * 0.12); g.stroke(); } g.fillStyle = b.shedLit ? '#ffd88a' : '#1a1e2a'; g.fillRect(sx + sw * 0.6, top - FH * 0.12 - sh * 0.75, sw * 0.25, sh * 0.35); }
    if (b.tank) { const tx = x + w * 0.72, ty = top - FH * 0.12, tr = FH * 0.2; g.strokeStyle = '#3a3c42'; g.lineWidth = 2; g.beginPath(); g.moveTo(tx - tr * 0.8, ty); g.lineTo(tx - tr * 0.6, ty - FH * 0.25); g.moveTo(tx + tr * 0.8, ty); g.lineTo(tx + tr * 0.6, ty - FH * 0.25); g.stroke(); g.fillStyle = '#8a8e96'; g.fillRect(tx - tr, ty - FH * 0.25 - tr * 1.6, tr * 2, tr * 1.6); g.fillStyle = '#a8acb4'; g.beginPath(); g.ellipse(tx, ty - FH * 0.25 - tr * 1.6, tr, tr * 0.25, 0, 0, TAU); g.fill(); }
    // a vertical sign
    if (b.vsign) {
      const [t, c] = b.vsign, sx = b.doorLeft ? x + w * 0.88 : x + w * 0.02, sw = w * 0.1, sy = yG - gf - FH * 1.9, sh = FH * 1.7;
      g.fillStyle = c; g.fillRect(sx, sy, sw, sh); g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 1; g.strokeRect(sx + 0.5, sy + 0.5, sw - 1, sh - 1);
      g.fillStyle = '#fff'; g.font = `700 ${Math.round(sw * 0.7)}px ${FACE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      [...t].forEach((ch, i) => g.fillText(ch, sx + sw / 2, sy + sh * (i + 0.5) / t.length));
    }
  }
  function paintCage(g, u) {
    const { x, y, w, h } = u, b = u.b;
    // the air conditioner and its drip stain
    if (u.ac) {
      const aw = w * 0.42, ah = h * 0.42, ax = u.ac === 'side' ? (u.side ? x - aw - w * 0.12 : x + w + w * 0.12) : x + w * 0.3, ay = u.ac === 'side' ? y + h * 0.3 : y + h + h * 0.28;
      if (ax > b.x && ax + aw < b.x + b.w) {
        const gr = g.createLinearGradient(0, ay + ah, 0, ay + ah + FH * 0.5); gr.addColorStop(0, 'rgba(0,0,0,0.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(ax + aw * 0.4, ay + ah, aw * 0.2, FH * 0.5);
        g.fillStyle = '#b8b8b2'; g.fillRect(ax, ay, aw, ah); g.strokeStyle = '#8a8a86'; g.lineWidth = 1;
        for (let k = 1; k < 5; k++) { g.beginPath(); g.moveTo(ax + 2, ay + ah * k / 5); g.lineTo(ax + aw * 0.55, ay + ah * k / 5); g.stroke(); }
        g.beginPath(); g.arc(ax + aw * 0.77, ay + ah / 2, ah * 0.32, 0, TAU); g.stroke();
      }
    }
    // the iron cage, with a little tin roof, plants and laundry
    const cx = x - w * 0.08, cy = y - h * 0.12, cw = w * 1.16, ch = h * 1.24;
    g.fillStyle = shade(u.cage, 0.6); g.beginPath(); g.moveTo(cx - 3, cy); g.lineTo(cx + cw / 2, cy - h * 0.12); g.lineTo(cx + cw + 3, cy); g.closePath(); g.fill();
    g.strokeStyle = u.cage; g.lineWidth = 1.2; g.strokeRect(cx, cy, cw, ch);
    const n = Math.max(5, Math.round(cw / 6));
    for (let k = 1; k < n; k++) { g.beginPath(); g.moveTo(cx + cw * k / n, cy); g.lineTo(cx + cw * k / n, cy + ch); g.stroke(); }
    g.beginPath(); g.moveTo(cx, cy + ch * 0.22); g.lineTo(cx + cw, cy + ch * 0.22); g.stroke();
    for (let k = 0; k < n; k++) { g.beginPath(); g.moveTo(cx + cw * k / n, cy + ch * 0.22); g.lineTo(cx + cw * (k + 0.5) / n, cy + ch * 0.1); g.lineTo(cx + cw * (k + 1) / n, cy + ch * 0.22); g.stroke(); }
    g.fillStyle = shade(u.cage, 0.7); g.fillRect(cx - 2, cy + ch - 2, cw + 4, 3);
    for (let k = 0; k < u.plants; k++) { const px = cx + cw * (0.15 + k * 0.25); g.fillStyle = '#8a4a2a'; g.fillRect(px - 3, cy + ch - 7, 6, 5); g.fillStyle = pick(['#2f6a3a', '#3f7a3a', '#4a8a4a']); g.beginPath(); g.arc(px, cy + ch - 9, 5, 0, TAU); g.fill(); g.beginPath(); g.arc(px - 3, cy + ch - 6, 3, 0, TAU); g.fill(); }
    if (u.laundry) {
      g.strokeStyle = '#8a8a8a'; g.lineWidth = 1; g.beginPath(); g.moveTo(cx, cy + ch + 2); g.lineTo(cx + cw, cy + ch + 2); g.stroke();
      let lx = cx + 3;
      while (lx < cx + cw - 6) {
        const c = pick(['#e8e4dc', '#4a6aa8', '#c84a5a', '#3a3a40', '#e8c84a', '#8ab0d0', '#f0a0b0']), k = pick(['shirt', 'pants', 'sock']);
        g.fillStyle = shade(c, 0.75);
        if (k === 'shirt') { g.fillRect(lx, cy + ch + 2, 9, 11); g.fillRect(lx - 2, cy + ch + 2, 13, 4); lx += 15; }
        else if (k === 'pants') { g.fillRect(lx, cy + ch + 2, 8, 4); g.fillRect(lx, cy + ch + 2, 3.5, 14); g.fillRect(lx + 4.5, cy + ch + 2, 3.5, 14); lx += 12; }
        else { g.fillRect(lx, cy + ch + 2, 3, 6); lx += 6; }
      }
    }
  }
  function paintGround(g, b) {
    const { x, w, gf } = b, ct = yG - gf;
    // the shop sign over the arcade
    const sh = FH * 0.28;

    if (cfg.ghost) for (const b of blds) { if (b.barrel === undefined) b.barrel = b.x + b.w * rnd(0.3, 0.7); const x = b.barrel; ctx.fillStyle = '#3a3a40'; ctx.fillRect(x - FH * 0.09, yG - FH * 0.22, FH * 0.18, FH * 0.2); ctx.fillStyle = `rgba(255,${150 + 60 * Math.sin(T * 9 + x) | 0},40,0.95)`; ctx.beginPath(); ctx.ellipse(x, yG - FH * 0.22, FH * 0.08, FH * 0.03 + Math.sin(T * 13 + x) * 2, 0, 0, TAU); ctx.fill(); }
    for (const s of sparks) { const k = T - s.t; ctx.fillStyle = `rgba(255,190,90,${1 - k / s.life})`; ctx.fillRect(s.x + s.vx * k, s.y + s.vy * k, 2, 2); }
    // everything on the ground, back to front
    const items = [];
    for (const f of folk) if (f.out && !['home', 'gone'].includes(f.state)) items.push([f.y, () => drawFolk(f)]);
    if (dog && dog.state !== 'wait' && dog.state !== 'gone') items.push([dog.y, () => drawDog(dog)]);
    for (const tr of trucks) items.push([yW, () => drawTruck(tr)]);
    const db = trucks[0] && trucks[0].driveBy;
    if (db && T > db.t && !db.done) items.push([yW + 1, () => drawScooterRider(db.x, yW - WR * 0.3, db.thrown)]);
    items.sort((a, b) => a[0] - b[0]);
    for (const [, f] of items) f();
    // bags in the air
    for (const b of bags) {
      const u = clamp((T - b.t0) / (b.t1 - b.t0)), x = lerp(b.x0, b.x1, u), y = lerp(b.y0, b.y1, u) - Math.sin(u * Math.PI) * (b.ground ? PH * 0.2 : PH * 0.9);
      ctx.save(); ctx.translate(x, y); ctx.rotate(b.rot * u); bagShape(0, 0, b.kind === 'small' ? 6 : 10, b.kind === 'small' ? 'white' : b.kind); ctx.restore();
    }
    // notes from the speaker
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const n of notes) { const k = (T - n.t) / n.life; ctx.globalAlpha = 1 - k; ctx.fillStyle = `hsl(${(n.m - 64) * 28 % 360},80%,72%)`; ctx.font = `${Math.round(FH * 0.2)}px ${SERIF}`; ctx.fillText(n.m % 2 ? '♪' : '♫', n.x + Math.sin(k * 5 + n.m) * FH * 0.1, n.y - k * FH * 0.7); }
    ctx.globalAlpha = 1;
    for (const p of pofs) { const k = (T - p.t) / p.life; ctx.strokeStyle = `rgba(255,240,180,${1 - k})`; ctx.lineWidth = 2; for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * PH * 0.15 * (1 + k), p.y + Math.sin(a) * PH * 0.15 * (1 + k)); ctx.lineTo(p.x + Math.cos(a) * PH * 0.3 * (1 + k), p.y + Math.sin(a) * PH * 0.3 * (1 + k)); ctx.stroke(); } }
    for (const h of hearts) { const k = (T - h.t) / h.life; heart(h.x + Math.sin(k * 6) * 3, h.y - k * PH * 0.6, PH * (h.small ? 0.12 : 0.2), 1 - k * k); }
    ctx.font = `700 ${Math.round(PH * 0.35)}px ${FACE}`;
    for (const m of marks) { const k = (T - m.t) / m.life; if (k < 0) continue; ctx.globalAlpha = Math.min(1, (1 - k) * 4); ctx.fillStyle = '#fff2c0'; ctx.fillText(m.ch, m.f.x, m.f.y - PH * 1.35 - Math.min(1, k * 6) * 4); }
    ctx.globalAlpha = 1;
    if (cfg.rain) {
      ctx.strokeStyle = 'rgba(190,210,240,0.55)'; ctx.lineWidth = 1;
      for (const s of splashes) { const k = (T - s.t) / s.life; ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.ellipse(s.x, s.y, 1 + k * 5, 0.5 + k * 1.6, 0, 0, TAU); ctx.stroke(); }
      ctx.globalAlpha = 1;
      // drops are only seen where the lamp lights them
      const lx = lampX - FH * 0.35, ly = yG - FH * 2.3;
      ctx.strokeStyle = 'rgba(255,230,190,0.5)';
      for (let i = 0; i < (cfg.typhoon ? 40 : 22); i++) { const sx = lx + Math.sin(i * 12.9898) * FH * 1.2, ph = (T * (1.8 + (i % 5) * 0.2) + i * 0.37) % 1, sy = ly + ph * (yG - ly); const slant = cfg.typhoon ? 6 : 1.5; ctx.beginPath(); ctx.moveTo(sx + ph * slant * 6, sy); ctx.lineTo(sx + ph * slant * 6 + slant, sy + 7); ctx.stroke(); }
    }
    // the day
    for (const t of titles) {
      const k = T - t.t; if (k < 0 || k > t.life) continue;
      ctx.globalAlpha = Math.min(1, k * 2, (t.life - k) * 1.5);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#f4ead8';
      const x0 = 18, y0 = SAFE_T + (t.big ? 64 : 112);
      if (t.big) { ctx.font = `italic ${Math.round(clamp(W * 0.11, 30, 56))}px ${SERIF}`; ctx.fillText(t.lines[0], x0, y0); ctx.font = `italic 15px ${SERIF}`; ctx.fillStyle = 'rgba(244,234,216,0.75)'; ctx.fillText('Taipei, 8 PM', x0 + 2, y0 + 24); }
      else t.lines.forEach((l, i) => { ctx.font = i ? `14px ${FACE}` : `600 17px ${FACE}`; ctx.fillStyle = i ? 'rgba(244,234,216,0.75)' : '#f4ead8'; ctx.fillText(l, x0, y0 + i * 21); });
      ctx.globalAlpha = 1;
    }
    if (T > ending) { ctx.fillStyle = `rgba(8,12,34,${clamp((T - ending) / 2.2)})`; ctx.fillRect(0, 0, W, H); }
    if (T - E0 < 1.2) { ctx.fillStyle = `rgba(8,12,34,${1 - clamp((T - E0) / 1.2)})`; ctx.fillRect(0, 0, W, H); }
  }
  function drawScooterRider(x, y, thrown) {
    const s = FH * 0.4;
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x - s * 0.7, y - s * 0.2, s * 0.22, 0, TAU); ctx.arc(x + s * 0.7, y - s * 0.2, s * 0.22, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c8c4bc'; ctx.beginPath(); ctx.moveTo(x + s * 0.95, y - s * 0.3); ctx.quadraticCurveTo(x + s, y - s * 0.75, x + s * 0.4, y - s * 0.72); ctx.lineTo(x - s * 0.3, y - s * 0.55); ctx.lineTo(x - s * 0.55, y - s * 1.1); ctx.lineTo(x - s * 0.75, y - s * 1.1); ctx.lineTo(x - s * 0.8, y - s * 0.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a4a6a'; ctx.fillRect(x - s * 0.1, y - s * 1.6, s * 0.5, s * 0.8);
    ctx.fillStyle = '#e8e8e8'; ctx.beginPath(); ctx.arc(x + s * 0.05, y - s * 1.85, s * 0.28, 0, TAU); ctx.fill(); ctx.fillStyle = '#26324a'; ctx.fillRect(x - s * 0.22, y - s * 1.92, s * 0.18, s * 0.14);
    ctx.strokeStyle = '#3a4a6a'; ctx.lineWidth = s * 0.14; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y - s * 1.45); ctx.lineTo(thrown ? x - s * 0.5 : x - s * 0.6, thrown ? y - s * 2.1 : y - s * 1.1); ctx.stroke();
    if (!thrown) bagShape(x + s * 0.4, y - s * 0.9, 9, 'white');
  }

  // ---------- sound ----------
  // The truck's speaker: a toy-keyboard Für Elise, a little out of tune, louder as it comes round the corner.
  let AC = null, master, verb, noise, truckBus, truckLP, rainG, soundOn = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const live = () => AC && soundOn;
  const pan = x => clamp(x / W * 2 - 1, -1, 1) * 0.7;
  function initAudio() {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0;
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(AC.destination);
    const sr = AC.sampleRate, len = Math.floor(sr * 1.6), ir = AC.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb = AC.createConvolver(); verb.buffer = ir;
    const vg = AC.createGain(); vg.gain.value = 0.28; verb.connect(vg); vg.connect(master);
    noise = AC.createBuffer(1, Math.floor(sr * 2), sr);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    truckBus = AC.createGain(); truckBus.gain.value = 0;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 320;
    const shaper = AC.createWaveShaper(); const curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 2.2); } shaper.curve = curve;
    truckLP = AC.createBiquadFilter(); truckLP.type = 'lowpass'; truckLP.frequency.value = 1200;
    truckBus.connect(hp); hp.connect(shaper); shaper.connect(truckLP); truckLP.connect(master); truckLP.connect(verb);
    // the city at night, and the rain when there is rain
    const src = AC.createBufferSource(), lp = AC.createBiquadFilter(), hum = AC.createGain(); src.buffer = noise; src.loop = true; lp.type = 'lowpass'; lp.frequency.value = 260; hum.gain.value = 0.03; src.connect(lp); lp.connect(hum); hum.connect(master); src.start();
    const src2 = AC.createBufferSource(), lp2 = AC.createBiquadFilter(); src2.buffer = noise; src2.loop = true; lp2.type = 'lowpass'; lp2.frequency.value = 1800; rainG = AC.createGain(); rainG.gain.value = 0; src2.connect(lp2); lp2.connect(rainG); rainG.connect(master); src2.start(0.7);
    schedK = Math.max(0, Math.ceil((T - tm) / SIX));
  }
  function out(vel, p = 0) { const g = AC.createGain(); g.gain.value = vel; let o = g; if (AC.createStereoPanner) { const s = AC.createStereoPanner(); s.pan.value = p; g.connect(s); o = s; } o.connect(master); o.connect(verb); return g; }
  function chime(m, t, melody) {
    const f = mtof(m) * (1 + rnd(-0.004, 0.004));
    for (const [type, mul, g0, d] of [['square', 1, melody ? 0.07 : 0.045, melody ? 0.42 : 0.5], ['triangle', 2, melody ? 0.04 : 0.02, 0.25]]) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f * mul;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(g0, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(truckBus); o.start(t); o.stop(t + d + 0.02);
    }
  }
  function nz(t, f, q, dur, vel, p = 0) {
    const s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(out(1, p)); s.start(t, rnd(0, 1.5)); s.stop(t + dur + 0.05);
  }
  function tone(type, f0, f1, t, dur, vel, p = 0) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out(1, p)); o.start(t); o.stop(t + dur + 0.02);
  }
  const now = () => AC.currentTime + 0.01;
  let stepsThisFrame = 0;
  function step(f, running) { if (!live() || stepsThisFrame > 3) return; stepsThisFrame++; nz(now(), f.look.shoe === 'slipper' ? 2400 : 1200, f.look.shoe === 'slipper' ? 2.5 : 1.5, 0.035, running ? 0.06 : 0.03, pan(f.x)); }
  function clank(x) { if (!live()) return; const t = now(); for (const fr of [310, 770, 1340, 2120]) tone('sine', fr, fr * 0.995, t, 0.35, 0.025, pan(x)); nz(t, 900, 1, 0.12, 0.12, pan(x)); }
  function thump(vel, tr) {
    if (!live()) return;
    // a bag on the beat, tuned to the bar's bass
    const t = now(), k = Math.floor((T - tm) / SIX), ev = slotEv(Math.max(0, k - ((k - 2) % 6 + 6) % 6)), bass = ev.find(m => m < 60) || 45;
    tone('sine', mtof(bass + 12) * 1.5, mtof(bass + 12), t, 0.25, 0.22 * vel, tr ? pan(tr.x + TL) : 0); nz(t, 260, 0.8, 0.12, 0.2 * vel);
  }
  const compactor = () => { if (!live()) return; const t = now(); tone('sawtooth', 70, 110, t, 1.3, 0.03); };
  const brake = () => { if (!live()) return; nz(now(), 3400, 3, 0.6, 0.05); };
  const clink = kind => { if (!live()) return; const t = now(); if (kind === 'cardboard') nz(t, 500, 1, 0.15, 0.15); else for (let i = 0; i < 4; i++) tone('sine', rnd(2200, 3600), rnd(2100, 3500), t + i * 0.04, 0.2, 0.03); };
  const pof = () => { if (!live()) return; const t = now(); nz(t, 1500, 0.7, 0.2, 0.15); [69, 72, 76, 81].forEach((m, i) => tone('sine', mtof(m), mtof(m), t + 0.1 + i * 0.07, 0.8, 0.05)); };
  function audioTick() {
    if (!live()) return;
    stepsThisFrame = 0;
    const tr = trucks[0];
    let g = 0, cut = 600, p = 0;
    if (cfg.truckNight && tr && T > tm) {
      const cx = tr.x + TL * 0.1, d = cx > W ? cx - W : cx < 0 ? -cx : 0;
      g = 0.9 / (1 + d / (W * 0.4)); cut = 700 + 3800 / (1 + d / (W * 0.6)); p = pan(cx);
      if (tr.state === 'gone') g = 0;
    }
    if (Math.abs(g - (truckBus._g ?? -1)) > 0.01) { truckBus.gain.setTargetAtTime(g, AC.currentTime, 0.15); truckBus._g = g; }
    if (Math.abs(cut - (truckLP._c ?? -1)) > 30) { truckLP.frequency.setTargetAtTime(cut, AC.currentTime, 0.15); truckLP._c = cut; }
    void p;
    const rg = cfg.rain ? (cfg.typhoon ? 0.09 : 0.05) : 0;
    if (rg !== rainG._g) { rainG.gain.setTargetAtTime(rg, AC.currentTime, 0.8); rainG._g = rg; }
  }
  addEventListener('pointerdown', () => {
    if (!AC) initAudio();
    if (AC.state === 'suspended') AC.resume();
    soundOn = !soundOn;
    master.gain.setTargetAtTime(soundOn ? 1.2 : 0, AC.currentTime, 0.2);
    if (soundOn) schedK = Math.max(schedK, Math.ceil((T - tm) / SIX));
    document.getElementById('hint').hidden = true;
  });

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    SAFE_T = parseFloat(getComputedStyle(document.getElementById('safe')).paddingTop) || 0;
    lane(); moveIn();
    newEvening();
  }
  const _newEvening = newEvening;
  newEvening = function () { _newEvening(); noteK = 0; schedK = 0; timers.length = 0; if (story && story.next && story.pair) { const [n1, n2] = story.next; n1.type0 = n1.type; story = { a: n1, b: n2, step: 0, pair: false }; } };
  let last = performance.now(), resizeT = 0;
  function frame(t) {
    const dt = clamp((t - last) / 1000, 0, 0.05);
    last = t;
    runTimers(); update(dt); audioTick();
    draw();
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 300); });
  layout();
  window.__elise = () => ({ T: +T.toFixed(1), day, weekday, cfg: { ...cfg }, story: story && { step: story.step, beat: story.beat, pair: story.pair, a: story.a.state, b: story.b.state },
    trucks: trucks.map(t => `${t.kind}:${t.state}:${Math.round(t.x)}:q${t.queue.length}`), out: folk.filter(f => f.out).map(f => `${f.type}:${f.state}`), bags: bags.length });
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
  requestAnimationFrame(frame);
})();
</script>
