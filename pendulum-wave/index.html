<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendulum Wave</title>
<meta name="description" content="Every pendulum swings a little faster than the last: they scatter into waves and chaos, then come back into one perfect line. Tap for sound.">
<meta property="og:type" content="website">
<meta property="og:title" content="Pendulum Wave">
<meta property="og:description" content="Every pendulum swings a little faster than the last: they scatter into waves and chaos, then come back into one perfect line. Tap for sound.">
<meta property="og:url" content="https://superdenis777.github.io/pendulum-wave/">
<meta property="og:image" content="https://superdenis777.github.io/pendulum-wave/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0a10">
<style>
  :root { --bg: #0b0a10; --ink: #f4ead8; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); text-align: center; font: italic 15px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: 0.04em; color: var(--ink); opacity: 0; pointer-events: none; animation: hint 7s ease-in-out 1.5s forwards; }
  @keyframes hint { 0% { opacity: 0; } 20% { opacity: 0.6; } 75% { opacity: 0.6; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #hint { animation: none; opacity: 0.5; } }
</style>
</head>
<body>
<canvas id="c" aria-label="A row of coloured pendulums seen from above, each swinging a little faster than the one before. They are released together in one straight line, drift into a travelling wave, split into two lines, three, four, dissolve into a shimmer, and then, at the end of each cycle, come back into one perfect line at the same instant. Every time a pendulum passes the middle it plays its own note, so the music scatters and gathers exactly as they do, and every realignment is a chord. Each cycle the number of pendulums, their colours and the key change."></canvas>
<div id="hint">tap for sound</div>
<script>
(() => {
  // Rules. 1. Pendulum i swings exactly K + i times per cycle, so every cycle ends with all of them back in one line.
  // 2. Every time a pendulum passes the middle, it plays its note. The image is the score.
  // 3. At each realignment the next cycle changes something: how many, how fast, what colour, what key. Never the same twice.
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let W, H, DPR, vertical, T = 0, cyc = 0, N = 0, K = 0, G = 60, key = 2, hue0 = 200, mode = 0;
  let bobs = [], dying = [], cycleStart = 0, nextCycle = Infinity, releaseAt = 2.2;
  const MODES = [[0, 2, 4, 7, 9], [0, 3, 5, 7, 10], [0, 2, 4, 6, 9], [0, 2, 5, 7, 9], [0, 4, 5, 7, 11]];
  const PLAN = [15, 21, 27, 33, 19, 25, 31, 13, 23, 29, 17, 33, 21, 27];
  const pos = (b, t) => Math.cos(TAU * b.f * Math.max(0, t - b.t0));
  function newCycle(t) {
    cyc++;
    const maxN = Math.max(7, Math.floor((vertical ? H : W) * 0.84 / 22));
    const n = Math.min(maxN, PLAN[(cyc - 1) % PLAN.length]);
    G = pick([42, 48, 54, 60, 66]); K = Math.round(G / 2.2);
    key = (key + 7) % 12; mode = (cyc - 1) % MODES.length; hue0 = (hue0 + 53) % 360;
    for (let i = n; i < bobs.length; i++) { bobs[i].dieAt = t; dying.push(bobs[i]); }
    const old = bobs;
    bobs = Array.from({ length: n }, (_, i) => {
      const b = old[i] || { born: t, row: rowPos(i, n), flash: -9 };
      Object.assign(b, { i, f: (K + i) / G, t0: t, hue: (hue0 + i / Math.max(1, n - 1) * 210) % 360, note: noteFor(i, n) });
      b.next = t + 0.25 / b.f;
      return b;
    });
    N = n; cycleStart = t; nextCycle = t + G;
    bass(t);
  }
  function noteFor(i, n) { const d = Math.floor(i * 15 / Math.max(1, n)), m = MODES[mode]; return 45 + key + m[d % 5] + 12 * Math.floor(d / 5); }
  function rowPos(i, n) { const L = (vertical ? H : W) * 0.82, s = n > 1 ? L / (n - 1) : 0; return ((vertical ? H : W) - L) / 2 + i * s; }
  // how close to one line they are: 1 when aligned
  function order(t) { let c = 0, s = 0; for (const b of bobs) { const p = TAU * b.f * Math.max(0, t - b.t0); c += Math.cos(p); s += Math.sin(p); } return bobs.length ? Math.hypot(c, s) / bobs.length : 1; }

  function update(dt) {
    T += dt;
    if (T >= releaseAt && cyc === 0) newCycle(releaseAt);
    if (T >= nextCycle) newCycle(nextCycle);
    for (const b of bobs) b.row = lerp(b.row, rowPos(b.i, N), Math.min(1, dt * 2.5));
    for (let i = dying.length - 1; i >= 0; i--) if (T - dying[i].dieAt > 1.4) dying.splice(i, 1);
    // crossings: schedule the sound a little ahead, light the bob on time
    for (const b of bobs) {
      while (b.next < T + 0.12) {
        if (b.next >= T - 0.05) { schedule(b, b.next - T); b.flashAt = b.next; }
        b.next += 1 / b.f;
      }
      if (b.flashAt && T >= b.flashAt) { b.flash = b.flashAt; b.flashAt = 0; }
    }
  }
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0a10'; ctx.fillRect(0, 0, W, H);
    const cs = (vertical ? W : H) / 2, A = (vertical ? W : H) * 0.36, R = cyc ? order(T) : 1;
    const vg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    vg.addColorStop(0, `rgba(40,34,60,${0.35 + 0.25 * R * R})`); vg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    const P = (row, s) => vertical ? [cs + s, row] : [row, cs + s];
    const g = N > 1 ? (vertical ? H : W) * 0.82 / (N - 1) : 40, r = clamp(g * 0.34, 4, 15);
    // the bar
    const a0 = P(rowPos(0, N) - g * 0.6, 0), a1 = P(rowPos(N - 1, N) + g * 0.6, 0);
    ctx.strokeStyle = 'rgba(240,230,220,0.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]); ctx.stroke();
    // when they come together, the line they make
    if (R > 0.9) {
      const s = A * (cyc ? pos(bobs[0], T) : 1), l0 = P(rowPos(0, N), s), l1 = P(rowPos(N - 1, N), s);
      ctx.strokeStyle = `rgba(255,248,230,${(R - 0.9) * 4})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(l0[0], l0[1]); ctx.lineTo(l1[0], l1[1]); ctx.stroke();
    }
    const drawBob = (b, alpha) => {
      const t = T, x = cyc ? pos(b, t) : 1, s = A * x, [bx, by] = P(b.row, s), [px, py] = P(b.row, 0);
      ctx.globalAlpha = alpha;
      // its string, and where it has just been
      ctx.strokeStyle = `hsla(${b.hue},60%,70%,0.22)`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
      ctx.lineCap = 'round';
      for (let k = 1; k <= 10; k++) {
        const s1 = A * (cyc ? pos(b, t - (k - 1) * 0.025) : 1), s2 = A * (cyc ? pos(b, t - k * 0.025) : 1), [x1, y1] = P(b.row, s1), [x2, y2] = P(b.row, s2);
        ctx.strokeStyle = `hsla(${b.hue},80%,65%,${0.35 * (1 - k / 10)})`; ctx.lineWidth = r * (1.3 - k * 0.09); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      const fl = Math.max(0, 1 - (T - b.flash) / 0.45);
      if (fl > 0) { ctx.fillStyle = `hsla(${b.hue},90%,80%,${fl * 0.8})`; ctx.beginPath(); ctx.arc(px, py, 2 + fl * 3, 0, TAU); ctx.fill(); }
      const rr = r * (1 + 0.18 * fl);
      const gr = ctx.createRadialGradient(bx - rr * 0.35, by - rr * 0.35, rr * 0.1, bx, by, rr);
      gr.addColorStop(0, `hsl(${b.hue},90%,${88 + fl * 8}%)`); gr.addColorStop(0.45, `hsl(${b.hue},75%,${60 + fl * 15}%)`); gr.addColorStop(1, `hsl(${b.hue},70%,${32 + fl * 10}%)`);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(bx, by, rr, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    };
    for (const b of dying) drawBob(b, 1 - (T - b.dieAt) / 1.4);
    for (const b of bobs) drawBob(b, Math.min(1, (T - b.born) / 1.2));
    if (T < 1.5) { ctx.fillStyle = `rgba(11,10,16,${1 - T / 1.5})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- sound: each pendulum a bell; they agree when they agree ----------
  let AC = null, master, verb, soundOn = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function initAudio() {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0;
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3;
    master.connect(comp); comp.connect(AC.destination);
    const sr = AC.sampleRate, len = Math.floor(sr * 3), ir = AC.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4); }
    verb = AC.createConvolver(); verb.buffer = ir;
    const vg = AC.createGain(); vg.gain.value = 0.4; verb.connect(vg); vg.connect(master);
  }
  function schedule(b, ahead) {
    if (!AC || !soundOn) return;
    const t = AC.currentTime + 0.02 + Math.max(0, ahead), f = mtof(b.note), vel = 0.07 / Math.sqrt(Math.max(1, N / 9));
    const pan = AC.createStereoPanner ? AC.createStereoPanner() : null, o = AC.createGain(); o.gain.value = 1;
    if (pan) { pan.pan.value = (b.i / Math.max(1, N - 1) - 0.5) * 0.9; o.connect(pan); pan.connect(master); pan.connect(verb); } else { o.connect(master); o.connect(verb); }
    for (const [mul, g0, d] of [[1, vel, 1.6], [2.76, vel * 0.18, 0.5], [5.4, vel * 0.06, 0.18]]) {
      const x = AC.createOscillator(), g = AC.createGain(); x.type = 'sine'; x.frequency.value = f * mul;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(g0, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      x.connect(g); g.connect(o); x.start(t); x.stop(t + d + 0.02);
    }
  }
  function bass(at) {
    if (!AC || !soundOn) return;
    const t = AC.currentTime + 0.02 + Math.max(0, at - T), f = mtof(33 + key);
    for (const [mul, g0] of [[1, 0.12], [2, 0.05], [3, 0.015]]) { const x = AC.createOscillator(), g = AC.createGain(); x.type = 'sine'; x.frequency.value = f * mul; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(g0, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 5); x.connect(g); g.connect(master); g.connect(verb); x.start(t); x.stop(t + 5.1); }
  }
  addEventListener('pointerdown', () => {
    if (!AC) initAudio();
    if (AC.state === 'suspended') AC.resume();
    soundOn = !soundOn;
    master.gain.setTargetAtTime(soundOn ? 1.2 : 0, AC.currentTime, 0.2);
    document.getElementById('hint').hidden = true;
  });

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; vertical = H >= W;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    for (const b of bobs) b.row = rowPos(b.i, N);
  }
  let last = performance.now();
  function frame(t) {
    const dt = clamp((t - last) / 1000, 0, 0.05);
    last = t;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  addEventListener('resize', layout);
  layout();
  // held in one line for a moment, then let go
  bobs = Array.from({ length: 9 }, (_, i) => ({ i, row: rowPos(i, 9), born: 0, flash: -9, f: 1, t0: 0, hue: (hue0 + i / 8 * 210) % 360, note: 50 }));
  N = 9;
  window.__wave = () => ({ T: +T.toFixed(1), cyc, N, K, G, order: +order(T).toFixed(3), next: +(nextCycle - T).toFixed(1) });
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
