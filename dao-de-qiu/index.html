:root{--ink:#0b0d12;--bone:#ece2cc;--muted:#9d9584;--red:#d9482b;--gold:#f2c46b;--han:"DDJ Serif","Noto Serif TC","Songti TC","PMingLiU",serif;--lat:"Old Standard TT",Georgia,"Times New Roman",serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{cursor:grab;outline:none}
#gl.grab{cursor:grabbing}
#ov{pointer-events:none}
.low{position:absolute;left:0;right:0;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));text-align:center;pointer-events:none;opacity:0;transition:opacity .45s ease}
#where{font-family:var(--han);font-weight:700;font-size:18px;letter-spacing:.14em;color:var(--bone)}
#where small{display:block;margin-top:5px;font-family:var(--lat);font-weight:400;font-size:12px;letter-spacing:.1em;color:var(--muted)}
#where.on{opacity:.9}
#hint{font-family:var(--lat);font-style:italic;font-size:15px;letter-spacing:.02em;color:var(--muted);padding:0 20px}
#hint.on{opacity:.85;transition:opacity 1.6s ease}
#info{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));width:min(540px,calc(100% - 24px));transform:translate(-50%,18px);opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .45s cubic-bezier(.2,1.45,.4,1);display:flex;gap:16px;align-items:flex-start;padding:14px 18px 14px 16px;border-radius:16px;
  background:rgba(11,13,18,.86);font-family:var(--lat);color:var(--bone)}
#info.on{opacity:1;transform:translate(-50%,0)}
#info .big{font-family:var(--han);font-weight:700;font-size:62px;line-height:1;color:var(--gold);flex:none}
#info .tx{min-width:0;padding-top:2px}
#info .py{font-size:21px;line-height:1.2}
#info .py i{font-size:17px;color:var(--bone);opacity:.85;margin-left:6px}
#info .gl{font-size:14.5px;line-height:1.45;color:#cfc6b2;margin-top:6px}
#info .ct{font-size:12.5px;color:var(--muted);margin-top:7px;letter-spacing:.02em}
#info .ct b{font-family:var(--han);font-weight:700;color:var(--bone);font-size:13px;letter-spacing:.06em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#title{position:absolute;left:0;right:0;top:max(60px,calc(env(safe-area-inset-top) + 50px));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s ease}
#title.on{opacity:.92}
#title b{display:block;font-family:var(--han);font-weight:700;font-size:22px;letter-spacing:.3em;color:var(--bone);padding-left:.3em}
#title span{display:block;margin-top:6px;font-family:var(--lat);font-style:italic;font-size:14px;letter-spacing:.06em;color:var(--muted)}
#about{position:absolute;left:max(14px,calc(env(safe-area-inset-left) + 10px));top:max(12px,calc(env(safe-area-inset-top) + 8px));font-family:var(--lat);font-size:12.5px;letter-spacing:.04em;color:var(--muted);opacity:.55;text-decoration:none;padding:6px 4px;transition:opacity .3s ease}
#about:hover,#about:focus{opacity:.95}
#about i{font-family:var(--han);font-style:normal;font-weight:700;letter-spacing:.12em;margin-right:6px}
#wit{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));width:min(580px,calc(100% - 20px));transform:translate(-50%,10px);opacity:0;pointer-events:none;
  transition:opacity .9s ease,transform .9s ease;padding:11px 15px 12px;border-radius:14px;background:rgba(11,13,18,.74);font-family:var(--lat);color:var(--muted)}
#wit.on{opacity:1;transform:translate(-50%,0)}
#wit .hd{font-style:italic;font-size:12px;letter-spacing:.04em;margin:0 0 5px}
#wit .r{display:flex;gap:10px;align-items:baseline;margin:2px 0}
#wit .ed{flex:none;width:86px;font-size:12px;letter-spacing:.02em;text-align:right;white-space:nowrap}
#wit .zh{min-width:0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:var(--wz,16px);line-height:1.5;color:#cfc6b2;letter-spacing:.05em;word-break:break-all}
#wit .zh b{font-weight:inherit;color:#ef6a4c}
#wit .zh i{font-style:normal;opacity:.32}
#wit .zh u{text-decoration:none;color:#ef6a4c;margin:0 .05em}
#wit .nt{font-style:italic;font-size:13.5px;line-height:1.4;color:var(--bone);opacity:.88;margin-top:7px}
@media (max-width:480px){#wit .ed{width:50px;font-size:10.5px;white-space:normal;line-height:1.25}#wit{padding:9px 11px 10px}}
#fallback{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:var(--muted);font-style:italic;font-family:Georgia,serif}
</style>

const DATA={"ch":[["體道","道可道，非常道；名可名，非常名。無名，天地之始；有名，萬物之母。故常無欲，以觀其妙；常有欲，以觀其徼。此兩者，同出而異名，同謂之玄。玄之又玄，眾妙之門。"],["養身","天下皆知美之為美，斯惡已。皆知善之為善，斯不善已。故有無相生，難易相成，長短相較，高下相傾，音聲相和，前後相隨。是以聖人處無為之事，行不言之教；萬物作焉而不辭，生而不有，為而不恃，功成而弗居。夫唯弗居，是以不去。"],["安民","不尚賢，使民不爭；不貴難得之貨，使民不為盜；不見可欲，使心不亂。是以聖人之治，虛其心，實其腹，弱其志，強其骨。常使民無知無欲。使夫知者不敢為也。為無為，則無不治。"],["無源","道沖，而用之或不盈。淵兮似萬物之宗；挫其銳，解其紛，和其光，同其塵，湛兮似或存。吾不知誰之子，象帝之先。"],["虛用","天地不仁，以萬物為芻狗；聖人不仁，以百姓為芻狗。天地之間，其猶橐龠乎？虛而不屈，動而愈出。多言數窮，不如守中。"],["成象","谷神不死，是謂玄牝。玄牝之門，是謂天地根。綿綿若存，用之不勤。"],["韜光","天長地久。天地所以能長且久者，以其不自生，故能長生。是以聖人後其身而身先；外其身而身存。非以其無私邪？故能成其私。"],["易性","上善若水。水善利萬物而不爭，處眾人之所惡，故幾於道。居善地，心善淵，與善仁，言善信，正善治，事善能，動善時。夫唯不爭，故無尤。"],["運夷","持而盈之，不如其已；揣而銳之，不可長保。金玉滿堂，莫之能守；富貴而驕，自遺其咎。功遂身退，天之道。"],["能爲","載營魄抱一，能無離乎？專氣致柔，能嬰兒乎？滌除玄覽，能無疵乎？愛民治國，能無知乎？天門開闔，能為雌乎？明白四達，能無為乎？生之畜之，生而不有，為而不恃，長而不宰，是謂玄德。"],["無用","三十輻，共一轂，當其無，有車之用。埏埴以為器，當其無，有器之用。鑿戶牖以為室，當其無，有室之用。故有之以為利，無之以為用。"],["檢欲","五色令人目盲；五音令人耳聾；五味令人口爽；馳騁畋獵，令人心發狂；難得之貨，令人行妨。是以聖人為腹不為目，故去彼取此。"],["厭恥","寵辱若驚，貴大患若身。何謂寵辱若驚？寵為下，得之若驚，失之若驚，是謂寵辱若驚。何謂貴大患若身？吾所以有大患者，為吾有身，及吾無身，吾有何患？故貴以身為天下，若可寄天下；愛以身為天下，若可託天下。"],["贊玄","視之不見，名曰夷；聽之不聞，名曰希；搏之不得，名曰微。此三者不可致詰，故混而為一。其上不皦，其下不昧。繩繩不可名，復歸於無物。是謂無狀之狀，無物之象，是謂惚恍。迎之不見其首，隨之不見其後。執古之道，以御今之有。能知古始，是謂道紀。"],["顯德","古之善為士者，微妙玄通，深不可識。夫唯不可識，故強為之容。豫兮若冬涉川，猶兮若畏四鄰，儼兮其若容，渙兮若冰之將釋，敦兮其若樸，曠兮其若谷，混兮其若濁。孰能濁以靜之徐清？孰能安以久動之徐生？保此道者不欲盈。夫唯不盈，故能蔽不新成。"],["歸根","致虛極，守靜篤。萬物並作，吾以觀復。夫物芸芸，各復歸其根。歸根曰靜，是謂復命。復命曰常。知常曰明。不知常，妄作凶。知常容，容乃公，公乃王，王乃天，天乃道，道乃久。沒身不殆。"],["淳風","太上，下知有之；其次，親而譽之；其次，畏之；其次，侮之。信不足焉，有不信焉。悠兮其貴言。功成，事遂，百姓皆謂：「我自然」。"],["俗薄","大道廢，有仁義；智慧出，有大偽；六親不和，有孝慈；國家昏亂，有忠臣。"],["還淳","絕聖棄智，民利百倍；絕仁棄義，民復孝慈；絕巧棄利，盜賊無有。此三者以為文不足，故令有所屬。見素抱樸，少私寡欲。"],["異俗","絕學無憂。唯之與阿，相去幾何？善之與惡，相去若何？人之所畏，不可不畏。荒兮其未央哉！眾人熙熙，如享太牢，如春登臺。我獨泊兮其未兆，如嬰兒之未孩。儽儽兮若無所歸。眾人皆有餘，而我獨若遺。我愚人之心也哉，沌沌兮！俗人昭昭，我獨若昏。俗人察察，我獨悶悶。澹兮其若海，飂兮若無止。眾人皆有以，而我獨頑似鄙。我獨異於人，而貴食母。"],["虚心","孔德之容，惟道是從。道之為物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物。窈兮冥兮，其中有精；其精甚真，其中有信。自古及今，其名不去，以閱眾甫。吾何以知眾甫之狀哉？以此。"],["益謙","曲則全，枉則直，窪則盈，敝則新，少則得，多則惑。是以聖人抱一為天下式。不自見，故明；不自是，故彰；不自伐，故有功；不自矜，故長。夫唯不爭，故天下莫能與之爭。古之所謂曲則全者，豈虛言哉！誠全而歸之。"],["虚無","希言自然。故飄風不終朝，驟雨不終日。孰為此者？天地。天地尚不能久，而況於人乎？故從事於道者，道者同於道；德者，同於德；失者，同於失。同於道者，道亦樂得之；同於德者，德亦樂得之；同於失者，失亦樂得之。信不足焉，有不信焉。"],["若思","企者不立，跨者不行。自見者不明，自是者不彰，自伐者無功，自矜者不長。其在道也，曰：餘食贅行。物或惡之，故有道者不處。"],["名象","有物混成，先天地生。寂兮寥兮，獨立不改，周行而不殆，可以為天下母。吾不知其名，字之曰道，強為之名曰大。大曰逝，逝曰遠，遠曰反。故道大，天大，地大，王亦大。域中有四大，而王居其一焉。人法地，地法天，天法道，道法自然。"],["重德","重為輕根，靜為躁君。是以聖人終日行不離輜重，雖有榮觀，燕處超然。奈何萬乘之主，而以身輕天下？輕則失本，躁則失君。"],["巧用","善行無轍跡，善言無瑕謫，善數不用籌策，善閉無關楗而不可開，善結無繩約而不可解。是以聖人常善救人，故無棄人；常善救物，故無棄物。是謂襲明。故善人者，不善人之師；不善人者，善人之資。不貴其師，不愛其資，雖智大迷，是謂要妙。"],["返樸","知其雄，守其雌，為天下谿。為天下谿，常德不離，復歸於嬰兒。知其白，守其黑，為天下式。為天下式，常德不忒，復歸於無極。知其榮，守其辱，為天下谷。為天下谷，常德乃足，復歸於樸。樸散則為器，聖人用之，則為官長，故大制不割。"],["無爲","將欲取天下而為之，吾見其不得已。天下神器，不可為也。為者敗之，執者失之。故物或行或隨，或噓或吹，或強或羸，或挫或隳。是以聖人去甚，去奢，去泰。"],["儉武","以道佐人主者，不以兵強天下。其事好還。師之所處，荊棘生焉。大軍之後，必有凶年。善有果而已，不敢以取強。果而勿矜，果而勿伐，果而勿驕。果而不得已，果而勿強。物壯則老，是謂不道，不道早已。"],["偃武","夫佳兵者不祥之器，物或惡之，故有道者不處。君子居則貴左，用兵則貴右。兵者不祥之器，非君子之器，不得已而用之，恬淡為上。勝而不美，而美之者，是樂殺人。夫樂殺人者，則不可以得志於天下矣。吉事尚左，凶事尚右。偏將軍居左，上將軍居右。言以喪禮處之。殺人之眾，以悲哀泣之，戰勝以喪禮處之。"],["聖德","道常無名，樸，雖小，天下莫能臣也。侯王若能守之，萬物將自賓。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦將知止，知止所以不殆。譬道之在天下，猶川谷之與江海。"],["辯德","知人者智，自知者明。勝人者有力，自勝者強。知足者富。強行者有志。不失其所者久。死而不亡者壽。"],["任成","大道氾兮，其可左右。萬物恃之而生而不辭，功成不名有，衣養萬物而不為主。常無欲，可名於小；萬物歸焉而不為主，可名為大。以其終不自為大，故能成其大。"],["仁德","執大象，天下往。往而不害，安平太。樂與餌，過客止。道之出口，淡乎其無味，視之不足見，聽之不足聞，用之不足既。"],["微明","將欲歙之，必固張之。將欲弱之，必固強之。將欲廢之，必固興之。將欲奪之，必固與之。是謂微明。柔弱勝剛強。魚不可脫於淵，國之利器不可以示人。"],["爲政","道常無為而無不為，侯王若能守之，萬物將自化。化而欲作，吾將鎮之以無名之樸。無名之樸，夫亦將無欲。不欲以靜，天下將自定。"],["論德","上德不德，是以有德；下德不失德，是以無德。上德無為而無以為；下德為之而有以為。上仁為之而無以為；上義為之而有以為。上禮為之而莫之應，則攘臂而扔之。故失道而後德，失德而後仁，失仁而後義，失義而後禮，夫禮者忠信之薄，而亂之首。前識者，道之華，而愚之始。是以大丈夫處其厚，不居其薄，處其實，不居其華。故去彼取此。"],["法本","昔之得一者，天得一以清，地得一以寧，神得一以靈，谷得一以盈，萬物得一以生，侯王得一以為天下貞。其致之。天無以清將恐裂，地無以寧將恐發，神無以靈將恐歇，谷無以盈將恐竭，萬物無以生將恐滅，侯王無以貴高將恐蹶。故貴以賤為本，高以下為基。是以侯王自謂孤、寡、不穀，此非以賤為本邪？非乎？故致數譽無譽。不欲琭琭如玉，珞珞如石。"],["去用","反者道之動；弱者道之用。天下萬物生於有，有生於無。"],["同異","上士聞道，勤而行之；中士聞道，若存若亡；下士聞道，大笑之。不笑不足以為道。故建言有之：明道若昧，進道若退，夷道若纇，上德若谷，大白若辱，廣德若不足，建德若偷，質真若渝，大方無隅，大器晚成，大音希聲，大象無形，道隱無名。夫唯道，善貸且成。"],["道化","道生一，一生二，二生三，三生萬物。萬物負陰而抱陽，沖氣以為和。人之所惡，唯孤、寡、不穀，而王公以為稱。故物或損之而益，或益之而損。人之所教，我亦教之，強梁者不得其死，吾將以為教父。"],["徧用","天下之至柔，馳騁天下之至堅，無有入無間。吾是以知無為之有益。不言之教，無為之益，天下希及之。"],["立戒","名與身孰親？身與貨孰多？得與亡孰病？是故甚愛必大費，多藏必厚亡。知足不辱，知止不殆，可以長久。"],["洪德","大成若缺，其用不弊；大盈若沖，其用不窮。大直若屈，大巧若拙，大辯若訥。躁勝寒，靜勝熱，清靜為天下正。"],["儉欲","天下有道，卻走馬以糞；天下無道，戎馬生於郊。禍莫大於不知足；咎莫大於欲得。故知足之足，常足矣。"],["鑒遠","不出戶，知天下；不窺牖，見天道。其出彌遠，其知彌少。是以聖人不行而知，不見而名，不為而成。"],["忘知","為學日益，為道日損。損之又損，以至於無為。無為而無不為。取天下常以無事，及其有事，不足以取天下。"],["任德","聖人無常心，以百姓心為心。善者吾善之，不善者吾亦善之，德善。信者吾信之，不信者吾亦信之，德信。聖人在天下歙歙，為天下渾其心。百姓皆注其耳目，聖人皆孩之。"],["貴生","出生入死。生之徒十有三，死之徒十有三，人之生，動之死地，十有三。夫何故？以其生生之厚。蓋聞善攝生者，陸行不遇兕虎，入軍不被甲兵。兕無所投其角，虎無所措其爪，兵無所容其刃，夫何故？以其無死地。"],["養德","道生之，德畜之，物形之，勢成之。是以萬物莫不尊道而貴德。道之尊，德之貴，夫莫之命常自然。故道生之，德畜之，長之育之，亭之毒之，養之覆之。生而不有，為而不恃，長而不宰。是謂玄德。"],["歸元","天下有始，以為天下母。既知其母，復知其子；既知其子，復守其母，沒身不殆。塞其兌，閉其門，終身不勤；開其兌，濟其事，終身不救。見小曰明，守柔曰強。用其光，復歸其明，無遺身殃。是謂習常。"],["益證","使我介然有知，行於大道，惟施是畏。大道甚夷，而民好徑。朝甚除，田甚蕪，倉甚虛；服文綵，帶利劍，厭飲食，財貨有餘，是謂盜夸。非道也哉！"],["修觀","善建者不拔，善抱者不脫，子孫以祭祀不輟。修之於身，其德乃真；修之於家，其德乃餘；修之於鄉，其德乃長；修之於國，其德乃豐；修之於天下，其德乃普。故以身觀身，以家觀家，以鄉觀鄉，以國觀國，以天下觀天下。吾何以知天下然哉？以此。"],["玄符","含德之厚，比於赤子。蜂蠆虺蛇不螫，猛獸不據，攫鳥不搏。骨弱筋柔而握固，未知牝牡之合而全作，精之至也。終日號而不嗄，和之至也。知和曰常，知常曰明。益生曰祥。心使氣曰強。物壯則老，謂之不道，不道早已。"],["玄德","知者不言，言者不知。塞其兌，閉其門，挫其銳，解其分，和其光，同其塵。是謂玄同。故不可得而親，不可得而疏；不可得而利，不可得而害；不可得而貴，不可得而賤。故為天下貴。"],["淳風","以正治國，以奇用兵，以無事取天下。吾何以知其然哉？以此。天下多忌諱，而民彌貧；民多利器，國家滋昏；人多伎巧，奇物滋起；法令滋彰，盜賊多有。故聖人云：我無為而民自化，我好靜而民自正，我無事而民自富，我無欲而民自樸。"],["順化","其政悶悶，其民淳淳；其政察察，其民缺缺。禍兮福之所倚，福兮禍之所伏。孰知其極？其無正。正復為奇，善復為妖。人之迷，其日固久。是以聖人方而不割，廉而不劌，直而不肆，光而不耀。"],["守道","治人，事天，莫若嗇。夫唯嗇，是謂早服；早服謂之重積德；重積德則無不克；無不克則莫知其極；莫知其極，可以有國；有國之母，可以長久。是謂深根固柢，長生久視之道。"],["居位","治大國，若烹小鮮。以道蒞天下，其鬼不神；非其鬼不神，其神不傷人，非其神不傷人，聖人亦不傷人。夫兩不相傷，故德交歸焉。"],["謙德","大國者下流，天下之交。天下之牝，牝常以靜勝牡，以靜為下。故大國以下小國，則取小國；小國以下大國，則取大國。故或下以取，或下而取。大國不過欲兼畜人，小國不過欲入事人。夫兩者各得其所欲，大者宜為下。"],["爲道","道者萬物之奧。善人之寶，不善人之所保。美言可以市，尊行可以加人。人之不善，何棄之有？故立天子，置三公，雖有拱璧以先駟馬，不如坐進此道。古之所以貴此道者何？不曰以求得，有罪以免邪？故為天下貴。"],["恩始","為無為，事無事，味無味。大小多少，報怨以德。圖難於其易，為大於其細。天下難事，必作於易；天下大事，必作於細。是以聖人終不為大，故能成其大。夫輕諾必寡信，多易必多難。是以聖人猶難之，故終無難矣。"],["守微","其安易持，其未兆易謀，其脆易泮，其微易散。為之於未有，治之於未亂。合抱之木，生於毫末；九層之臺，起於累土；千里之行，始於足下。為者敗之，執者失之。是以聖人無為故無敗，無執故無失。民之從事，常於幾成而敗之。慎終如始，則無敗事。是以聖人欲不欲，不貴難得之貨；學不學，復眾人之所過。以輔萬物之自然，而不敢為。"],["淳德","古之善為道者，非以明民，將以愚之。民之難治，以其智多。故以智治國，國之賊；不以智治國，國之福。知此兩者亦稽式。常知稽式，是謂玄德。玄德深矣遠矣；與物反矣！然後乃至大順。"],["後已","江海所以能為百谷王者，以其善下之，故能為百谷王。是以聖人欲上民，必以言下之；欲先民，必以身後之。是以聖人處上而民不重；處前而民不害。是以天下樂推而不厭。以其不爭，故天下莫能與之爭。"],["三寳","天下皆謂我道大，似不肖。夫唯大，故似不肖。若肖，久矣其細也夫。我有三寶，持而保之。一曰慈，二曰儉，三曰不敢為天下先。慈故能勇，儉故能廣，不敢為天下先，故能成器長。今舍慈且勇，舍儉且廣，舍後且先，死矣！夫慈，以戰則勝，以守則固。天將救之，以慈衛之。"],["配天","善為士者不武，善戰者不怒，善勝敵者不與，善用人者為之下。是謂不爭之德，是謂用人之力，是謂配天古之極。"],["玄用","用兵有言：「吾不敢為主而為客，不敢進寸而退尺。」是謂行無行，攘無臂，扔無敵，執無兵。禍莫大於輕敵，輕敵幾喪吾寶。故抗兵相加，哀者勝矣。"],["知難","吾言甚易知，甚易行。天下莫能知，莫能行。言有宗，事有君。夫唯無知，是以不我知。知我者希，則我者貴。是以聖人被褐懷玉。"],["知病","知不知，上；不知知，病。夫唯病病，是以不病。聖人不病，以其病病，是以不病。"],["愛已","民不畏威，則大威至。無狎其所居，無厭其所生。夫唯不厭，是以不厭。是以聖人自知不自見，自愛不自貴。故去彼取此。"],["任爲","勇於敢則殺，勇於不敢則活。此兩者，或利或害，天之所惡，孰知其故？是以聖人猶難之。天之道，不爭而善勝，不言而善應，不召而自來，繟然而善謀。天網恢恢，疏而不失。"],["制惑","民不畏死，奈何以死懼之？若使民常畏死，而為奇者，吾得執而殺之，孰敢？常有司殺者殺。夫代司殺者殺，是謂代大匠斲。夫代大匠斲者，希有不傷其手矣。"],["貪損","民之饑，以其上食稅之多，是以饑。民之難治，以其上之有為，是以難治。民之輕死，以其求生之厚，是以輕死。夫唯無以生為者，是賢於貴生。"],["戒彊","人之生也柔弱，其死也堅強。萬物草木之生也柔脆，其死也枯槁。故堅強者死之徒，柔弱者生之徒。是以兵強則不勝，木強則共。強大處下，柔弱處上。"],["天道","天之道，其猶張弓與！高者抑之，下者舉之；有餘者損之，不足者補之。天之道，損有餘而補不足；人之道，則不然，損不足以奉有餘。孰能有餘以奉天下？唯有道者。是以聖人為而不恃，功成而不處，其不欲見賢。"],["任信","天下莫柔弱於水，而攻堅強者莫之能勝，其無以易之。弱之勝強，柔之勝剛，天下莫不知，莫能行。是以聖人云：「受國之垢，是謂社稷主；受國不祥，是謂天下王。」正言若反。"],["任契","和大怨，必有餘怨，安可以為善？是以聖人執左契，而不責於人。有德司契，無德司徹。天道無親，常與善人。"],["獨立","小國寡民，使有什伯之器而不用，使民重死而不遠徙。雖有舟輿，無所乘之；雖有甲兵，無所陳之。使人復結繩而用之。甘其食，美其服，安其居，樂其俗。鄰國相望，雞犬之聲相聞，民至老死不相往來。"],["顯質","信言不美，美言不信。善者不辯，辯者不善。知者不博，博者不知。聖人不積，既以為人己愈有，既以與人己愈多。天之道，利而不害；聖人之道，為而不爭。"]],"en":["The Way that can be spoken of\nis not the constant Way.\nThe name that can be named\nis not the constant name.\n\nNameless: the beginning of heaven and earth.\nNamed: the mother of the ten thousand things.\n\nSo, always without desire, you see the mystery;\nalways with desire, you see its edges.\n\nThese two come out of the same place\nand go by different names.\nTogether they are called the dark.\nDark within dark:\nthe gate of every mystery.","When everyone knows beauty as beauty,\nthere is already ugliness.\nWhen everyone knows good as good,\nthere is already the not-good.\n\nSo being and nothing give birth to each other,\nhard and easy complete each other,\nlong and short measure each other,\nhigh and low lean on each other,\nvoice and sound answer each other,\nbefore and after follow each other.\n\nSo the sage gets on with not-doing\nand teaches without words.\nThe ten thousand things rise, and the sage turns none of them away,\ngives life without owning,\nacts without leaning on it,\nfinishes the work and doesn't settle into it.\nAnd because the sage doesn't settle into it,\nit never leaves.","Don't put the talented on a pedestal,\nand people won't compete.\nDon't prize what is hard to get,\nand people won't steal.\nDon't show off what stirs desire,\nand hearts won't be troubled.\n\nSo the sage governs\nby emptying hearts and filling bellies,\nsoftening ambition and strengthening bones,\nkeeping people free of cunning and craving,\nso the clever don't dare to act.\n\nDo not-doing,\nand nothing is out of order.","The Way is empty,\nand using it never fills it up.\nDeep, it seems to be the ancestor of the ten thousand things.\n\nIt blunts the sharp,\nuntangles the knotted,\nsoftens the glare,\nbecomes one with the dust.\nClear and still, it seems almost to be there.\n\nI don't know whose child it is.\nIt seems older than God.","Heaven and earth are not kind.\nThey treat the ten thousand things like straw dogs.\nThe sage is not kind,\nand treats the people like straw dogs.\n\nThe space between heaven and earth:\nisn't it like a bellows?\nEmpty, and never used up.\nThe more it moves, the more comes out.\n\nToo many words soon run dry.\nBetter to keep to the centre.","The valley spirit never dies.\nIt is called the dark female.\nThe gate of the dark female\nis called the root of heaven and earth.\nBarely there, it goes on and on.\nUse it; it never wears out.","Heaven lasts. Earth endures.\nThey can last and endure\nbecause they don't live for themselves.\nThat is why they live so long.\n\nSo the sage stays back and ends up in front,\nstays outside and stays alive.\nIsn't it because there's no self in it\nthat the self comes to fulfilment?","The highest good is like water.\nWater is good at helping the ten thousand things\nand doesn't compete.\nIt settles in the low places everyone avoids,\nso it is close to the Way.\n\nLive close to the ground.\nKeep the heart deep.\nGive with kindness.\nSpeak true.\nGovern in order.\nWork with skill.\nMove in time.\n\nBecause it doesn't compete,\nnothing can fault it.","Better to stop\nthan to fill it to the brim.\nHammer a blade to its sharpest\nand it won't stay sharp for long.\nA hall full of gold and jade\ncan't be guarded.\nRich, high, and proud:\nyou bring the trouble on yourself.\n\nDo the work, then step back.\nThat is the Way of heaven.","Carrying body and soul, holding to the one,\ncan you keep them from coming apart?\nGathering your breath until it is soft,\ncan you be like a newborn?\nWiping clean the dark mirror,\ncan you leave it without a spot?\nLoving the people, governing the land,\ncan you do it without cleverness?\nWhen the gates of heaven open and close,\ncan you be the female?\nSeeing clearly in every direction,\ncan you do it by not-doing?\n\nGiving birth and raising,\ngiving life without owning,\nacting without leaning on it,\nleading without ruling:\nthis is called dark virtue.","Thirty spokes share one hub.\nThe empty centre\nis what makes it a wheel.\n\nShape clay into a pot.\nThe hollow inside\nis what makes it a pot.\n\nCut doors and windows for a room.\nThe empty space\nis what makes it a room.\n\nSo what is there gives the benefit;\nwhat isn't there gives the use.","The five colours blind the eye.\nThe five notes deafen the ear.\nThe five flavours numb the tongue.\nRacing and hunting drive the heart wild.\nThings hard to get lead people astray.\n\nSo the sage tends the belly, not the eye,\nlets go of that\nand takes this.","Favour and disgrace both startle you.\nYou treasure great trouble as you treasure your body.\n\nWhat does it mean that favour and disgrace both startle you?\nFavour puts you beneath someone.\nGetting it startles you, losing it startles you.\nThat is what it means.\n\nWhat does it mean to treasure great trouble as you treasure your body?\nThe reason I have great trouble\nis that I have a body.\nIf I had no body,\nwhat trouble could I have?\n\nSo whoever values the world as their own body\ncan be trusted with the world.\nWhoever loves the world as their own body\ncan be given the world to care for.","Look, and it can't be seen: call it invisible.\nListen, and it can't be heard: call it faint.\nReach, and it can't be held: call it subtle.\nThese three can't be pinned down,\nso they blend into one.\n\nAbove, it isn't bright.\nBelow, it isn't dark.\nEndless, unnameable,\nit goes back into nothing.\nThis is the shape without a shape,\nthe image of no thing.\nCall it elusive, blurred.\n\nMeet it and you won't see its face.\nFollow it and you won't see its back.\n\nHold to the ancient Way\nto steer what is here now.\nTo know the ancient beginning:\nthis is the thread of the Way.","The best officials of old\nwere subtle, mysterious, dark, and open,\ntoo deep to be known.\nBecause they can't be known,\nI can only try to describe them.\n\nCareful, like crossing a river in winter.\nWary, like someone with watchful neighbours on every side.\nGrave, with a composed face.\nLoosening, like ice about to melt.\nPlain, like uncarved wood.\nOpen, like a valley.\nMurky, like muddy water.\n\nWho can be muddy, and by staying still\nslowly become clear?\nWho can stay at rest a long time, and by moving\nslowly come to life?\n\nWhoever keeps this Way doesn't want to be full.\nBecause they're never full,\nthey can wear out, and need no renewing.","Go all the way into emptiness.\nHold fast to stillness.\nThe ten thousand things rise together,\nand I watch them return.\n\nThings flourish, crowd on crowd,\nand each goes back to its root.\nGoing back to the root is called stillness.\nStillness is called returning to your nature.\nReturning to your nature is called the constant.\nKnowing the constant is called clarity.\nNot knowing the constant,\npeople act blindly and come to harm.\n\nKnowing the constant, you can hold everything.\nHolding everything, you are fair.\nBeing fair, you are kingly.\nBeing kingly, you are like heaven.\nBeing like heaven, you are the Way.\nBeing the Way, you last.\nUntil your body ends,\nnothing can harm you.","The best rulers: people know only that they exist.\nNext: people love and praise them.\nNext: people fear them.\nNext: people despise them.\n\nTrust too little,\nand you won't be trusted.\n\nEasy, unhurried, sparing with words.\nWhen the work is done and things go well,\nthe people all say,\n\"We did it ourselves.\"","When the great Way is forgotten,\nthere is kindness and justice.\nWhen cleverness appears,\nthere is great pretending.\nWhen families fall apart,\nthere are dutiful children and loving parents.\nWhen the country is in chaos,\nthere are loyal ministers.","Give up holiness, throw away cleverness,\nand people will be a hundred times better off.\nGive up kindness, throw away justice,\nand people will love their parents and children again.\nGive up skill, throw away profit,\nand there will be no thieves.\n\nThese three are surface, not enough.\nSo give people something to hold on to:\nBe plain as raw silk.\nHold to the uncarved wood.\nLess self.\nFewer wants.","Give up learning, and your worries end.\nBetween \"yes\" and \"yeah,\"\nhow much difference is there?\nBetween good and evil,\nhow far apart are they?\nWhat people fear,\nI have to fear too.\nHow wide it is, and no end to it!\n\nEveryone is merry,\nas if at a great feast,\nas if climbing a terrace in spring.\nI alone am still, giving no sign,\nlike a baby that hasn't yet learned to smile.\nDrifting, as if I had no home to go back to.\n\nEveryone has more than enough.\nI alone seem to have lost something.\nMine is the heart of a fool,\nso muddled!\nOrdinary people are bright;\nI alone seem dim.\nOrdinary people are sharp;\nI alone am dull.\nCalm, like the sea.\nBlowing, like a wind that never stops.\n\nEveryone has a purpose.\nI alone am stubborn, and seem crude.\nI alone am different from the others:\nI treasure being fed by the mother.","Great virtue\nfollows only the Way.\nThe Way, as a thing,\nis elusive, blurred.\nBlurred, elusive,\nthere is an image in it.\nElusive, blurred,\nthere is a thing in it.\nDeep and dark,\nthere is a seed in it.\nThe seed is very real;\nthere is trust in it.\n\nFrom ancient times until now\nits name has never left,\nand through it we see the beginning of everything.\nHow do I know what the beginning of everything is like?\nBy this.","Bend, and you stay whole.\nBe crooked, and you become straight.\nBe hollow, and you fill.\nWear out, and you are renewed.\nHave little, and you gain.\nHave much, and you get lost.\n\nSo the sage holds to the one\nand becomes a pattern for the world.\nNot showing off, the sage is seen.\nNot insisting on being right, the sage is recognized.\nNot boasting, the sage gets the credit.\nNot bragging, the sage lasts.\nBecause the sage doesn't compete,\nno one in the world can compete with the sage.\n\nThe old saying \"Bend, and you stay whole\":\nare those empty words?\nBe truly whole,\nand everything comes back to you.","To say little is what is so by itself.\nA whirlwind doesn't last the morning.\nA downpour doesn't last the day.\nWho makes them? Heaven and earth.\nIf even heaven and earth can't keep it up,\nhow much less can people?\n\nSo whoever works at the Way:\non the Way, becomes one with the Way;\nin virtue, becomes one with virtue;\nin loss, becomes one with loss.\nBecome one with the Way,\nand the Way is glad to have you.\nBecome one with virtue,\nand virtue is glad to have you.\nBecome one with loss,\nand loss is glad to have you.\n\nTrust too little,\nand you won't be trusted.","On tiptoe, you can't stand.\nStriding too wide, you can't walk.\nShow off, and you aren't seen.\nInsist you're right, and you aren't recognized.\nBoast, and you get no credit.\nBrag, and you won't last.\n\nTo the Way, these are\nleftover food, a growth on the body.\nThings seem to hate them,\nso whoever has the Way doesn't stay there.","Something formless and complete\nwas born before heaven and earth.\nSilent, empty,\nstanding alone and unchanging,\ngoing round and never tiring,\nit could be the mother of the world.\nI don't know its name.\nI call it the Way.\nIf I have to name it, I say: great.\nGreat means flowing on.\nFlowing on means far away.\nFar away means coming back.\n\nSo the Way is great,\nheaven is great,\nearth is great,\nand the king is great too.\nIn the world there are four great things,\nand the king is one of them.\n\nPeople follow earth.\nEarth follows heaven.\nHeaven follows the Way.\nThe Way follows what is so by itself.","Heavy is the root of light.\nStill is the master of restless.\nSo the sage travels all day\nwithout leaving the baggage cart.\nEven with splendid views around,\nthey stay at ease, above it all.\nHow can the lord of ten thousand chariots\nbehave lightly before the world?\nBe light, and you lose the base.\nBe restless, and you lose the master.","A good traveller leaves no tracks.\nA good speaker makes no slips.\nA good counter needs no counting sticks.\nA good door needs no bolt,\nand still it can't be opened.\nA good knot needs no rope,\nand still it can't be undone.\n\nSo the sage is always good at helping people,\nand no one is thrown away;\nalways good at saving things,\nand nothing is thrown away.\nThis is called following the light.\n\nSo the good person is the teacher of the one who isn't good,\nand the one who isn't good is the good person's material.\nNot valuing the teacher,\nnot caring for the material,\neven the clever get badly lost.\nThis is the essential mystery.","Know the male,\nkeep to the female,\nand be the ravine of the world.\nBe the ravine of the world,\nand constant virtue never leaves you.\nYou go back to being a newborn.\n\nKnow the white,\nkeep to the black,\nand be the pattern of the world.\nBe the pattern of the world,\nand constant virtue never strays.\nYou go back to the boundless.\n\nKnow honour,\nkeep to the low place,\nand be the valley of the world.\nBe the valley of the world,\nand constant virtue is enough.\nYou go back to uncarved wood.\n\nWhen the wood is cut, it becomes tools.\nIn the sage's hands, it becomes leaders.\nSo the best carving doesn't cut.","Whoever wants to take the world and work on it,\nI see they won't succeed.\nThe world is a sacred vessel.\nIt can't be worked on.\nWork on it and you ruin it.\nHold it and you lose it.\n\nSo things sometimes lead, sometimes follow,\nsometimes breathe softly, sometimes blow hard,\nsometimes grow strong, sometimes grow weak,\nsometimes break, sometimes crumble.\n\nSo the sage lets go of excess,\nof extravagance,\nof too much.","Whoever helps a ruler by the Way\ndoesn't use soldiers to force the world.\nThat kind of thing comes back.\nWhere armies camp, thorns grow.\nAfter a great war, bad years always follow.\n\nThe skilled get the result, and stop.\nThey don't dare use it to grab power.\nGet the result, and don't brag.\nGet the result, and don't boast.\nGet the result, and don't be proud.\nGet the result because there was no choice.\nGet the result, and don't force.\n\nThings that peak grow old.\nThis is called going against the Way,\nand what goes against the Way ends early.","Fine weapons are tools of bad luck.\nThings seem to hate them,\nso whoever has the Way doesn't stay with them.\n\nAt home, the noble person honours the left.\nAt war, the right is honoured.\nWeapons are tools of bad luck,\nnot the tools of a noble person.\nWhen there's no choice but to use them,\ncalm and restraint are best.\n\nVictory isn't beautiful.\nWhoever finds it beautiful\nenjoys killing people.\nAnd whoever enjoys killing people\nwill never have their way with the world.\n\nIn happy times, the left is honoured.\nIn sad times, the right.\nThe lieutenant stands on the left,\nthe general on the right:\nwhich means war is treated like a funeral.\nWhen many people have been killed,\nweep for them in grief.\nTreat a victory like a funeral.","The Way is always nameless.\nUncarved wood, small as it is,\ncan't be made a servant by anyone in the world.\nIf lords and kings could keep to it,\nthe ten thousand things would come to them on their own.\nHeaven and earth would join\nand let fall a sweet dew.\nWith no one ordering them,\npeople would share it evenly.\n\nWhen cutting begins, there are names.\nOnce there are names,\nknow when to stop.\nKnowing when to stop, you are in no danger.\n\nThe Way in the world\nis like streams and valleys running to the rivers and the sea.","Knowing others is cleverness.\nKnowing yourself is clarity.\nMastering others takes force.\nMastering yourself is strength.\nKnowing you have enough is wealth.\nPushing on is will.\nNot losing your place is lasting.\nTo die and not be gone is long life.","The great Way flows everywhere,\nto the left and to the right.\nThe ten thousand things depend on it for life,\nand it turns none of them away.\nIt finishes the work and doesn't call it its own.\nIt clothes and feeds the ten thousand things\nand doesn't act as their master.\n\nAlways without desire,\nit could be called small.\nThe ten thousand things come home to it,\nand it doesn't act as their master:\nit could be called great.\nBecause it never thinks itself great,\nit becomes great.","Hold the great image,\nand the world comes to you.\nIt comes and is not harmed,\nand there is peace, calm, and ease.\n\nMusic and good food\nmake the passer-by stop.\nBut the Way, when it is spoken,\nis bland, with no flavour.\nLook at it: not enough to see.\nListen to it: not enough to hear.\nUse it: it can't be used up.","What is about to shrink\nmust first be stretched.\nWhat is about to weaken\nmust first be made strong.\nWhat is about to fall\nmust first be raised up.\nWhat is about to be taken\nmust first be given.\nThis is called subtle clarity.\n\nThe soft and weak overcome the hard and strong.\nFish shouldn't leave the deep water.\nA country's sharpest tools\nshouldn't be shown to anyone.","The Way never does anything,\nand nothing is left undone.\nIf lords and kings could keep to it,\nthe ten thousand things would change by themselves.\nIf, changing, they start to want,\nI'll settle them with nameless uncarved wood.\nNameless uncarved wood:\nthen there is no wanting.\nWithout wanting, there is stillness,\nand the world settles by itself.","The highest virtue isn't virtuous,\nso it has virtue.\nLower virtue never lets go of being virtuous,\nso it has no virtue.\n\nThe highest virtue does nothing\nand has nothing to do it for.\nLower virtue acts\nand has something to act for.\nThe highest kindness acts\nand has nothing to act for.\nThe highest justice acts\nand has something to act for.\nThe highest etiquette acts,\nand when no one responds,\nit rolls up its sleeves and drags them into line.\n\nSo when the Way is lost, there is virtue.\nWhen virtue is lost, there is kindness.\nWhen kindness is lost, there is justice.\nWhen justice is lost, there is etiquette.\nEtiquette is the thin shell of loyalty and trust,\nand the beginning of disorder.\nKnowing ahead of time\nis the flower of the Way\nand the beginning of foolishness.\n\nSo the truly grown-up\nstay with the thick, not the thin,\nwith the fruit, not the flower.\nThey let go of that\nand take this.","These, long ago, found the one:\nHeaven found the one and became clear.\nEarth found the one and became calm.\nSpirits found the one and came alive.\nThe valley found the one and became full.\nThe ten thousand things found the one and were born.\nLords and kings found the one and set the world right.\nAll of this came from the one.\n\nWithout what makes it clear, heaven would crack.\nWithout what makes it calm, earth would quake.\nWithout what makes them alive, spirits would fade.\nWithout what makes it full, the valley would run dry.\nWithout what makes them live, the ten thousand things would die out.\nWithout what makes them high, lords and kings would fall.\n\nSo the noble is rooted in the humble,\nand the high is built on the low.\nThat is why lords and kings call themselves\norphaned, lonely, unworthy.\nIsn't that taking the humble as the root?\nIsn't it?\nSo reaching for much praise brings no praise.\nDon't glitter like jade.\nBe rough like stone.","Returning is how the Way moves.\nYielding is how the Way works.\nThe ten thousand things are born from being.\nBeing is born from nothing.","When the wisest hear of the Way,\nthey work hard to live it.\nWhen the middling hear of the Way,\nthey half keep it, half lose it.\nWhen the foolish hear of the Way,\nthey laugh out loud.\nIf they didn't laugh,\nit wouldn't be the Way.\n\nSo the old sayings go:\nThe bright Way seems dark.\nThe Way forward seems to go back.\nThe smooth Way seems rough.\nThe highest virtue seems like a valley.\nThe purest white seems stained.\nVast virtue seems not enough.\nStrong virtue seems idle.\nTrue substance seems to change.\nThe great square has no corners.\nThe great vessel is finished late.\nThe great sound is barely a sound.\nThe great image has no shape.\nThe Way is hidden and has no name.\nAnd yet only the Way\ngives well, and brings things to completion.","The Way gives birth to one.\nOne gives birth to two.\nTwo gives birth to three.\nThree gives birth to the ten thousand things.\n\nThe ten thousand things carry yin on their backs\nand hold yang in their arms,\nand the mingling of their breath makes harmony.\n\nWhat people hate most\nis to be orphaned, lonely, unworthy,\nand yet lords and kings use these words for themselves.\nSo things may gain by losing,\nor lose by gaining.\n\nWhat others teach, I teach too:\n\"The violent don't die a natural death.\"\nI'll make that the first thing I teach.","The softest thing in the world\nruns right through the hardest.\nWhat has no substance\nenters where there is no gap.\nThat is how I know the good of not-doing.\n\nTeaching without words,\nthe good of not-doing:\nfew in the world ever reach it.","Your name or your body: which is closer?\nYour body or your things: which is worth more?\nGaining or losing: which does more harm?\n\nSo the more you cling, the more it costs.\nThe more you hoard, the more you lose.\nKnow what is enough, and you won't be disgraced.\nKnow when to stop, and you won't be in danger.\nYou can last a long time.","The greatest perfection seems flawed,\nyet using it never wears it out.\nThe greatest fullness seems empty,\nyet using it never uses it up.\nThe straightest line seems bent.\nThe greatest skill seems clumsy.\nThe greatest eloquence seems tongue-tied.\n\nMovement overcomes cold.\nStillness overcomes heat.\nClear and still,\nyou set the world right.","When the world has the Way,\nracehorses are sent back to pull dung carts in the fields.\nWhen the world has lost the Way,\nwarhorses are bred at the city walls.\n\nNo disaster is greater than not knowing when you have enough.\nNo fault is greater than wanting more.\nSo the enough that knows it is enough\nis always enough.","Without going out the door,\nyou can know the world.\nWithout looking out the window,\nyou can see the Way of heaven.\nThe farther you go,\nthe less you know.\n\nSo the sage knows without going,\nnames without seeing,\ngets it done without doing.","Learning, you gain something every day.\nFollowing the Way, you lose something every day.\nLose, and lose again,\nuntil you arrive at not-doing.\nNot-doing, and nothing is left undone.\n\nThe world is won by leaving it alone.\nMeddle with it,\nand you can never win it.","The sage has no fixed heart.\nThe people's hearts are the sage's heart.\n\nTo the good, I am good.\nTo those who aren't good, I am good too.\nThat is the goodness of virtue.\nTo the trustworthy, I give trust.\nTo those who aren't trustworthy, I give trust too.\nThat is the trust of virtue.\n\nThe sage lives in the world quietly, drawing in,\nand for the world's sake keeps a heart that doesn't take sides.\nThe people all strain their eyes and ears.\nThe sage treats them all like children.","Coming out is life. Going in is death.\nThree in ten follow life.\nThree in ten follow death.\nAnd three in ten, alive,\nmove toward the place of death.\nWhy? Because they cling to living too hard.\n\nI have heard that those who are good at living\nwalk the hills and don't meet rhinos or tigers,\ngo into battle and aren't touched by weapons.\nThe rhino finds nowhere to put its horn,\nthe tiger nowhere to set its claws,\nthe soldier nowhere to drive his blade.\nWhy? Because there is no place of death in them.","The Way gives them life.\nVirtue raises them.\nMatter shapes them.\nCircumstance completes them.\nSo the ten thousand things all honour the Way and value virtue.\nThe Way is honoured and virtue valued\nnot because anyone orders it\nbut because it is so by itself.\n\nSo the Way gives them life,\nvirtue raises them,\ngrows them, nurtures them,\nshelters them, ripens them,\nfeeds them, covers them.\nGiving life without owning,\nacting without leaning on it,\nleading without ruling:\nthis is called dark virtue.","The world has a beginning,\nand it is the mother of the world.\nKnow the mother,\nand come to know the children.\nKnow the children,\nand keep to the mother,\nand until your body ends, nothing can harm you.\n\nClose the openings,\nshut the doors,\nand all your life you won't be worn out.\nOpen the openings,\nget busy with things,\nand all your life you can't be saved.\n\nSeeing the small is called clarity.\nKeeping to the soft is called strength.\nUse the light,\ncome back to clarity,\nand nothing bad will follow you.\nThis is called practising the constant.","If I had the least bit of sense,\nI'd walk the great Way\nand fear only straying from it.\nThe great Way is very smooth,\nbut people love the side paths.\n\nThe court is spotless,\nthe fields are full of weeds,\nthe granaries are empty.\nThey wear embroidered clothes,\ncarry sharp swords,\nstuff themselves with food and drink,\nand have more money than they can use.\nThis is called the bragging of thieves.\nIt is not the Way!","What is well planted can't be pulled up.\nWhat is well held can't slip away.\nChildren and grandchildren will honour it without end.\n\nCultivate it in yourself,\nand your virtue is real.\nCultivate it in your family,\nand your virtue overflows.\nCultivate it in your village,\nand your virtue lasts.\nCultivate it in your country,\nand your virtue is abundant.\nCultivate it in the world,\nand your virtue is everywhere.\n\nSo look at a self through a self,\na family through a family,\na village through a village,\na country through a country,\nthe world through the world.\nHow do I know the world is like this?\nBy this.","Whoever is full of virtue\nis like a newborn.\nWasps, scorpions, vipers and snakes don't sting it,\nwild beasts don't seize it,\nbirds of prey don't strike it.\nIts bones are soft, its muscles weak,\nyet its grip is firm.\nIt knows nothing of male and female joining,\nyet it grows whole:\nits life force is complete.\nIt cries all day and never gets hoarse:\nits harmony is complete.\n\nKnowing harmony is called the constant.\nKnowing the constant is called clarity.\nForcing life is called ill-omened.\nThe mind driving the breath is called forcing.\nThings that peak grow old.\nThis is called going against the Way,\nand what goes against the Way ends early.","Those who know don't talk.\nThose who talk don't know.\n\nClose the openings,\nshut the doors,\nblunt the sharp,\ndissolve the divisions,\nsoften the glare,\nbecome one with the dust.\nThis is called the dark oneness.\n\nThen no one can get close to you,\nand no one can push you away.\nNo one can help you,\nand no one can harm you.\nNo one can raise you up,\nand no one can bring you down.\nSo you are the treasure of the world.","Govern a country by the straight,\nfight a war by surprise,\nwin the world by leaving it alone.\nHow do I know it is so?\nBy this:\n\nThe more rules and taboos in the world,\nthe poorer the people.\nThe more sharp tools the people have,\nthe more confused the country.\nThe more clever skills people have,\nthe more strange things appear.\nThe more laws are posted,\nthe more thieves there are.\n\nSo the sage says:\nI do nothing, and the people change by themselves.\nI love stillness, and the people straighten themselves out.\nI leave things alone, and the people grow rich by themselves.\nI want nothing, and the people become plain as uncarved wood.","When government is dull and quiet,\nthe people are simple and honest.\nWhen government is sharp and prying,\nthe people are restless and broken.\n\nDisaster is what good fortune leans on.\nGood fortune is where disaster hides.\nWho knows where it ends?\nThere is no fixed right.\nThe right turns strange again.\nThe good turns ominous again.\nPeople have been confused about this\nfor a very long time.\n\nSo the sage is square but doesn't cut,\nsharp but doesn't wound,\nhonest but not blunt,\nbright but doesn't dazzle.","In governing people and serving heaven,\nnothing beats restraint.\nRestraint means yielding early.\nYielding early means storing up virtue.\nStore up virtue, and there is nothing you can't overcome.\nWhen there is nothing you can't overcome,\nno one knows your limits.\nWhen no one knows your limits,\nyou can hold a country.\nHold the mother of the country,\nand you can last.\nThis is called deep roots and a firm base,\nthe Way of long life and lasting sight.","Govern a great country\nthe way you cook a small fish.\n\nRule the world by the Way,\nand ghosts lose their power.\nIt isn't that ghosts lose their power:\ntheir power doesn't harm people.\nIt isn't that their power doesn't harm people:\nthe sage doesn't harm people either.\nWhen neither harms the other,\nvirtue flows back to both.","A great country is the low ground where the rivers run,\nwhere the world comes together,\nthe female of the world.\nThe female always overcomes the male by stillness,\nby being still and lying low.\n\nSo a great country that lowers itself to a small one\nwins the small one.\nA small country that lowers itself to a great one\nwins over the great one.\nSo one lowers itself to win,\nthe other is low and wins.\nA great country only wants to gather and care for people.\nA small country only wants to join and serve.\nFor both to get what they want,\nthe great one should lie low.","The Way is the hidden heart of the ten thousand things,\nthe good person's treasure,\nthe not-good person's shelter.\nFine words have their market.\nHonoured deeds can lift a person up.\nAnd the people who aren't good:\nwhy throw them away?\n\nSo when an emperor is crowned\nand the three ministers installed,\nbetter than gifts of jade discs\nfollowed by teams of horses\nis to sit still and offer this Way.\n\nWhy did the ancients treasure this Way?\nDidn't they say: by it the seeker finds,\nand the wrongdoer is forgiven?\nSo it is the treasure of the world.","Do not-doing.\nWork at not-working.\nTaste what has no taste.\nMake the small great and the few many.\nAnswer resentment with virtue.\n\nPlan the hard while it is easy.\nDo the great while it is small.\nThe hard things in the world begin as easy ones.\nThe great things in the world begin as small ones.\nSo the sage never does anything great,\nand so achieves greatness.\n\nEasy promises earn little trust.\nTake everything as easy, and everything gets hard.\nSo the sage treats things as hard,\nand in the end nothing is hard.","What is at rest is easy to hold.\nWhat hasn't shown itself is easy to plan for.\nWhat is brittle is easy to break.\nWhat is tiny is easy to scatter.\nDeal with it before it exists.\nPut it in order before it gets confused.\n\nA tree you can't get your arms around\ngrows from a tiny shoot.\nA tower nine storeys high\nstarts from a heap of earth.\nA journey of a thousand miles\nbegins beneath your feet.\n\nWork on it and you ruin it.\nHold it and you lose it.\nSo the sage does nothing and ruins nothing,\nholds nothing and loses nothing.\nPeople often ruin things\njust when they're almost done.\nBe as careful at the end as at the beginning,\nand nothing is ruined.\n\nSo the sage wants not to want,\ndoesn't prize what is hard to get,\nlearns to unlearn,\ngoes back to what everyone passed by,\nand helps the ten thousand things be what they are by themselves,\nnot daring to act.","The ancient masters of the Way\ndidn't try to make people clever.\nThey kept them simple.\nPeople are hard to govern\nwhen they're too clever.\nSo ruling a country with cleverness\nrobs the country.\nRuling a country without cleverness\nblesses the country.\n\nKnowing these two is a pattern.\nAlways knowing the pattern\nis called dark virtue.\nDark virtue is deep, and far,\nand runs the opposite way to things,\nand then arrives at the great accord.","Rivers and seas are kings of a hundred valleys\nbecause they are good at staying low.\nThat is why they are kings of a hundred valleys.\n\nSo to be above the people,\nthe sage speaks as one below them.\nTo lead the people,\nthe sage walks behind them.\nSo the sage is above, and the people don't feel the weight;\nin front, and the people aren't harmed.\nThe whole world gladly pushes the sage forward\nand never tires of it.\nBecause the sage doesn't compete,\nno one in the world can compete with the sage.","Everyone says my Way is great\nand seems like nothing else.\nIt is because it's great\nthat it seems like nothing else.\nIf it were like anything,\nit would have become small long ago.\n\nI have three treasures.\nI hold them and keep them.\nThe first is compassion.\nThe second is frugality.\nThe third is not daring to be first in the world.\nWith compassion, you can be brave.\nWith frugality, you can be generous.\nNot daring to be first,\nyou can lead.\n\nNow, to be brave without compassion,\ngenerous without frugality,\nfirst without staying back:\nthat is death!\n\nCompassion wins when it fights\nand holds firm when it defends.\nWhen heaven wants to save someone,\nit protects them with compassion.","A good soldier isn't warlike.\nA good fighter isn't angry.\nA good winner doesn't engage.\nA good leader of people goes below them.\nThis is called the virtue of not competing.\nThis is called using the strength of others.\nThis is called being equal to heaven,\nthe highest thing of old.","The strategists have a saying:\n\"I don't dare to be the host; I'd rather be the guest.\nI don't dare advance an inch; I'd rather retreat a foot.\"\nThis is called marching without marching,\nrolling up sleeves without arms,\ncharging where there is no enemy,\nholding weapons without weapons.\n\nNo disaster is greater than underestimating the enemy.\nUnderestimate the enemy, and you nearly lose my treasures.\nSo when armies meet,\nthe side that grieves will win.","My words are very easy to understand\nand very easy to practise.\nNo one in the world can understand them,\nno one can practise them.\n\nWords have an ancestor.\nDeeds have a master.\nIt's because people don't understand this\nthat they don't understand me.\nThose who understand me are few,\nand those who follow me are rare.\nSo the sage wears rough cloth\nand carries jade inside.","To know that you don't know is best.\nNot to know, and think you know, is a sickness.\nOnly by being sick of the sickness\nare you not sick.\nThe sage isn't sick,\nbecause the sage is sick of the sickness,\nand so isn't sick.","When people no longer fear power,\na greater power arrives.\nDon't crowd them where they live.\nDon't weigh down their lives.\nBecause you don't weigh on them,\nthey won't grow weary of you.\n\nSo the sage has self-knowledge without self-display,\nself-love without self-importance,\nlets go of that,\nand takes this.","Brave in daring, you get killed.\nBrave in not daring, you stay alive.\nOf these two, one helps and one harms.\nWhat heaven hates,\nwho knows why?\nEven the sage finds it hard.\n\nThe Way of heaven\ndoesn't compete and is good at winning,\ndoesn't speak and is good at answering,\nisn't called and comes by itself,\nis unhurried and good at planning.\nHeaven's net is vast, so vast.\nIts mesh is wide, and nothing slips through.","If people don't fear death,\nwhy threaten them with death?\nIf people always feared death,\nand I could seize and kill those who do wrong,\nwho would dare?\n\nThere is always an executioner who kills.\nTo kill in the executioner's place\nis like cutting wood in the master carpenter's place.\nWhoever cuts in the master carpenter's place\nrarely escapes without hurting their hands.","The people are hungry\nbecause those above them eat up too much in taxes.\nThat is why they are hungry.\nThe people are hard to govern\nbecause those above them meddle.\nThat is why they are hard to govern.\nThe people take death lightly\nbecause they grab too hard at life.\nThat is why they take death lightly.\nThose who don't make a business of living\nare wiser than those who prize life too much.","People are born soft and weak.\nThey die hard and stiff.\nGrass and trees, the ten thousand things,\nare born tender and supple,\nand die dry and brittle.\nSo the hard and stiff are companions of death.\nThe soft and weak are companions of life.\n\nSo an army that is too strong doesn't win.\nA tree that is too hard takes every blow.\nThe hard and great go below.\nThe soft and weak rise above.","The Way of heaven\nis like drawing a bow.\nThe high end is pulled down,\nthe low end is raised up.\nWhere there's too much, it takes away.\nWhere there's not enough, it gives.\n\nThe Way of heaven\ntakes from what has too much\nand gives to what has too little.\nThe way of people is not like that.\nIt takes from those who have too little\nto give to those who have too much.\nWho can take what they have too much of\nand give it to the world?\nOnly someone with the Way.\n\nSo the sage acts without leaning on it,\nfinishes the work and doesn't stay,\nand has no wish to look wise.","Nothing in the world is softer or weaker than water,\nyet nothing is better at wearing down the hard and strong.\nNothing can take its place.\n\nThe weak overcome the strong.\nThe soft overcome the hard.\nEveryone in the world knows it,\nand no one can live it.\n\nSo the sage says:\n\"Whoever takes on the country's dirt\nis lord of the land.\nWhoever takes on the country's misfortune\nis king of the world.\"\nTrue words sound backwards.","When a great grievance is settled,\nsome grievance is always left.\nHow can that be good?\n\nSo the sage holds the creditor's half of the tally\nand makes no demands on anyone.\nThose with virtue keep the tally.\nThose without virtue collect the debts.\nThe Way of heaven has no favourites.\nIt is always with the good.","A small country with few people.\nLet there be tools that do the work of ten or a hundred,\nand let them go unused.\nLet people take death seriously\nand not wander far away.\nThey have boats and carts,\nand nowhere to ride them.\nThey have armour and weapons,\nand no reason to show them.\nLet people go back to knotting cords to keep count.\n\nLet their food taste sweet,\ntheir clothes look fine,\ntheir homes feel safe,\ntheir customs bring joy.\nThe next country is in sight,\nits roosters and dogs can be heard,\nand people grow old and die\nwithout ever going there.","True words aren't beautiful.\nBeautiful words aren't true.\nThe good don't argue.\nThose who argue aren't good.\nThose who know aren't learned.\nThe learned don't know.\n\nThe sage doesn't hoard.\nThe more the sage does for others, the more the sage has.\nThe more the sage gives to others, the more the sage gains.\nThe Way of heaven helps and doesn't harm.\nThe Way of the sage acts and doesn't compete."]};

const KEY={"道":{"en":"the Way","note":"A road, a path, and also 'to speak': chapter 1 plays on both in its first three characters, 道可道. The book's word for what can't be put into words.","ch":[1,25,42,40]},"德":{"en":"virtue","note":"Less moral virtue than the power a thing has when it follows its own nature. Chapters 38 to 81, the southern half of this sphere, are the 'De' half.","ch":[38,51,55]},"無":{"en":"nothing; without; no","note":"The book's most important small word. Emptiness that is useful: the hub, the pot, the room.","ch":[11,40,1,48]},"為":{"en":"to do; to act (無為: not-doing)","note":"With 無 in front it becomes 無為, not-doing: acting without forcing.","ch":[37,48,3,63]},"聖":{"en":"the sage (聖人)","note":"The one who lives by the Way. In this book, more often a ruler than a hermit.","ch":[2,7,49,81]},"玄":{"en":"dark","note":"Dark, deep, mysterious: the colour of the night sky. 'Dark within dark: the gate of every mystery.'","ch":[1,6,10,56]},"樸":{"en":"uncarved wood","note":"Raw timber before it's cut into tools: simplicity before it is shaped.","ch":[28,32,37,19]},"自":{"en":"self; by itself (自然: what is so by itself)","note":"With 然 it makes 自然, 'so by itself': what happens without being made to happen.","ch":[25,17,64,51]},"然":{"en":"so; thus","note":"Half of 自然, what is so by itself: 'The Way follows what is so by itself.'","ch":[25,17,23,51]},"萬":{"en":"ten thousand (萬物: the ten thousand things)","note":"Ten thousand means all of them: everything that exists.","ch":[42,1,34,16]},"常":{"en":"constant","note":"Not frozen eternity but steadiness, the way seasons are constant.","ch":[1,16,55,37]},"名":{"en":"name","note":"The book opens by doubting names: 'The name that can be named is not the constant name.'","ch":[1,25,32,14]},"有":{"en":"being; to have","note":"Being, the partner of nothing: 'Being is born from nothing.'","ch":[2,11,40,1]},"一":{"en":"one","note":"The first thing the Way gives birth to; the sage 'holds to the one'.","ch":[42,39,10,22]},"谷":{"en":"valley","note":"Low, empty, receiving. 'The valley spirit never dies.'","ch":[6,15,28,41]},"水":{"en":"water","note":"The book's favourite image of the Way: soft, low, and unbeatable.","ch":[8,78]},"牝":{"en":"female","note":"The female animal: receptive, still, enduring. 'The dark female' is the root of heaven and earth.","ch":[6,61]},"柔":{"en":"soft","note":"'The soft and weak overcome the hard and strong.'","ch":[76,78,43,36]},"弱":{"en":"weak; yielding","note":"'Yielding is how the Way works.'","ch":[40,76,36,78]},"靜":{"en":"stillness","note":"'Going back to the root is called stillness.'","ch":[16,15,26,45]},"虛":{"en":"empty","note":"'Go all the way into emptiness.' Empty the way a bellows is empty.","ch":[16,5,3]},"沖":{"en":"empty; flowing","note":"Empty like a cup that never fills: 'The Way is empty, and using it never fills it up.'","ch":[4,42,45]},"反":{"en":"returning; reversal","note":"'Returning is how the Way moves.' Also 'opposite': 'True words sound backwards.'","ch":[40,25,78,65]},"復":{"en":"return; again","note":"'Each goes back to its root.' The word for coming home.","ch":[16,28,52,14]},"根":{"en":"root","note":"'Going back to the root is called stillness.'","ch":[16,6,26,59]},"母":{"en":"mother","note":"'Named: the mother of the ten thousand things.'","ch":[1,20,52,25]},"氣":{"en":"breath; qi","note":"'The mingling of their breath makes harmony.'","ch":[42,10,55]},"心":{"en":"heart; mind","note":"One word for both: the heart that thinks.","ch":[3,49,55,20]},"知":{"en":"to know","note":"'Those who know don't talk.' 'Knowing yourself is clarity.'","ch":[56,33,71]},"言":{"en":"words; to speak","note":"A book of words that distrusts words: 'teaching without words'.","ch":[56,81,2,43]},"善":{"en":"good; good at","note":"'The highest good is like water.'","ch":[8,27,49,62]},"信":{"en":"trust; true","note":"'Trust too little, and you won't be trusted.' 'True words aren't beautiful.'","ch":[17,81,49,23]},"慈":{"en":"compassion","note":"The first of the three treasures.","ch":[67,18,19]},"儉":{"en":"frugality","note":"The second of the three treasures.","ch":[67]},"爭":{"en":"to compete","note":"'Because it doesn't compete, nothing can fault it.'","ch":[8,81,66]},"足":{"en":"enough","note":"'Knowing you have enough is wealth.'","ch":[33,44,46]},"止":{"en":"to stop","note":"'Know when to stop, and you won't be in danger.'","ch":[32,44]},"下":{"en":"below; low","note":"With 天 it makes 天下, 'under heaven': the world. And the low place water seeks.","ch":[66,61,39]},"天":{"en":"heaven","note":"Sky and nature. 天下, 'all under heaven', is the world.","ch":[25,73,77,5]},"大":{"en":"great","note":"'If I have to name it, I say: great.'","ch":[25,41,63,34]},"妙":{"en":"mystery","note":"'The gate of every mystery.'","ch":[1,15,27]},"門":{"en":"gate","note":"'The gate of the dark female is the root of heaven and earth.'","ch":[1,6,10,52]},"明":{"en":"clarity","note":"'Knowing the constant is called clarity.'","ch":[16,33,52,55]},"和":{"en":"harmony","note":"'The mingling of their breath makes harmony.'","ch":[42,55,2,56]},"不":{"en":"not","note":"The second most common character in the book, 243 times: so much of the Way is said by saying what it isn't.","ch":[2,22,81]},"之":{"en":"(a joining word: of; it)","note":"The most common character, 248 times: a small hinge between words.","ch":[1,4,64]},"嬰":{"en":"newborn (嬰兒)","note":"The newborn is the book's picture of full life: soft, whole, unforced.","ch":[10,20,28]},"身":{"en":"body; self","note":"'The reason I have great trouble is that I have a body.'","ch":[13,7,44,9]},"死":{"en":"death; to die","note":"'To die and not be gone is long life.'","ch":[33,50,74,76]},"生":{"en":"life; to give birth","note":"'The Way gives birth to one.'","ch":[42,40,51,50]}};

    if(gChap[gi]!==V.chap){V.chap=gChap[gi];STATS.tocks++;audio.tock();haptic.fire(10);}

// ---------- the frame ----------
const where=$("where");let whereK=-1,whereUntil=0;
function frame(now){
  const realT=now/1000,rdt=Math.min(0.05,Math.max(0,realT-(frame.last||realT)));frame.last=realT;STATS.frames++;
  tick(rdt);render();requestAnimationFrame(frame);
}
function tick(rdt){
  const dt=rdt*TS,pdt=Math.min(0.033,rdt);simT+=dt;
  // intro: the characters rise out of the stone, north to south
  if(R.mode==="intro"||U.intro<1){U.intro=Math.min(1,U.intro+dt/(reduce?0.3:1.6));}
  U.bodyA=Math.min(1,U.bodyA+dt/0.5);
  if(R.mode==="intro"&&U.intro>=1&&simT-R.introAt>2.0){const[k,s]=[R.posK,R.posS];startReading(k,s,s===0);if(!seen)$("hint").classList.add("on");}
  physics(pdt);setRot();updateHead(pdt);

  if(R.mode==="free"&&ptr.id===null&&performance.now()>wheelUntil&&INFO.gi<0&&V.settled&&simT-V.settledAt>R.stillDelay){
    const gi=V.head>=0?V.head:0,k=gChap[gi],s=stOf[gi];startReading(k,s,s===0);
  }
  if(R.mode==="read")stepReading(dt);
  // springs and fades
  const touching=ptr.id!==null;
  {const tgt=touching&&ptr.onGlobe?1:0,w=touching?38:22,z=touching?0.8:0.38;U.touchV+=(w*w*(tgt-U.touchAmt)-2*z*w*U.touchV)*dt;U.touchAmt=clamp(U.touchAmt+U.touchV*dt,-0.3,1.3);}
  {const tgt=INFO.gi>=0&&!INFO.risen?1:0,w=20,z=0.42;U.focusV+=(w*w*(tgt-U.focusAmt)-2*z*w*U.focusV)*dt;U.focusAmt+=U.focusV*dt;if(tgt===0&&U.focusAmt<0.01&&Math.abs(U.focusV)<0.05){U.focusAmt=0;U.focus=-1;}}
  U.hiAmt=lerp(U.hiAmt,INFO.gi>=0?1:0,1-Math.exp(-dt*9));
  U.chapAAmt=Math.min(1,U.chapAAmt+dt/0.35);U.chapBAmt=Math.max(0,U.chapBAmt-dt/0.35);
  const S=R.cur,risen=S&&S.lifted>S.landed&&R.clock<S.enOut+0.3;
  U.dim=lerp(U.dim,risen?0.36:1,1-Math.exp(-dt*(risen?2.5:4)));
  U.lens=lerp(U.lens,R.mode==="intro"?0:1,1-Math.exp(-dt*3));
  // the chapter you are turning past, named at the bottom
  const freeish=R.mode==="free"||(R.mode==="read"&&R.cur&&R.cur.aborted);
  const moving=freeish&&(touching||Math.abs(V.vy)>0.02||!V.settled||performance.now()<wheelUntil);
  if(moving&&INFO.gi<0){whereUntil=simT+1.4;if(V.chap!==whereK){whereK=V.chap;where.innerHTML=`第${cn(whereK+1)}章　${CH[whereK][0]}<small>chapter ${whereK+1}</small>`;}}
  where.classList.toggle("on",simT<whereUntil&&freeish&&INFO.gi<0);
  {const S=R.cur,on=!!(S&&S.wit&&!S.aborted&&R.mode==="read"&&R.clock>=S.witIn&&R.clock<S.enOut+0.15&&INFO.gi<0);if(on!==U.witOn){U.witOn=on;$("wit").classList.toggle("on",on);}}
  {const on=R.mode==="intro"||(R.cur&&R.cur.first&&R.cur.lifted===0&&!R.cur.aborted&&!U.titleDone);if(!on&&R.cur&&R.cur.lifted>0)U.titleDone=true;if(on!==U.titleOn){U.titleOn=on;$("title").classList.toggle("on",on);}}
}
function render(){
  gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(B.p);gl.uniformMatrix3fv(B.U.uRot,false,VW.M);gl.uniform1f(B.U.uDim,U.dim);gl.uniform1f(B.U.uA,U.bodyA);
  gl.bindVertexArray(bVAO);gl.drawElements(gl.TRIANGLES,bCount,gl.UNSIGNED_SHORT,0);
  if(atlasReady){
    const S=R.cur;
    gl.useProgram(G.p);const u=G.U;
    gl.uniformMatrix3fv(u.uRot,false,VW.M);gl.uniform1f(u.uT,simT);gl.uniform1f(u.uIntro,U.intro);gl.uniform1f(u.uLens,U.lens);
    gl.uniform3fv(u.uNeedle,VW.needle);gl.uniform3fv(u.uTouch,U.touch);gl.uniform1f(u.uTouchAmt,Math.max(0,U.touchAmt));
    gl.uniform2fv(u.uHiCell,U.hiCell);gl.uniform1f(u.uHiAmt,U.hiAmt);gl.uniform1f(u.uFocus,U.focus);gl.uniform1f(u.uFocusAmt,Math.max(-0.2,U.focusAmt));
    gl.uniform1f(u.uChapA,U.chapA);gl.uniform1f(u.uChapAAmt,U.chapAAmt);gl.uniform1f(u.uChapB,U.chapB);gl.uniform1f(u.uChapBAmt,U.chapBAmt);
    if(S&&S.lifted>S.landed){gl.uniform1f(u.uHoleA,S.a+S.landed);gl.uniform1f(u.uHoleB,S.a+S.lifted-1);}else{gl.uniform1f(u.uHoleA,-10);gl.uniform1f(u.uHoleB,-10);}

}

// ---------- start ----------
canvas.addEventListener("webglcontextlost",e=>{e.preventDefault();},false);
canvas.addEventListener("webglcontextrestored",()=>location.reload(),false);
document.addEventListener("visibilitychange",()=>{audio.sleep(document.hidden);if(!document.hidden)frame.last=performance.now()/1000;});
window.addEventListener("resize",resize);
load();
resize();
// open facing the passage you left off at
{const gi=STANZAS[R.posK][R.posS].a,s=slotOf[gi];V.yaw=-SPHI[s]+0.35;V.pitch=SLAT[s]+0.05;V.s=s;setRot();V.s=headFrom(V.yaw,V.pitch,s);V.q=Math.round(V.s);V.chap=gChap[gi];U.chapA=gChap[gi];}
const fontsReady=Promise.race([Promise.all([document.fonts.load(`700 40px "DDJ Serif"`,"道德經"),document.fonts.load(`700 40px "DDJ Serif"`,"分興虺蛇蜂蠆較"),document.fonts.load(`400 20px "Old Standard TT"`,"The Way")]).catch(()=>{}),new Promise(r=>setTimeout(r,2500))]);
fontsReady.then(()=>{buildAtlas();R.introAt=simT;requestAnimationFrame(frame);});
// for tests in a console: __DDJ.st() reads the state, __DDJ.ts(n) runs the clock n times faster
window.__DDJ={st:()=>({mode:R.mode,yaw:V.yaw,pitch:V.pitch,vy:V.vy,s:V.s,head:V.head,headCh:glyphs[V.head],chap:V.chap+1,settled:V.settled,held:R.held,info:INFO.gi,cur:R.cur&&{k:R.cur.k+1,s:R.cur.s,clock:+R.clock.toFixed(2),lifted:R.cur.lifted,landed:R.cur.landed,n:R.cur.n,aborted:R.cur.aborted},pressed:pressedN,cycle,stats:{...STATS},audio:audio.on,dim:+U.dim.toFixed(2),lens:+U.lens.toFixed(2),mag:VW.mag,charPx:VW.charPx,Rpx:VW.Rpx}),
  ts:x=>{TS=x;},still:x=>{R.stillDelay=x;},
  risen:()=>R.cur?R.cur.pos.map((q,j)=>q&&j>=R.cur.landed&&j<R.cur.lifted?{x:q.x,y:q.y,c:glyphs[R.cur.a+j]}:null).filter(Boolean):[],
  goto:(k,s)=>{if(R.cur&&!R.cur.aborted)abortReading();R.cur=null;R.mode="free";const gi=STANZAS[k-1][s||0].a,sl=slotOf[gi];V.yaw=-SPHI[sl];V.pitch=SLAT[sl];V.vy=V.vp=0;setRot();V.s=headFrom(V.yaw,V.pitch,sl);V.q=Math.round(V.s);V.detent=null;V.settled=false;U.intro=1;return window.__DDJ.st();},step:(sec,h)=>{h=h||1/60;for(let t=0;t<sec;t+=h)tick(h);setRot();return window.__DDJ.st();},screen:gi=>{glyphScreen(gi,tmp);return{...tmp};},slotOf:gi=>slotOf[gi],stanza:(k,s)=>STANZAS[k-1][s],raiseAll,pressAll:()=>{for(let i=0;i<N;i++)pressGlyph(i);}};
})();
