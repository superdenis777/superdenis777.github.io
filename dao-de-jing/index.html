const VS=`#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
layout(location=1) in vec3 aPos;
layout(location=2) in vec2 aCell;
layout(location=3) in vec3 aMeta;
uniform mat3 uRot;
uniform mat4 uProj;
uniform float uDist,uSize,uThick,uK,uIntro,uN,uChapter,uRead,uShift;
out vec2 vLocal;
flat out vec2 vCell;
flat out float vLayer;
out float vShade;
flat out float vHi;
void main(){
  vec3 n=normalize(aPos);
  vec3 e=cross(vec3(0.0,1.0,0.0),n);
  float el=length(e);
  e=el<1e-5?vec3(1.0,0.0,0.0):e/el;
  vec3 u=cross(n,e);
  float layer=aMeta.x,ch=aMeta.y,idx=aMeta.z;
  float st=idx/uN*0.8;
  float g=smoothstep(st,st+0.2,uIntro);
  float rad=(1.0-layer*uThick/(uK-1.0))*g;
  vec3 p=n*rad+(e*aCorner.x+u*aCorner.y)*uSize*mix(0.25,1.0,g);
  vec3 w=uRot*p;
  vec3 v=vec3(w.xy,w.z-uDist);
  gl_Position=uProj*vec4(v,1.0);
  gl_Position.y+=uShift*gl_Position.w;
  float d=length(v);
  float dmin=abs(uDist-1.0),dmax=uDist+1.0;
  float t=clamp((d-dmin)/max(dmax-dmin,1e-3),0.0,1.0);
  float shOut=mix(1.0,0.16,pow(t,0.85));
  float cv=clamp(-v.z/max(d,1e-4),0.0,1.0);
  float shIn=mix(0.2,1.0,pow(cv,1.6));
  vShade=mix(shIn,shOut,clamp((uDist-1.0)/0.4,0.0,1.0));
  vLocal=vec2(aCorner.x+0.5,0.5-aCorner.y);
  vCell=aCell;vLayer=layer;
  vHi=abs(ch-uChapter)<0.5?((uRead<0.0||idx<=uRead+0.5)?2.0:1.0):0.0;
}`;
const FS=`#version 300 es
precision highp float;
in vec2 vLocal;
flat in vec2 vCell;
flat in float vLayer;
in float vShade;
flat in float vHi;
uniform sampler2D uAtlas;
uniform float uGrid,uK,uAt;
uniform vec3 uFace,uHi,uHi2,uSideA,uSideB,uBg;
out vec4 outColor;
void main(){
  vec2 l=vLocal;
  if(!gl_FrontFacing)l.x=1.0-l.x;
  vec2 uv=(vCell+l)/uGrid;
  float a=texture(uAtlas,uv).a;
  vec2 px=fwidth(uv)*uAt;
  float lod=log2(max(max(px.x,px.y),1.0));
  float thr=clamp(0.5-0.11*lod,0.16,0.5);
  float cov=clamp((a-thr)/max(fwidth(a),1e-3)+0.5,0.0,1.0);
  if(cov<=0.0)discard;
  float top=gl_FrontFacing?0.0:uK-1.0;
  float k=abs(vLayer-top)/(uK-1.0);
  vec3 face=vHi>1.5?uHi:(vHi>0.5?uHi2:uFace);
  vec3 side=mix(uSideA,uSideB,k);
  if(vHi>0.5)side=mix(side,face*0.55,0.55);
  vec3 c=abs(vLayer-top)<0.5?face:side;
  outColor=vec4(mix(uBg,c,vShade),cov);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U={};["uRot","uProj","uDist","uSize","uThick","uK","uIntro","uN","uChapter","uRead","uShift","uAtlas","uGrid","uAt","uFace","uHi","uHi2","uSideA","uSideB","uBg"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

const vao=gl.createVertexArray();gl.bindVertexArray(vao);
function buf(data,loc,size,div){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);gl.vertexAttribDivisor(loc,div);}
buf(new Float32Array([-.5,-.5,.5,-.5,-.5,.5,.5,.5]),0,2,0);
const INST=N*K;
const aPos=new Float32Array(INST*3),aCell=new Float32Array(INST*2),aMeta=new Float32Array(INST*3);
for(let gi=0;gi<N;gi++){const ci=uIndex.get(glyphs[gi]),cx=ci%GRID,cy=Math.floor(ci/GRID);for(let k=0;k<K;k++){const j=gi*K+k;aPos[j*3]=P[gi*3];aPos[j*3+1]=P[gi*3+1];aPos[j*3+2]=P[gi*3+2];aCell[j*2]=cx;aCell[j*2+1]=cy;aMeta[j*3]=k;aMeta[j*3+1]=gChap[gi];aMeta[j*3+2]=gi;}}
buf(aPos,1,3,1);buf(aCell,2,2,1);buf(aMeta,3,3,1);

const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
gl.uniform3fv(U.uFace,hex("#ece2cc"));gl.uniform3fv(U.uHi,hex("#e2512f"));gl.uniform3fv(U.uHi2,hex("#fff6e4"));
gl.uniform3fv(U.uSideA,hex("#5b4b37"));gl.uniform3fv(U.uSideB,hex("#1d1712"));
const BG=hex("#0b0d12");gl.uniform3fv(U.uBg,BG);
gl.uniform1f(U.uSize,SIZE);gl.uniform1f(U.uThick,THICK);gl.uniform1f(U.uK,K);gl.uniform1f(U.uN,N);
gl.uniform1f(U.uGrid,GRID);gl.uniform1f(U.uAt,AT);gl.uniform1i(U.uAtlas,0);
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
gl.clearColor(BG[0],BG[1],BG[2],1);

let atlasReady=false,atlasAt=0;
function buildAtlas(){
  const cv=document.createElement("canvas");cv.width=cv.height=AT;
  const x=cv.getContext("2d");
  x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";
  x.font=`700 ${Math.round(CELL*.84)}px "DDJ Serif","Noto Serif TC","Songti TC","PMingLiU",serif`;
  uniq.forEach((c,i)=>x.fillText(c,(i%GRID)*CELL+CELL/2,Math.floor(i/GRID)*CELL+CELL/2));
  const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAX_LEVEL,3);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const an=gl.getExtension("EXT_texture_filter_anisotropic");
  if(an)gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(4,gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  atlasReady=true;atlasAt=performance.now();
}

const TAU=Math.PI*2,R_READ=1.8,R_IN=0.32,R_MIN=0.12;
const st={spin:0.5,tilt:0.62,dist:4,D0:4,tSpin:null,tTilt:null,tDist:null,chapter:0,reading:false,readPos:0,intro:reduce?1:0,lastInput:-1e9,fovY:1,aspect:1,shift:0,W:1,H:1};
const near=(raw,cur)=>raw+TAU*Math.round((cur-raw)/TAU);
const inside=()=>st.dist<1;

function rotMat(s,t){const cs=Math.cos(s),ss=Math.sin(s),ct=Math.cos(t),stt=Math.sin(t);return new Float32Array([cs,stt*ss,-ct*ss,0,ct,stt,ss,-stt*cs,ct*cs]);}
function persp(f,a,n,fa){const q=1/Math.tan(f/2),nf=1/(n-fa);return new Float32Array([q/a,0,0,0,0,q,0,0,0,0,(fa+n)*nf,-1,0,0,2*fa*n*nf,0]);}

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=canvas.clientWidth,H=canvas.clientHeight;
  canvas.width=Math.max(1,Math.round(W*dpr));canvas.height=Math.max(1,Math.round(H*dpr));
  gl.viewport(0,0,canvas.width,canvas.height);
  st.W=W;st.H=H;st.aspect=W/H;
  st.fovY=(st.aspect<1?62:45)*Math.PI/180;
  const dockH=Math.min($("strip").getBoundingClientRect().height+24,H*.3);
  st.shift=dockH/H;
  const tv=Math.tan(st.fovY/2);
  const half=Math.min(Math.atan(tv*(H-dockH)/H),Math.atan(tv*st.aspect));
  const wasDefault=Math.abs(st.dist-st.D0)<1e-3;
  st.D0=1/Math.sin(half*.9);
  if(wasDefault)st.dist=st.D0;
  gl.uniformMatrix4fv(U.uProj,false,persp(st.fovY,st.aspect,0.01,40));
  gl.uniform1f(U.uShift,st.shift);
}

function setChapterUI(k){
  st.chapter=k;
  const [t,txt]=CH[k];
  $("num").textContent="第"+cn(k+1)+"章";
  $("ttl").textContent=t;
  $("lead").textContent=txt;
  $("zh").textContent=txt;
  $("en").textContent=EN[k];
}
function aimAt(gi,keepDist){
  const raw=inside()?Math.PI-LON[gi]:-LON[gi];
  st.tSpin=near(raw,st.spin);
  st.tTilt=inside()?-LAT[gi]:LAT[gi];
  if(!keepDist&&!inside())st.tDist=Math.min(st.dist,R_READ);
}
function goChapter(k,fromTap){
  k=(k+CH.length)%CH.length;
  setChapterUI(k);
  if(st.reading){st.readPos=chStart[k];}
  else aimAt(Math.min(chStart[k]+3,chEnd[k]),false);
}
function setReading(on){
  st.reading=on;
  $("play").textContent=on?"Pause":"Read";
  $("play").setAttribute("aria-pressed",on?"true":"false");
  if(on){
    if(st.readPos<chStart[st.chapter]||st.readPos>chEnd[st.chapter])st.readPos=chStart[st.chapter];
    if(!inside())st.tDist=R_READ;
    st.tSpin=null;st.tTilt=null;
  }
}

function touched(){st.lastInput=performance.now();$("hint").classList.add("gone");}
const ptrs=new Map();let downAt=null,moved=0,lastSpan=0;
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});touched();canvas.classList.add("dragging");
  if(ptrs.size===1){downAt={x:e.clientX,y:e.clientY,t:performance.now()};moved=0;}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];lastSpan=Math.hypot(a.x-b.x,a.y-b.y);downAt=null;}});
canvas.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;touched();
  if(ptrs.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved<4)return;
    const sign=inside()?-1:1;
    const rate=2*Math.tan(st.fovY/2)/st.H*(inside()?1:Math.min(Math.max(st.dist-1,0.15),3));
    st.spin+=sign*dx*rate;st.tilt=Math.max(-1.5,Math.min(1.5,st.tilt+sign*dy*rate));
    st.tSpin=null;st.tTilt=null;if(st.reading)setReading(false);
  }else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];const span=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastSpan>0)st.dist=Math.max(R_MIN,Math.min(st.D0*1.6,st.dist*lastSpan/span));
    lastSpan=span;st.tDist=null;
  }});
function up(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0)canvas.classList.remove("dragging");
  if(ptrs.size<2)lastSpan=0;
  if(downAt&&ptrs.size===0&&moved<8&&performance.now()-downAt.t<400)pick(e.clientX,e.clientY);
  if(ptrs.size===0)downAt=null;
}
canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
canvas.addEventListener("wheel",e=>{e.preventDefault();touched();st.dist=Math.max(R_MIN,Math.min(st.D0*1.6,st.dist*Math.exp(e.deltaY*0.0012)));st.tDist=null;},{passive:false});

function pick(cx,cy){
  const r=canvas.getBoundingClientRect();
  const nx=(cx-r.left)/r.width*2-1,ny=1-(cy-r.top)/r.height*2-st.shift;
  const tf=Math.tan(st.fovY/2);
  let dx=nx*tf*st.aspect,dy=ny*tf,dz=-1;const L=Math.hypot(dx,dy,dz);dx/=L;dy/=L;dz/=L;
  const b=st.dist*dz,c=st.dist*st.dist-1,disc=b*b-c;if(disc<0)return;
  const sq=Math.sqrt(disc);let t=-b-sq;if(t<=0)t=-b+sq;if(t<=0)return;
  const hx=dx*t,hy=dy*t,hz=st.dist+dz*t;
  const m=rotMat(st.spin,st.tilt);
  const mx=m[0]*hx+m[1]*hy+m[2]*hz,my=m[3]*hx+m[4]*hy+m[5]*hz,mz=m[6]*hx+m[7]*hy+m[8]*hz;
  let best=-2,bi=0;for(let i=0;i<N;i++){const d=P[i*3]*mx+P[i*3+1]*my+P[i*3+2]*mz;if(d>best){best=d;bi=i;}}
  if(best<Math.cos(STEP*3))return;
  const k=gChap[bi];
  if(st.reading){setChapterUI(k);st.readPos=bi;}
  else{setChapterUI(k);aimAt(bi,true);}
}

$("prev").addEventListener("click",()=>{touched();goChapter(st.chapter-1);});
$("next").addEventListener("click",()=>{touched();goChapter(st.chapter+1);});
$("play").addEventListener("click",()=>{touched();setReading(!st.reading);});
$("label").addEventListener("click",()=>{const s=$("sheet"),open=!s.classList.contains("open");s.classList.toggle("open",open);$("label").setAttribute("aria-expanded",open?"true":"false");$("more").textContent=open?"Close":"Full text";});
$("inside").addEventListener("click",()=>{touched();
  const goIn=!inside();
  st.tDist=goIn?R_IN:(st.reading?R_READ:Math.max(st.D0*.75,R_READ));
  st.tSpin=near(st.spin+Math.PI,st.spin+Math.PI);st.tTilt=-st.tilt;
  $("inside").textContent=goIn?"Step out":"Go inside";
});
window.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest(".sheet"))return;
  if(e.key==="ArrowLeft"){goChapter(st.chapter-1);touched();}
  else if(e.key==="ArrowRight"){goChapter(st.chapter+1);touched();}
  else if(e.key===" "&&!(e.target instanceof HTMLButtonElement)){e.preventDefault();setReading(!st.reading);touched();}});
window.addEventListener("resize",resize);
setTimeout(()=>$("hint").classList.add("gone"),9000);

function ease(cur,target,dt,rate){return target+(cur-target)*Math.exp(-dt*rate);}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(atlasReady&&st.intro<1)st.intro=Math.min(1,(now-atlasAt)/2600);
  if(st.reading){
    st.readPos+=dt*2.4;
    if(st.readPos>=N-1){st.readPos=N-1;setReading(false);}
    const i=Math.floor(st.readPos),f=st.readPos-i,j=Math.min(i+1,N-1);
    if(gChap[i]!==st.chapter)setChapterUI(gChap[i]);
    const lon=LON[i]+(LON[j]-LON[i])*f,lat=LAT[i]+(LAT[j]-LAT[i])*f;
    const raw=inside()?Math.PI-lon:-lon;
    st.spin=ease(st.spin,near(raw,st.spin),dt,5);
    st.tilt=ease(st.tilt,inside()?-lat:lat,dt,5);
  }else{
    if(st.tSpin!==null){st.spin=ease(st.spin,st.tSpin,dt,3.2);if(Math.abs(st.spin-st.tSpin)<1e-4)st.tSpin=null;}
    if(st.tTilt!==null){st.tilt=ease(st.tilt,st.tTilt,dt,3.2);if(Math.abs(st.tilt-st.tTilt)<1e-4)st.tTilt=null;}
    if(st.tSpin===null&&!reduce&&ptrs.size===0&&now-st.lastInput>2500)st.spin-=dt*(inside()?0.025:0.05);
  }
  if(st.tDist!==null){st.dist=ease(st.dist,st.tDist,dt,2.4);if(Math.abs(st.dist-st.tDist)<1e-3){st.dist=st.tDist;st.tDist=null;}}
  $("note").classList.toggle("on",inside());
  if(inside()!==($("inside").textContent==="Step out"))$("inside").textContent=inside()?"Step out":"Go inside";
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(atlasReady){
    gl.uniformMatrix3fv(U.uRot,false,rotMat(st.spin,st.tilt));
    gl.uniform1f(U.uDist,st.dist);gl.uniform1f(U.uIntro,st.intro);
    gl.uniform1f(U.uChapter,st.chapter);gl.uniform1f(U.uRead,st.reading?st.readPos:-1);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,INST);
  }
  requestAnimationFrame(frame);
}

function start(saved){
  saved=saved||{};
  setChapterUI(Number.isInteger(saved.chapter)&&saved.chapter>=0&&saved.chapter<CH.length?saved.chapter:0);
  resize();
  if(typeof saved.dist==="number"){st.spin=saved.spin;st.tilt=saved.tilt;st.dist=saved.dist;st.intro=1;}
  else st.dist=st.D0;
  const ready=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('700 64px "DDJ Serif"',uniq.slice(0,40).join("")),new Promise(r=>setTimeout(r,3000))]):Promise.resolve();
  ready.catch(()=>{}).then(()=>{buildAtlas();});
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({chapter:st.chapter,spin:st.spin,tilt:st.tilt,dist:st.dist}));
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
</script>
</body>
